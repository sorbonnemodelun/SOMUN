/* ===== TRADUCTION AUTOMATIQUE ===== */
let trCache=ls.get("somun_tr",{});
const pending=new Set();let flushing=false,nativeT=null,trFailures=0;
function protectProperNames(str){
  return String(str)
    .replace(/\bC[ôo]me\b/gi,"Côme")
    .replace(/\bConstance\b/gi,"Constance");
}
/* Noms propres que la traduction automatique ne doit jamais modifier.
   Avant l'envoi au traducteur, chaque nom est remplacé par un mot inventé (qu'il recopie tel quel),
   puis remis à sa place dans la traduction. Pour en protéger un autre, ajouter une ligne :
   [motif tel qu'il est écrit en français, forme à afficher]. */
const TR_KEEP=[
  [/Constance/,"Constance"],   /* la ville (Konstanz en allemand) : sinon traduite « Consistency » */
  [/C[ôo]me/,"Côme"]           /* le prénom : sinon traduit « Como » */
];
const TR_TOKENS=["Zorvelan","Quilmarex","Bravetonn","Taskiravel","Moxenbury","Velquintar","Draskoval","Peltomira"];
const trSkip=new Set();
const trRx=re=>new RegExp("(^|[^\\p{L}\\p{N}])("+re.source+")(?![\\p{L}\\p{N}])","gu");
function trWrap(txt){
  let out=String(txt);const used=[];
  TR_KEEP.forEach(([re,keep],i)=>{
    const tok=TR_TOKENS[i];if(!tok)return;
    let hit=false;
    out=out.replace(trRx(re),(m,p)=>{hit=true;return p+tok});
    if(hit)used.push([tok,keep]);
  });
  return {txt:out,used};
}
function trUnwrap(res,used){
  let out=String(res);
  for(const [tok,keep] of used){
    if(!new RegExp(tok,"i").test(out))return null;
    out=out.replace(new RegExp(tok,"gi"),keep);
  }
  return out;
}
/* Une traduction gardée en mémoire est à refaire si un nom protégé y manque, ou y apparaît sans être
   dans le texte français (anciennes corrections automatiques : « consistency » → « constance »…) */
function trKeepOk(raw,tr){
  return TR_KEEP.every(([re,keep])=>trRx(re).test(raw)===new RegExp(keep,"i").test(tr));
}
function isBadTranslation(res,orig){
  if(!res||typeof res!=="string")return true;
  const u=res.toUpperCase();
  if(u.includes("MYMEMORY WARNING")||u.includes("PLEASE SELECT TWO DISTINCT")||u.includes("QUERY LENGTH LIMIT"))return true;
  return protectProperNames(res).trim()===protectProperNames(orig).trim();
}
function chunkText(txt,max=450){
  if(txt.length<=max)return [txt];
  const parts=[];
  for(const para of txt.split(/(\n+)/)){
    if(!para)continue;
    if(para.length<=max){parts.push(para);continue}
    let cur="";
    for(const word of para.split(/(\s+)/)){
      if((cur+word).length>max&&cur){parts.push(cur);cur=word}
      else cur+=word;
    }
    if(cur)parts.push(cur);
  }
  return parts;
}
function T(txt){
  if(!txt)return txt;
  const raw=String(txt);
  if(lang==="fr")return protectProperNames(raw);
  const cached=trCache[raw];
  if(cached&&!isBadTranslation(cached,raw)&&trKeepOk(raw,cached))return cached;
  if(cached)delete trCache[raw];
  if(trFailures<2&&!pending.has(raw)&&!trSkip.has(raw)){pending.add(raw);if(!flushing)flush()}
  return protectProperNames(raw);
}
async function translateChunk(txt){
  try{
    if("Translator" in self){
      if(!nativeT)nativeT=Translator.create({sourceLanguage:"fr",targetLanguage:"en"});
      return await (await nativeT).translate(txt);
    }
  }catch(e){nativeT=null}
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair=fr|en",{signal:ctrl.signal});
    const j=await r.json();
    return j&&j.responseData&&j.responseData.translatedText;
  }finally{clearTimeout(timer)}
}
async function translateOne(txt){
  const w=trWrap(txt),src=w.txt,parts=chunkText(src,450);
  let res;
  if(parts.length===1)res=await translateChunk(src);
  else{
    const out=[];
    for(const p of parts){
      if(!p.trim()){out.push(p);continue}
      const r=await translateChunk(p);
      if(isBadTranslation(r,p))return r;
      out.push(r);
    }
    res=out.join("");
  }
  if(!w.used.length||isBadTranslation(res,src))return res;
  const back=trUnwrap(res,w.used);
  return back==null?txt:back; /* nom protégé perdu en route : on garde le texte d'origine */
}
async function flush(){
  flushing=true;let changed=false;
  while(pending.size&&trFailures<2){
    const batch=[...pending].slice(0,3);
    batch.forEach(x=>pending.delete(x));
    await Promise.all(batch.map(async txt=>{
      try{
        const r=await translateOne(txt);
        if(!isBadTranslation(r,txt)){
          trCache[txt]=r;
          changed=true;trFailures=0;
        }else if(r&&r.toUpperCase().includes("MYMEMORY WARNING")){trFailures=2}
        else trSkip.add(txt); /* déjà en anglais, ou intraduisible : pas de nouvel essai avant la prochaine visite */
      }catch(e){trFailures++}
    }));
  }
  if(trFailures>=2)pending.clear();
  flushing=false;
  if(changed){ls.set("somun_tr",trCache);softRender()}
}
function softRender(){
  const a=document.activeElement;
  if((a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"))||$("#sheetbg").classList.contains("open")){
    setTimeout(softRender,1200);return;
  }
  render(true);
}

function normalizeUrl(raw,platform){
  let s=String(raw||"").trim();
  if(!s)return null;
  if(s.startsWith("@")){
    const handle=s.slice(1).replace(/^\/+|\/+$/g,"");
    if(!handle)return null;
    s=platform==="linkedin"?`https://www.linkedin.com/in/${handle}`:`https://www.instagram.com/${handle}`;
  }else if(!/^https?:\/\//i.test(s)){
    s="https://"+s.replace(/^\/+/,"");
  }
  return safeUrl(s);
}

  const s=String(u||"").trim();if(!s)return null;
  if(/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(s))return s;
  if(/^[\w.-]+\.(jpg|jpeg|png|webp|gif)$/i.test(s))return s;

};

const TABS={};
const tabsReduce=()=>Boolean(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const tabsLead=t=>1-Math.pow(1-t,4);
const tabsTrail=t=>{const u=Math.min(1,Math.max(0,(t-.12)/.88));return u<.5?4*u*u*u:1-Math.pow(2-2*u,3)/2};
function tabsBuild(id,items,cur,opt){
  const box=$("#"+id);if(!box)return;
  let s=TABS[id];
  if(!s){
    s=TABS[id]={id,box,l:null,w:null,raf:0,rq:0,goal:null,sig:"",ink:null,hov:null,ro:null};
    if(opt.hover){s.hov=document.createElement("span");s.hov.className="tab-hover";s.hov.setAttribute("aria-hidden","true");box.appendChild(s.hov);tabsHover(s)}
    s.pill=document.createElement("span");s.pill.className=opt.pill;s.pill.setAttribute("aria-hidden","true");
    if(opt.ink){s.ink=document.createElement("span");s.ink.className="tab-ink";s.pill.appendChild(s.ink)}
    box.appendChild(s.pill);
    if("ResizeObserver" in window){s.ro=new ResizeObserver(()=>{cancelAnimationFrame(s.rq);s.rq=requestAnimationFrame(()=>tabsSync(s,true))});s.ro.observe(box)}
  }
  if(opt.label)box.setAttribute("aria-label",opt.label);
  const sig=items.map(i=>i[0]+":"+i[1]).join("|");
  if(sig!==s.sig){
    s.sig=sig;
    box.querySelectorAll(":scope>button").forEach(b=>{if(s.ro)s.ro.unobserve(b);b.remove()});
    box.insertAdjacentHTML("beforeend",items.map(([k,l,ico,click])=>`<button type="button" data-k="${k}" onclick="${click||`go('${k}')`}">${ico?`<span class="ico" aria-hidden="true">${ico}</span>`:""}${esc(l)}</button>`).join(""));
    if(s.ink)s.ink.innerHTML=items.map(i=>`<span>${esc(i[1])}</span>`).join("");
    if(s.ro)box.querySelectorAll(":scope>button").forEach(b=>s.ro.observe(b));
  }
  box.querySelectorAll(":scope>button").forEach(b=>{const on=b.dataset.k===cur;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
function tabsSync(s,instant){
  if(!s)return;
  const box=s.box,btns=[...box.querySelectorAll(":scope>button")];
  if(!box.offsetWidth){cancelAnimationFrame(s.raf);s.raf=0;s.pill.style.opacity="0";s.l=null;s.goal=null;box.classList.remove("ready");return}
  if(s.ink)btns.forEach((b,i)=>{const e=s.ink.children[i];if(e)e.style.cssText=`left:${b.offsetLeft}px;top:${b.offsetTop}px;width:${b.offsetWidth}px;height:${b.offsetHeight}px`});
  if(s.hov)box.classList.toggle("tight",box.scrollWidth>box.clientWidth+1);
  tabsGo(s,btns.find(b=>b.classList.contains("on")),instant);
}
function tabsPut(s,l,w){s.l=l;s.w=w;s.pill.style.left=l+"px";s.pill.style.width=w+"px";if(s.ink)s.ink.style.left=-l+"px"}
function tabsGo(s,btn,instant){
  const pill=s.pill;
  if(!btn){cancelAnimationFrame(s.raf);s.raf=0;pill.style.opacity="0";s.l=null;s.goal=null;return}
  const L=btn.offsetLeft,W=btn.offsetWidth,goal=L+":"+W;
  pill.style.top=btn.offsetTop+"px";pill.style.height=btn.offsetHeight+"px";
  if(s.ink)s.ink.style.top=-btn.offsetTop+"px";
  if(s.raf&&s.goal===goal)return;
  s.goal=goal;
  tabsReveal(s,btn,instant);
  if(instant||s.l==null||tabsReduce()||(Math.abs(L-s.l)<1&&Math.abs(W-s.w)<1)){
    cancelAnimationFrame(s.raf);s.raf=0;
    const fresh=!s.box.classList.contains("ready");
    if(fresh)pill.style.transition="none";
    tabsPut(s,L,W);pill.classList.remove("moving");pill.style.opacity="1";s.box.classList.add("ready");
    if(fresh){pill.getBoundingClientRect();pill.style.transition=""}
    return;
  }
  cancelAnimationFrame(s.raf);
  const L0=s.l,R0=s.l+s.w,R1=L+W,toRight=L>L0,cap=Math.max(s.w,W)+150;
  const dur=Math.min(620,Math.max(320,260+Math.abs(L+W/2-(L0+s.w/2))*.5));
  let t0=null;
  pill.classList.add("moving");pill.style.opacity="1";
  const step=now=>{
    if(t0==null)t0=now;
    const t=Math.max(0,Math.min(1,(now-t0)/dur)),lead=tabsLead(t),trail=tabsTrail(t);
    let l=L0+(L-L0)*(toRight?trail:lead),r=R0+(R1-R0)*(toRight?lead:trail);
    if(r-l>cap){if(toRight)l=r-cap;else r=l+cap}
    tabsPut(s,l,r-l);
    if(t<1)s.raf=requestAnimationFrame(step);
    else{s.raf=0;pill.classList.remove("moving")}
  };
  s.raf=requestAnimationFrame(step);
}
function tabsReveal(s,btn,instant){
  const box=s.box;if(box.scrollWidth<=box.clientWidth+1)return;
  const a=btn.offsetLeft-14,b=btn.offsetLeft+btn.offsetWidth+14;let x=box.scrollLeft;
  if(a<x)x=a;else if(b>x+box.clientWidth)x=b-box.clientWidth;
  if(x!==box.scrollLeft)box.scrollTo({left:x,behavior:instant||tabsReduce()?"auto":"smooth"});
}
function tabsHover(s){
  const box=s.box,h=s.hov;
  box.addEventListener("pointerover",e=>{
    if(e.pointerType!=="mouse")return;
    const b=e.target.closest&&e.target.closest("button");
    if(!b||b.parentNode!==box)return;
    const first=!box.classList.contains("hovering");
    if(first)h.style.transition="opacity .2s ease";
    h.style.left=b.offsetLeft+"px";h.style.top=b.offsetTop+"px";h.style.width=b.offsetWidth+"px";h.style.height=b.offsetHeight+"px";
    if(first){h.getBoundingClientRect();box.classList.add("hovering");requestAnimationFrame(()=>{h.style.transition=""})}
  });

function agDayMap(evs){

/* Places en hémicycle, comme sur le logo : pleines = prises, vides = libres, or = la tienne */
function agSeatsSVG(e,dark,width){
  const n=agCapOf(e),taken=Math.min(n,D.taken[e.id]||0);
  if(!n||n>120)return "";
  const you=D.myRegs[e.id]&&taken>0?taken-1:-1;
  const rows=n<=14?2:n<=36?3:n<=64?4:5,rIn=46,rOut=100;
  const radii=Array.from({length:rows},(_,i)=>rIn+(rOut-rIn)*i/(rows-1));
  const tot=radii.reduce((a,b)=>a+b,0),per=radii.map(r=>Math.max(3,Math.round(n*r/tot)));
  let sum=per.reduce((a,b)=>a+b,0);
  while(sum>n){per[per.indexOf(Math.max(...per))]--;sum--}
  while(sum<n){per[per.indexOf(Math.max(...per))]++;sum++}
  const seats=[];
  radii.forEach((r,ri)=>{for(let j=0;j<per[ri];j++){const a=Math.PI*(j+.5)/per[ri];seats.push([Math.PI-a,110-r*Math.cos(a),108-r*Math.sin(a)])}});
  seats.sort((p,q)=>q[0]-p[0]);
  const rad=Math.min(7.2,.42*Math.PI*rIn/Math.max(per[0],1));
  const full=dark?"#FFFFFF":"#020259",free=dark?"rgba(255,255,255,.5)":"#7D84B8";
  const dots=seats.map(([,x,y],i)=>{
    const c=`cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"`;
    if(i===you)return `<circle ${c} r="${(rad+.8).toFixed(1)}" fill="#EBC000" stroke="#020259" stroke-width="1.6"/>`;
    if(i<taken)return `<circle ${c} r="${rad.toFixed(1)}" fill="${full}"/>`;
    return `<circle ${c} r="${Math.max(1,rad-.8).toFixed(1)}" fill="none" stroke="${free}" stroke-width="1.6"/>`;
  }).join("");
  const lbl=t("ag_seats_aria",{t:taken,n})+(you>=0?t("ag_seats_aria_you"):"");
  return `<svg class="ag-hemi" viewBox="0 0 220 118" width="${width}" height="${Math.round(width*118/220)}" role="img" aria-label="${esc(lbl)}">${dots}</svg>`;
}

/* --- Frise de la saison (accueil) --- */
function agRibbonHTML(){
  const y=Number(currentSeason().slice(0,4));
  const all=Array.from({length:12},(_,i)=>agIso(new Date(y,7+i,1,12)).slice(0,7));
  const evs=D.events.filter(e=>agOk(e)&&isoDay(e.date)>=all[0]+"-01"&&isoDay(e.date)<=all[11]+"-31");
  if(!evs.length)return "";
  const used=new Set();evs.forEach(e=>{used.add(isoDay(e.date).slice(0,7));used.add(agEnd(e).slice(0,7))});
  const months=all.slice(used.has(all[0])?0:1,(used.has(all[11])?11:10)+1),M=months.length;
  const pos=iso=>{
    const mi=months.indexOf(iso.slice(0,7));
    if(mi<0)return iso<months[0]?0:100;
    const [yy,mm,d]=iso.split("-").map(Number);
    return 100*(mi+(d-1)/new Date(yy,mm,0).getDate())/M;
  };
  const lanes=[...AG_ORDER.filter(k=>evs.some(e=>e.type===k)),...new Set(evs.map(e=>e.type||"").filter(k=>!AG_TYPES[k]))];
  const H=34,h=H*lanes.length,today=todayStr(),nowIn=today>=months[0]+"-01"&&today.slice(0,7)<=months[M-1],x0=nowIn?pos(today):0;
  const ticks=evs.map(e=>{
    const li=lanes.indexOf(e.type||""),x=pos(isoDay(e.date)),st=D.myRegs[e.id];
    const w=agMulti(e)?`calc(${(pos(agEnd(e))-x).toFixed(2)}% + 14px)`:"14px";
    const lbl=`${T(e.title)}, ${long(e.date)}${st==="confirmed"?", "+t("ag_confirmed"):st==="pending"?", "+t("pending"):""}`;
    return `<a class="sv-tick${st?" mine":""}${agPast(e)?" past":""}" ${agGo(e)} title="${esc(lbl)}" aria-label="${esc(lbl)}" style="${agTC(e.type)};left:${x.toFixed(2)}%;top:${li*H+(H-14)/2}px;width:${w}"></a>`;
  }).join("");
  const cur=today.slice(0,7);
  return `<section class="tile sv" aria-labelledby="sv-h">
   <div class="sv-head"><h2 class="agh" id="sv-h">${t("ag_ribbon_t")}</h2><p>${t("ag_ribbon_s")}${S.user?" "+t("ag_ribbon_me"):""}</p></div>
   <div class="sv-scroll"><div class="sv-grid">
    <div class="sv-lanes">${lanes.map(k=>`<span class="sv-lane" style="${agTC(k)}">${esc(agTypeName(k))}</span>`).join("")}</div>
    <div>
     <div class="sv-months" style="grid-template-columns:repeat(${M},minmax(0,1fr))">${months.map(m=>`<span${m===cur?' class="cur"':""}>${esc(agMonthName(m,{month:"short"}))}</span>`).join("")}</div>
     <div class="sv-plot" style="height:${h}px">
      ${nowIn?`<span class="sv-past" style="width:${x0.toFixed(2)}%" aria-hidden="true"></span>`:""}
      ${months.slice(1).map((m,i)=>`<span class="sv-sep" style="left:${(100*(i+1)/M).toFixed(2)}%" aria-hidden="true"></span>`).join("")}
      ${lanes.slice(1).map((k,i)=>`<span class="sv-hl" style="top:${(i+1)*H}px" aria-hidden="true"></span>`).join("")}
      ${nowIn?`<span class="sv-now" style="left:${x0.toFixed(2)}%" aria-hidden="true"></span><span class="sv-pill${x0<7?" l":x0>93?" r":""}" style="left:${x0.toFixed(2)}%;top:${h+10}px">${esc(t("ag_today",{d:agF(today,{day:"numeric",month:"short"})}))}</span>`:""}
      ${ticks}
     </div>
    </div>
   </div></div>
  </section>`;
}

  // Mois de la saison (août à juillet ; août et juillet seulement s'ils ont des événements)
  const sy=M>=8?Y:Y-1,all=Array.from({length:12},(_,i)=>agIso(new Date(sy,7+i,1,12)).slice(0,7));
  const byM={};evs.forEach(e=>{const k=isoDay(e.date).slice(0,7),o=byM[k]=byM[k]||{c:0,m:0};o.c++;if(D.myRegs[e.id])o.m++});
  const strip=all.filter((m,i)=>(i>0&&i<11)||byM[m]||m===ym).map(m=>{
    const o=byM[m];
    return `<button type="button"${o?"":' class="nil"'}${m===ym?' aria-current="true"':""} aria-label="${esc(agCap(agMonthName(m))+", "+(o?tn("ag_cnt",o.c):t("ag_mnone")))}" onclick="agGoMonth('${m}')"><b>${esc(agMonthName(m,{month:"short"}))}</b><span>${o&&o.m?'<i aria-hidden="true"></i>':""}${o?esc(tn("ag_cnt",o.c)):"—"}</span></button>`;
  }).join("");
  const touch=evs.filter(e=>isoDay(e.date)<=ym+"-31"&&agEnd(e)>=ym+"-01"),mine=touch.filter(e=>D.myRegs[e.id]).length;
  const sum=touch.length?t("ag_msum",{c:tn("ag_cnt",touch.length)})+(mine?tn("ag_mmine",mine):""):t("ag_mnone");
  const prev=agAddM(ym,-1),next=agAddM(ym,1),curYM=today.slice(0,7);
  const nav=`<div class="ag-mnav"><div><button type="button" class="ag-arrow" data-nav="-1" aria-label="${esc(agCap(agMonthName(prev)))}" onclick="agShift(-1)">${agIco("chevl")}</button><h2 class="agh ag-mh" id="ag-mh">${esc(agCap(agMonthName(ym)))}</h2><button type="button" class="ag-arrow" data-nav="1" aria-label="${esc(agCap(agMonthName(next)))}" onclick="agShift(1)">${agIco("chevr")}</button></div><p>${esc(sum)}</p>${ym!==curYM?`<button class="btn ghost sm" onclick="agGoMonth('${curYM}')">${esc(t("ag_this_month"))}</button>`:""}</div>`;
  const start=(new Date(Y,M-1,1,12).getDay()+6)%7,cells=Math.ceil((start+new Date(Y,M,0).getDate())/7)*7;
  const head=[0,1,2,3,4,5,6].map(i=>{const d=new Date(2024,0,1+i,12);return `<span><span class="lg">${esc(d.toLocaleDateString(loc(),{weekday:"long"}))}</span><span class="st">${esc(d.toLocaleDateString(loc(),{weekday:"narrow"}))}</span></span>`}).join("");
  /* Une bande par semaine. En haut, les événements sur plusieurs jours : chacun forme un bandeau
     limité à la semaine (il reprend sur la suivante), rangé sur des lignes de même hauteur, 3 au plus.
     En dessous, chaque jour liste ses événements d'un jour, 2 au plus ; le reste est compté
     dans la case (« +2 autres »). Un titre long sur deux lignes ne décale donc aucun bandeau. */
  const MAXL=3,MAXD=2;let weeks="";
  for(let w=0;w<cells/7;w++){
    const days=[0,1,2,3,4,5,6].map(i=>{const d=new Date(Y,M-1,1-start+w*7+i,12);return {d,k:agIso(d)}});
    const ws=days[0].k,we=days[6].k,col=k=>days.findIndex(x=>x.k===k);
    const segs=evs.filter(e=>isoDay(e.date)<=we&&agEnd(e)>=ws).map(e=>{
      const s=isoDay(e.date),f=agEnd(e);
      return {e,a:s<ws?0:col(s),b:f>we?6:col(f),cl:s<ws,cr:f>we,multi:f>s};
    }).filter(g=>g.a>=0&&g.b>=g.a);
    const ttl=g=>String(g.e.title||"");
    const multi=segs.filter(g=>g.multi).sort((x,y)=>x.a-y.a||(y.b-y.a)-(x.b-x.a)||ttl(x).localeCompare(ttl(y)));
    const single=segs.filter(g=>!g.multi).sort((x,y)=>String(x.e.heure||"").localeCompare(String(y.e.heure||""))||ttl(x).localeCompare(ttl(y)));
    const lanes=[];
    multi.forEach(g=>{let l=0;while(lanes[l]&&lanes[l].some(o=>g.a<=o.b&&g.b>=o.a))l++;(lanes[l]=lanes[l]||[]).push(g);g.l=l});
    const B=Math.min(MAXL,lanes.length),hidden=[0,0,0,0,0,0,0];
    multi.forEach(g=>{if(g.l>=MAXL)for(let c=g.a;c<=g.b;c++)hidden[c]++});
    const perDay=days.map((x,i)=>single.filter(g=>g.a===i));
    perDay.forEach((l,i)=>{if(l.length>MAXD)hidden[i]+=l.length-MAXD});
    const cellsH=days.map(({d,k},i)=>{
      const oth=!inM(k),n=(map[k]||[]).length,h=hidden[i];
      const lbl=agCap(agF(k,{weekday:"long",day:"numeric",month:"long"}))+(n?", "+tn("ag_cnt",n):"");
      const cls=["ag-c",i>4?"we":"",oth?"oth":"",k===today?"today":"",k===agDay?"sel":""].filter(Boolean).join(" ");
      return `<div class="${cls}" style="grid-column:${i+1}"><button type="button" class="ag-dn" data-d="${k}" aria-pressed="${k===agDay}" aria-label="${esc(lbl)}" onclick="agPick('${k}')"><span>${d.getDate()}</span>${oth&&(d.getDate()===1||(w===0&&i===0))?`<small>${esc(agF(k,{month:"short"}))}</small>`:""}</button>${h?`<span class="ag-more" aria-hidden="true">+${h}<span class="lg">&nbsp;${esc(h===1?t("agm_more_1"):t("agm_more_n"))}</span></span>`:""}</div>`;
    }).join("");
    const link=(g,pos)=>{
      const e=g.e,st=D.myRegs[e.id],past=agPast(e),hm=g.multi?"":hhmm(e.heure);
      const c=["ag-ev",g.multi?"span":"one",st==="confirmed"?"mine":"",st==="pending"&&!past?"pend":"",g.cl?"cl":"",g.cr?"cr":"",past?"past":""].filter(Boolean).join(" ");
      return `<a class="${c}" ${agGo(e)} style="${agTC(e.type)}${pos||""}" title="${esc(T(e.title)+(agWhen(e)?" · "+agWhen(e):""))}"><i aria-hidden="true"></i><span>${hm?`<b class="tm">${esc(hm)} </b>`:""}${esc(T(e.title))}</span></a>`;
    };
    const bars=multi.filter(g=>g.l<MAXL).map(g=>link(g,`;grid-column:${g.a+1}/${g.b+2};grid-row:${g.l+2}`)).join("");
    const lists=perDay.map((l,i)=>l.length?`<div class="ag-dl" style="grid-column:${i+1};grid-row:${B+2}">${l.slice(0,MAXD).map(g=>link(g)).join("")}</div>`:"").join("");
    weeks+=`<div class="ag-wk" style="grid-template-rows:var(--hd)${B?` repeat(${B},var(--bh))`:""} auto minmax(${hidden.some(Boolean)?"var(--mr)":"8px"},1fr)">${cellsH}${bars}${lists}</div>`;
  }
  const legend=`<div class="ag-legend">${S.user?`<span><i aria-hidden="true"></i>${t("ag_yours")}</span><span><i class="p" aria-hidden="true"></i>${t("pending")}</span>`:""}<span><i class="t" aria-hidden="true"></i>${esc(agCap(t("today")))}</span></div>`;
  return `<nav class="ag-strip" aria-label="${esc(t("ag_months"))}">${strip}</nav>${nav}
  <div class="ag-cal"><div class="ag-gridw"><div class="ag-mg" role="group" aria-labelledby="ag-mh"><div class="ag-mhd" aria-hidden="true">${head}</div>${weeks}</div>${legend}</div>${agPanelHTML(map)}</div>`;
}

  const l=(map[agDay]||[]).map(x=>x.e);
  return `<aside class="ag-panel" id="agp" aria-labelledby="agp-h">
   <h2 class="agh ag-ph" id="agp-h">${esc(agCap(agF(agDay,{weekday:"long",day:"numeric",month:"long"})))}</h2>
   <p class="ag-pc">${esc(l.length?t("ag_dsum",{c:tn("ag_cnt",l.length)}):t("ag_dnone"))}</p>
   ${l.map(agPanelEv).join("")}

   ${e.description?`<p class="ag-desc">${esc(agExcerpt(T(e.description),170))}</p>`:""}</div>
   <div class="ag-pev-a">${n&&!past&&agTracked(e)?`<div class="ag-seats">${agSeatsSVG(e,false,150)}<p><b>${left}</b>${esc(left?tn("ag_leftof",left,{c:n}):t("full"))}</p></div>`:""}

  const b=document.querySelector(`#list .ag-dn[data-d="${k}"]`);if(b)b.focus({preventScroll:true});

  const b=document.querySelector(`#list .ag-arrow[data-nav="${n}"]`);if(b)b.focus({preventScroll:true});

/* --- Fiche événement --- */
function vEvent(){
  if(D.loading)return loadingBox();
  const back=`<a class="ev3-back" href="#activites" onclick="event.preventDefault();go('activites')">${agIco("left")}${t("activities")}</a>`;
  const e=D.events.find(x=>String(x.id)===String(evSel));
  if(!e){
    if(/^cf-/.test(String(evSel))&&(!CF.ready||CF.busy||CF.uid!==cfUid()))return loadingBox();
    return `<div class="v3 v3-page">${back}<div class="tile ag-nores" style="margin-top:14px">${t("ev_404")}</div></div>`;
  }
  const id=idArg(e.id),st=D.myRegs[e.id],ok=agOk(e),past=ok?agPast(e):false,img=safeUrl(e.image_url),formHref=safeUrl(e.form_url);
  const canEditSG=e.type==="Training"&&isTrainingLead();
  const sgHref=safeUrl(e.study_guide_url);
  const canSeeSG=Boolean(sgHref)&&(st==="confirmed"||canEditSG);
  const n=agCapOf(e),tk=D.taken[e.id]||0,left=agLeft(e),paid=agPaid(e);

  let dateHTML="";
  if(ok){
    const s=isoDay(e.date),f=agEnd(e),multi=f>s,h=hhmm(e.heure),sameM=s.slice(0,7)===f.slice(0,7);
    const srTxt=multi?t("ag_from_to",{a:long(s),b:long(f)})+(h?", "+t("ag_from",{h}):""):long(s)+(h?" "+t("at")+" "+h:"");
    const day=x=>`<span class="ev3-d" aria-hidden="true"><small>${esc(agF(x,{weekday:"long"}))}</small><span class="ev3-n">${dd(x).getDate()}</span></span>`;
    const mo=multi&&!sameM?`${agF(s,{month:"short"})} – ${agF(f,{month:"short"})}`:agF(s,{month:"long"});
    const tm=h?(multi?t("ag_from",{h}):h):"";
    dateHTML=`<div class="ev3-date"><span class="sr">${esc(srTxt)}</span>${day(s)}${multi?`<span class="ev3-to" aria-hidden="true">→</span>${day(f)}`:""}<span class="ev3-my" aria-hidden="true"><b>${esc(mo)}</b><span>${dd(f).getFullYear()}</span>${tm?`<em>${agIco("clock",18,2)}${esc(tm)}</em>`:""}</span></div>`;
  }
  const mapHref=e.lieu?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.lieu)}`:"";
  const head=`<div class="ev3-head">${dateHTML}<div class="ev3-id"><div class="ag-tags" style="${agTC(e.type)}"><span class="ag-chip">${esc(agTypeName(e.type))}</span><span>${esc(agAccess(e))}</span></div><h1 class="ev3-h1">${esc(T(e.title))}</h1>${e.lieu?`<p class="ev3-where"><span>${agIco("pin",17)}${esc(T(e.lieu))}</span><a href="${esc(mapHref)}" target="_blank" rel="noopener noreferrer">${t("ag_map")}${agIco("ext",15)}</a></p>`:""}</div></div>`;
  const staff=(isStaff()||canEditSG)?`<div class="ev3-staff">${isStaff()?(e.conference_id?`<button class="btn ghost sm" onclick="go('conferences')">${t("cf_edit_in")}</button>`:`<button class="btn ghost sm" onclick="editEvent(${id})">${t("edit")}</button><button class="btn danger sm" onclick="delEventFromView(${id},this)">${t("del")}</button>`):""}${canEditSG?`<button class="btn ghost sm" onclick="editStudyGuide(${id})">${t("sg_edit")}</button>`:""}</div>`:"";

  const sgTitle=esc(T(e.study_guide_title||t("sg_box")));
  const docs=(sgHref||canEditSG)?`<section><h2 class="agh ev3-h2">${t("ag_docs")}</h2>${
    canSeeSG?`<a class="ev3-doc open" href="${esc(sgHref)}" target="_blank" rel="noopener noreferrer"><span class="ev3-doc-ico">${agIco("doc",21)}</span><span class="ev3-doc-t"><b>${sgTitle}</b><span>${t("ag_sg_go")}</span></span>${agIco("ext",17)}</a>`
    :sgHref?`<div class="ev3-doc"><span class="ev3-doc-ico">${agIco("lock",20)}</span><span class="ev3-doc-t"><b>${sgTitle}</b><span>${t("ag_sg_locked")}</span></span></div>`
    :`<div class="ev3-doc"><span class="ev3-doc-ico">${agIco("doc",20)}</span><span class="ev3-doc-t"><b>${esc(t("sg_box"))}</b><span>${t("ag_sg_none")}</span></span></div>`}</section>`:"";
  const facts=!e.description&&!img&&ok?`<section><h2 class="agh ev3-h2">${t("ag_facts")}</h2><dl class="ev3-facts"><div><dt>${t("ag_f_when")}</dt><dd>${esc(agCap(agMulti(e)?t("ag_from_to",{a:long(e.date),b:long(agEnd(e))}):long(e.date)))}${agWhen(e)?", "+esc(agWhen(e)):""}</dd></div>${e.lieu?`<div><dt>${t("ag_f_where")}</dt><dd>${esc(T(e.lieu))}</dd></div>`:""}<div><dt>${t("ag_f_access")}</dt><dd>${esc(agAccess(e))}</dd></div></dl></section>`:"";
  const mainInner=`${facts}${img?`<img class="ev3-img" src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:""}${e.description?`<section><h2 class="agh ev3-h2">${t("ag_odj_ev")}</h2><p class="ev3-desc">${esc(T(e.description))}</p></section>`:""}${docs}${paid&&!past&&st!=="confirmed"&&!formHref?`<p class="ev3-note">${t("paid_cancel")}</p>`:""}`;

  const ics=`<button class="btn ghost-dark" onclick="agIcs(${id})">${agIco("calplus")}${t("ag_ics")}</button>`;
  const steps=[[t("ag_s1_t"),t("ag_s1_d")],[t("ag_s2_t",{p:esc(e.prix)}),t("ag_s2_d")],[t("ag_s3_t"),t("ag_s3_d")]];
  let status="",stepsHTML="",info="",acts="";
  if(past){
    info=`<p class="ev3-line">${t("ag_past_line")}</p>`;
  }else if(st==="confirmed"){
    status=`<div class="ev3-status"><i>${agIco("check",17,2.6)}</i><span><b>${t("ag_s3_t")}</b><small>${t("ag_conf_sub")}</small></span></div>`;
    acts=(canSeeSG?`<a class="btn gold" href="${esc(sgHref)}" target="_blank" rel="noopener noreferrer">${agIco("doc")}${t("ag_sg")}</a>`:"")+ics+(paid?"":`<button class="ev3-cancel" onclick="cancelReg(${id},this)">${t("cancel_reg")}</button>`);
    if(paid)info=`<p class="ev3-line">${t("paid_cancel")}</p>`;
  }else if(st==="pending"){
    status=`<div class="ev3-status"><i>${agIco("hourglass",17,2.2)}</i><span><b>${t("pending")}</b>${paid?`<small>${t("ag_pend_sub")}</small>`:""}</span></div>`;
    if(paid)stepsHTML=agSteps(steps,1,1,true);
    acts=(paid?`<button class="btn gold" onclick="payEvent(${id})">${t("ag_pay_ha",{p:esc(e.prix)})}${agIco("ext",16)}</button>`:"")+ics+`<button class="ev3-cancel" onclick="cancelReg(${id},this)">${t("cancel_reg")}</button>`;
  }else if(e.conference_id){
    info=`<p class="ev3-line">${t("cf_ev_line")}</p>`;
    acts=`<button class="btn gold" onclick="go('conferences')">${t("cf_see")}</button>`+ics;
  }else if(formHref){
    info=`<p class="ev3-line">${t("ag_form_line")}</p>`;
    acts=`<button class="btn gold" onclick="openFormEvent(${id})">${t("ag_form_btn")}${agIco("ext",16)}</button>`+ics;
  }else if(left<=0){
    info=`<p class="ev3-line">${t("ag_full_line")}</p>`;
  }else{
    if(e.members_only)info+=`<p class="ev3-line">${t("ag_mem_line")}</p>`;
    if(paid)stepsHTML=agSteps(steps,0,0,true);else info+=`<p class="ev3-line">${t("ag_free_line")}</p>`;
    acts=`<button class="btn gold" onclick="openReg(${id})">${paid?t("go_pay"):t("reg")}</button>`+ics;
  }
  const panel=`<aside class="ev3-panel" aria-labelledby="ev3-reg">
   <div class="ev3-ph"><h2 class="agh" id="ev3-reg">${t("ag_reg_t")}</h2><span class="ev3-price">${esc(agPriceTxt(e))}</span></div>
   ${n&&agTracked(e)?`<div class="ev3-seats">${agSeatsSVG(e,true,180)}<p><b>${past?tk:left}</b>${esc(past?tn("ag_tkof",tk,{c:n}):left?tn("ag_leftof",left,{c:n}):t("full"))}</p></div>`:""}
   ${status}${stepsHTML?`<div class="ev3-steps">${stepsHTML}</div>`:""}${info}
   ${acts?`<div class="ev3-acts">${acts}</div>`:""}
   ${paid&&!past&&st!=="confirmed"&&!formHref?`<p class="ev3-fine">${t("ag_secure")}</p>`:""}
  </aside>`;

  const more=agUpcoming().filter(x=>String(x.id)!==String(e.id)).slice(0,3);
  const moreHTML=more.length?`<section class="ev3-more"><h2 class="agh ev3-h2">${t("ag_also")}</h2><div class="ev3-tiles">${more.map(x=>{
    const p=agParts(x),l=agLeft(x),s2=D.myRegs[x.id];
    return `<a class="ev3-tile" ${agGo(x)} style="${agTC(x.type)}"><span class="ag-when"><small>${esc(p.wd)}</small><span class="ag-day${p.rng?" rng":""}">${esc(p.day)}</span><small>${esc(p.mon)}</small></span><span class="ev3-tt"><span class="ag-chip">${esc(agTypeName(x.type))}</span><b>${esc(T(x.title))}</b><span>${esc(s2==="confirmed"?t("ag_confirmed"):s2==="pending"?t("pending"):x.conference_id?t("ag_on_sel"):l>0?agCap(tn("ag_free",l)):t("full"))}</span></span></a>`;
  }).join("")}</div></section>`:"";

  return `<div class="v3 v3-page ev3">${back}${head}${staff}
   <div class="ev3-cols">${mainInner?`<div class="ev3-main">${mainInner}</div>`:""}${panel}</div>
   ${(isStaff()||canEditSG)&&!e.conference_id?registrantsBlock(e):""}
   ${moreHTML}
  </div>`;
}

function agBadge(e){

    :agPaid(e)?`<button class="btn gold sm" onclick="payEvent(${id})">${t("ag_pay_x",{p:esc(e.prix)})}</button>`:"";

   <div class="mr-body"><div class="mr-date"><span class="mr-n${p.rng?" rng":""}">${esc(p.day)}</span><span>${esc(line)}${when?`<br>${esc(when)}`:""}</span></div>
   <h3 class="mr-t"><a ${agGo(e)}>${esc(T(e.title))}</a></h3>${e.lieu?`<p class="mr-place">${agIco("pin",14)}${esc(T(e.lieu))}</p>`:""}
   <div class="mr-foot">${status}${acts}</div></div>

const AG_VTZ=["BEGIN:VTIMEZONE","TZID:Europe/Paris","BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT","BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE"];
function agIcsText(list){
  const enc=new TextEncoder(),stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const tx=s=>String(s??"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const fold=l=>{let out="",n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>74){out+="\r\n ";n=1}out+=ch;n+=b}return out};
  const ymd=d=>agIso(d).replace(/-/g,""),hm=d=>String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SOMUN//Agenda//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH",...AG_VTZ];
  list.forEach(e=>{
    const s=isoDay(e.date),[y,m,d]=s.split("-").map(Number),h=hhmm(e.heure),multi=agMulti(e);
    const url=location.origin+location.pathname+"#event-"+sid(e.id);
    L.push("BEGIN:VEVENT","UID:somun-event-"+sid(e.id)+"@somun","DTSTAMP:"+stamp);
    if(h&&!multi){
      const [H,Mi]=h.split(":").map(Number),a=new Date(y,m-1,d,H,Mi||0),b=new Date(y,m-1,d,H+2,Mi||0);
      L.push(`DTSTART;TZID=Europe/Paris:${ymd(a)}T${hm(a)}`,`DTEND;TZID=Europe/Paris:${ymd(b)}T${hm(b)}`);
    }else{
      const fin=dd(agEnd(e));fin.setDate(fin.getDate()+1);
      L.push("DTSTART;VALUE=DATE:"+s.replace(/-/g,""),"DTEND;VALUE=DATE:"+ymd(fin));
    }
    L.push(fold("SUMMARY:"+tx(T(e.title))));
    if(e.lieu)L.push(fold("LOCATION:"+tx(T(e.lieu))));
    L.push(fold("DESCRIPTION:"+tx([e.description?T(e.description):"",multi&&h?t("ag_from",{h}):"",url].filter(Boolean).join("\n\n"))),fold("URL:"+url),"END:VEVENT");
  });
  L.push("END:VCALENDAR");

async function upDecode(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
  /* Repli : lecture en data: (les adresses blob: sont bloquées par la politique de sécurité du site) */
  const url=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko({code:"up_type"});r.readAsDataURL(file)});

async function upImage(file,folder,max){
  const type=String((file&&file.type)||"").toLowerCase();
  if(!UP_TYPES.includes(type))throw {code:"up_type"};
  if(file.size>40*1024*1024)throw {code:"up_big"};

const cfLink=raw=>{const u=normalizeUrl(raw);if(!u)return null;try{return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(new URL(u).hostname)?u:null}catch(e){return null}};
const cfUrl=v=>{const raw=String(v||"").trim();return raw?cfLink(raw):null};

async function cfLoad(){
  if(!sb){CF={ready:true,busy:false,missing:false,uid:null,list:[],deleg:[],logi:[]};cfMergeAgenda();return}
  const uid0=cfUid();
  CF.busy=true;
  try{
    /* Tout le monde reçoit la liste publique (sans lien d'inscription). La table complète, avec le lien,
       n'est lue que par les comptes qui y ont droit (adhérents à jour, Bureau, délégués). */
    const none=Promise.resolve({data:[],error:null}),u=Boolean(S.user);
    const [pub,c,d,l]=await Promise.all([
      sb.rpc("somun_conferences_public"),
      u?sb.from("conferences").select("*").order("start_date",{ascending:true}):none,
      u?sb.from("conference_delegates").select("*"):none,
      u?sb.from("conference_logistics").select("*"):none
    ]);
    CF.missing=[c,d,l].some(r=>isMissingTableErr(r.error));
    const full=c.error?[]:(c.data||[]),byId=new Map(full.map(x=>[String(x.id),x]));
    CF.list=pub.error?full:(pub.data||[]).map(x=>byId.get(String(x.id))||x); /* sans la fonction (SQL pas lancé) : comme avant */
    CF.deleg=d.error?[]:(d.data||[]);CF.logi=l.error?[]:(l.data||[]);
  }finally{CF.ready=true;CF.busy=false;CF.uid=uid0;cfMergeAgenda()}
}
/* Agenda : chaque conférence datée y est ajoutée par le site, sauf si elle y est déjà
   (ligne créée par le déclencheur Supabase, ou événement ajouté à la main avec le même nom et la même date) */
const cfEvKey=e=>[e.id,e.title,e.date,e.date_fin,e.lieu,e.image_url,e.places].join("|");
function cfMergeAgenda(){
  if(!Array.isArray(D.events))return false;
  const before=D.events.filter(e=>e._cf).map(cfEvKey).join("§"),real=D.events.filter(e=>!e._cf),add=[];
  const norm=v=>String(v||"").trim().toLowerCase();
  if(CF.ready&&CF.uid===cfUid())CF.list.forEach(c=>{
    const s=cfDay(c.start_date);if(!s)return; /* sans date, pas de place dans le calendrier */
    if(real.some(e=>e.conference_id!=null&&String(e.conference_id)===String(c.id)))return;
    if(real.some(e=>e.conference_id==null&&e.type==="Conférence"&&cfDay(e.date)===s&&norm(e.title)===norm(c.name)))return;
    const f=cfDay(c.end_date),ph=cfPhotosOf(c);
    add.push({id:"cf-"+c.id,_cf:true,conference_id:c.id,title:c.name,type:"Conférence",lieu:c.city||"",date:s,date_fin:f&&f>s?f:null,heure:null,
      prix:0,places:Math.max(Number(c.seats)||0,1),image_url:ph[0]||null,description:null,form_url:null,helloasso_slug:null,members_only:true});
  });
  D.events=add.length?real.concat(add).sort((a,b)=>String(cfDay(a.date)).localeCompare(String(cfDay(b.date)))):real;
  return before!==add.map(cfEvKey).join("§");
}
/* Charge les conférences en arrière-plan dès qu'un membre est connecté, pour l'agenda et l'accueil */

/* Vrai si conferences.sql n'a pas encore été lancé (la table events n'a pas la colonne conference_id) */
const cfNoAgendaLink=()=>{const real=(D.events||[]).filter(e=>!e._cf);return real.length>0&&!real.some(e=>"conference_id" in e)};
function cfParts(c){
  const s=cfDay(c.start_date);if(!s)return null;
  const e=cfDay(c.end_date),f=e&&e>s?e:s,multi=f>s,a=dd(s),b=dd(f),sameM=s.slice(0,7)===f.slice(0,7);
  return {multi,
    day:multi?`${a.getDate()}–${b.getDate()}`:String(a.getDate()),
    wd:multi?`${agF(s,{weekday:"short"})}–${agF(f,{weekday:"short"})}`:agF(s,{weekday:"short"}),
    mon:multi&&!sameM?`${agF(s,{month:"short"})}–${agF(f,{month:"short"})}`:agF(s,{month:"short",year:"numeric"}),
    long:multi?t("ag_from_to",{a:long(s),b:long(f)}):long(s)};
}

/* --- Visionneuse de photos (clavier : flèches et Échap ; glisser du doigt sur téléphone) --- */
let LB=null;
function cfLb(id,i){const c=cfFind(id);if(c)lbShow(cfPhotosOf(c),i,T(c.name))}
function lbShow(ph,i,name){
  if(!ph||!ph.length)return;
  LB={ph,i:Math.max(0,Math.min(ph.length-1,Number(i)||0)),name,back:document.activeElement,x:null};
  let el=$("#lb");
  if(!el){
    el=document.createElement("div");el.id="lb";el.className="lb";el.hidden=true;
    el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-labelledby","lbCap");
    el.innerHTML=`<figure class="lb-fig"><img class="lb-img" alt=""><figcaption class="lb-cap" id="lbCap" aria-live="polite"></figcaption></figure>
     <button type="button" class="lb-b lb-x" onclick="lbClose()"></button><button type="button" class="lb-b lb-p" onclick="lbGo(-1)"></button><button type="button" class="lb-b lb-n" onclick="lbGo(1)"></button>`;
    el.addEventListener("click",e=>{if(e.target===el||e.target.classList.contains("lb-fig"))lbClose()});
    el.addEventListener("touchstart",e=>{if(LB)LB.x=e.touches[0].clientX},{passive:true});
    el.addEventListener("touchend",e=>{if(!LB||LB.x==null)return;const dx=e.changedTouches[0].clientX-LB.x;LB.x=null;if(Math.abs(dx)>45)lbGo(dx<0?1:-1)});
    document.body.appendChild(el);
  }
  [[".lb-x","x","lb_close"],[".lb-p","chevl","lb_prev"],[".lb-n","chevr","lb_next"]].forEach(([s,ic,k])=>{const b=el.querySelector(s);b.innerHTML=agIco(ic,24,2.2);b.setAttribute("aria-label",t(k))});
  lbDraw();
  el.hidden=false;document.body.classList.add("lb-open");
  document.addEventListener("keydown",lbKey,true);window.addEventListener("hashchange",lbClose);
  el.querySelector(".lb-x").focus();
}
function lbDraw(){
  const el=$("#lb");if(!el||!LB)return;
  const n=LB.ph.length;
  el.querySelector(".lb-img").src=LB.ph[LB.i];
  el.querySelector(".lb-cap").textContent=t("lb_cap",{t:LB.name,i:LB.i+1,n});
  el.querySelectorAll(".lb-p,.lb-n").forEach(b=>{b.hidden=n<2});
  if(n>1)[1,-1].forEach(d=>{const im=new Image();im.src=LB.ph[(LB.i+d+n)%n]});
}
function lbGo(d){if(!LB)return;const n=LB.ph.length;LB.i=(LB.i+d+n)%n;lbDraw()}
function lbClose(){
  const el=$("#lb");if(!el||el.hidden)return;
  el.hidden=true;document.body.classList.remove("lb-open");
  document.removeEventListener("keydown",lbKey,true);window.removeEventListener("hashchange",lbClose);
  const b=LB&&LB.back;LB=null;
  if(b&&document.contains(b)&&b.focus)b.focus();
}
function lbKey(e){
  if(!LB)return;
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();lbClose()}
  else if(e.key==="ArrowLeft"){e.preventDefault();lbGo(-1)}
  else if(e.key==="ArrowRight"){e.preventDefault();lbGo(1)}
  else if(e.key==="Tab"){
    const f=[...$("#lb").querySelectorAll("button:not([hidden])")],k=f.indexOf(document.activeElement);
    e.preventDefault();f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus();
  }
}

async function cfPhUpload(inp){

/* --- Onglet Bureau & Fiche Bio grand format --- */
function firstKey(name){
  return String(name||"").trim().split(/\s+/)[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function sortedBoard(){
  return [...D.board].sort((a,b)=>{
    const ia=BOARD_ORDER.indexOf(firstKey(a.name));
    const ib=BOARD_ORDER.indexOf(firstKey(b.name));
    const ra=ia===-1?999:ia;
    const rb=ib===-1?999:ib;
    if(ra!==rb)return ra-rb;
    return (a.sort||0)-(b.sort||0);
  });
}
function boardMemberPhoto(m){
  const key=firstKey(m.name);
  const custom=safeAsset(m.photo_url||m.avatar_url||m.image_url);
  if(custom){
    const preset=BOARD_PHOTOS[key];
    if(key==="come"&&(!preset||custom!==preset))return preset||"photo_come_bureau.jpeg";
    return custom;
  }
  return BOARD_PHOTOS[key]||null;
}
function boardBioPhoto(m){
  const key=firstKey(m.name);
  const dedicated=safeAsset(m.bio_photo_url||m.detail_photo_url||m.portrait_url);
  if(dedicated)return dedicated;
  const presetBio=safeAsset(BOARD_BIO_PHOTOS[key]);
  if(presetBio)return presetBio;
  if(key==="come")return "photo_bio_come.jpeg";
  return boardMemberPhoto(m);
}
function handleImgError(img){
  const src=img.getAttribute("src")||"";
  if(!img.dataset.fb1&&src.toLowerCase().endsWith(".jpeg")){
    img.dataset.fb1="1";
    img.src=src.slice(0,-5)+".jpg";
    return;
  }
  if(!img.dataset.fb2&&img.dataset.fallback==="1"){
    img.dataset.fb2="1";
    img.src="IMG_2778.jpeg";
    return;
  }
  const div=document.createElement("div");
  div.className=img.className;
  div.textContent=img.dataset.init||"?";
  img.replaceWith(div);
}
function avatarMarkup(src,init,cls,extraCls=""){
  const safe=safeAsset(src);
  const fullCls=extraCls?`${cls} ${extraCls}`:cls;
  const hasJpegFallback=safe&&safe.toLowerCase().endsWith(".jpeg")?"1":"0";
  return safe
    ?`<img class="${esc(fullCls)}" src="${esc(safe)}" alt="${esc(init)}" data-init="${esc(init)}" data-fallback="${hasJpegFallback}" loading="lazy" onerror="handleImgError(this)">`
    :`<div class="${esc(fullCls)}">${esc(init)}</div>`;
}
function vBureau(){
  if(D.loading)return loadingBox();
  const ordered=sortedBoard();
  return `<h1>${t("bureau_t")}</h1><p class="mute">${t("bureau_s")}</p>${typeof leadsJump==="function"?leadsJump():""}
  <div class="bureau-wrap" style="margin-top:16px">
    <div class="board-grid" id="bureau-top">${ordered.map(m=>{
      const pUrl=boardMemberPhoto(m);
      const init=((m.name||"?").trim()[0]||"?").toUpperCase();
      const om=(i=>i===-1?99:i)(BOARD_ORDER_MOBILE.indexOf(firstKey(m.name)));
      return `<div class="card board-card reveal" style="--om:${om}" role="button" tabindex="0" onclick="openBoardBio(${idArg(m.id)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBoardBio(${idArg(m.id)})}">
        ${avatarMarkup(pUrl,init,"board-photo")}
        <span class="tag">${esc(T(lang==="fr"?m.role_fr:(m.role_en||m.role_fr)))}</span>
        <h3 style="margin-top:8px">${esc(protectProperNames(m.name))}</h3>
        <span class="board-hint">${t("see_bio")} →</span>
      </div>`;
    }).join("")}</div>
    ${typeof leadsSection==="function"?leadsSection():""}
  </div>`;
}
function openBoardBio(id){
  const m=D.board.find(x=>String(x.id)===String(id));if(!m)return;
  const key=firstKey(m.name);
  const bUrl=boardBioPhoto(m);
  const init=((m.name||"?").trim()[0]||"?").toUpperCase();
  const roleLabel=T(lang==="fr"?m.role_fr:(m.role_en||m.role_fr));
  const bioText=m.bio?T(m.bio):t("no_bio");
  const ig=normalizeUrl(m.instagram_url||m.insta_url,"instagram");
  const li=normalizeUrl(m.linkedin_url,"linkedin");
  const links=[];
  if(ig)links.push(`<a href="${esc(ig)}" target="_blank" rel="noopener noreferrer">Instagram</a>`);
  if(li)links.push(`<a href="${esc(li)}" target="_blank" rel="noopener noreferrer">LinkedIn</a>`);
  const socialBlock=links.length
    ?`<div class="bio-socials"><span class="bio-socials-lbl">${t("follow")}</span><div class="bio-socials-links">${links.join("")}</div></div>`
    :"";
  const isCome=key==="come";
  const focusCls=isCome?"focus-come":"";
  const wrapExtraCls=isCome?"focus-come-wrap":"";
  const fadeExtraCls=isCome?"focus-come-fade":"";

  openSheet(`<div class="bio-modal">
    <div class="bio-hero-wrap ${wrapExtraCls}">
      ${avatarMarkup(bUrl,init,"bio-hero-photo",focusCls)}
      <div class="bio-hero-fade ${fadeExtraCls}"></div>
    </div>
    <div class="bio-body">
      <span class="tag">${esc(roleLabel)}</span>
      <h3 style="margin-top:8px">${esc(protectProperNames(m.name))}</h3>
      <div class="bio-text">${esc(bioText)}</div>
      <div class="bio-footer">
        <div class="bio-actions">
          ${isStaff()?`<button class="btn sm" onclick="editBoardBio(${idArg(m.id)})">✏️ ${t("edit_bio_photo")}</button>`:""}
          <button class="btn ghost sm" onclick="closeSheet()">${t("cancel")}</button>
        </div>
        ${socialBlock}
      </div>
    </div>
  </div>`,"bio-sheet");

  if(isCome){
    requestAnimationFrame(()=>{
      const wrap=document.querySelector("#sheet .bio-hero-wrap");
      const img=document.querySelector("#sheet .bio-hero-photo");
      const fade=document.querySelector("#sheet .bio-hero-fade");
      if(wrap){
        wrap.style.setProperty("height","clamp(340px, 52vh, 480px)","important");
        wrap.style.setProperty("overflow","hidden","important");
        wrap.style.setProperty("position","relative","important");

      if(img&&img.tagName==="IMG"){
        img.style.setProperty("width","100%","important");
        img.style.setProperty("height","100%","important");
        img.style.setProperty("object-fit","cover","important");
        img.style.setProperty("object-position","82% 38%","important");
      }
      if(fade){
        fade.style.setProperty("top","auto","important");

function previewBioPhoto(val){
  const form=$("#bioEditForm");
  const init=(form&&form.dataset.init)||"?";
  const box=$("#sheet .bio-preview");
  if(!box)return;
  const safe=safeAsset(val);
  if(safe){
    const img=document.createElement("img");
    img.className="bio-preview";
    img.src=safe;
    img.alt=init;
    img.dataset.init=init;
    img.dataset.fallback=safe.toLowerCase().endsWith(".jpeg")?"1":"0";
    img.onerror=function(){handleImgError(this)};
    box.replaceWith(img);
  }else{

    div.className="bio-preview";

  }

async function saveBoardBio(ev,id){
  ev.preventDefault();
  if(!isStaff())return toast(t("admin_only"));
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const rawPhoto=String(f.get("bio_photo_url")||"").trim();
    const bioPhoto=rawPhoto?safeAsset(rawPhoto):null;
    if(rawPhoto&&!bioPhoto)return toast(t("e_url"));
    const rawIg=String(f.get("instagram_url")||"").trim();
    const rawLi=String(f.get("linkedin_url")||"").trim();
    const ig=rawIg?normalizeUrl(rawIg,"instagram"):null;
    const li=rawLi?normalizeUrl(rawLi,"linkedin"):null;
    if((rawIg&&!ig)||(rawLi&&!li))return toast(t("e_url"));
    const bio=String(f.get("bio")||"").trim()||null;
    const payload={bio,bio_photo_url:bioPhoto,instagram_url:ig,linkedin_url:li};
    let res=await sb.from("board_members").update(payload).eq("id",id);
    if(res.error&&/column/i.test(res.error.message||"")){
      const fallback={bio};
      if("bio_photo_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.bio_photo_url=bioPhoto;
      if("instagram_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.instagram_url=ig;
      if("linkedin_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.linkedin_url=li;
      res=await sb.from("board_members").update(fallback).eq("id",id);
    }
    if(res.error)return toast(errMsg(res.error));
    await loadPublic();render(true);openBoardBio(id);toast(t("t_ok"));
  });
}

function exportCSV(id){
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  const cell=v=>{let x=String(v??"");if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const lines=[[t("col_ln"),t("col_fn"),t("col_mail"),t("col_member"),t("col_status")].map(cell).join(";")]
    .concat(registrantRows().map(r=>[r.nom,r.prenom,r.email,r.paid?t("yes"):t("no"),stLabel(r.status)].map(cell).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const slug=String(e.title||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`inscrits-${isoDay(e.date)}-${slug}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const SUBPOLE_MATCH={

function isGroupPole(p){
  const s=`${p.slug||""} ${p.name_fr||""} ${p.name_en||""}`.toLowerCase();
  // Le pôle « Relations externes » regroupe les sous-pôles Culturel, Partenariats et Alumni
  return /relations?[\s_-]*ext|external[\s_-]*relations?/.test(s)||(s.includes("culturel")&&(s.includes("partenar")||s.includes("alumni")));

  const txt=String(task.title||"");

}

function isTaskOverdue(tk){
  if(!tk.due_date||tk.status==="done")return false;
  return isoDay(tk.due_date)<todayStr();
}
function isTaskSoon(tk){
  if(!tk.due_date||tk.status==="done")return false;
  const d=daysTo(tk.due_date);
  return d>=0&&d<=2;
}
function assigneeName(uid){
  if(!uid)return null;
  const m=D.members.find(x=>x.id===uid);
  if(!m)return null;
  return protectProperNames(`${m.prenom||""} ${m.nom||""}`.trim()||m.email||"");
}
function poleTeamRoster(pid){
  const list=D.memberPoles.filter(x=>String(x.pole_id)===String(pid));
  const byId=Object.fromEntries(D.members.map(m=>[m.id,m]));
  return list.map(pm=>({user_id:pm.user_id,role:pm.role,member:byId[pm.user_id]||{}}));
}

async function addTask(ev,pid){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    let title=String(f.get("title")||"").trim();
    const sub=String(f.get("subpole")||"").trim().toLowerCase();
    if(sub&&["culturel","partenariats","alumni"].includes(sub))title=`[${sub}] ${title}`;
    const priority=String(f.get("priority")||"normal");
    const due_date=String(f.get("due_date")||"").trim()||null;
    const assigned_to=String(f.get("assigned_to")||"").trim()||null;
    const tbl=await detectTaskTable();
    const payload={pole_id:pid,title,status:"todo",priority,due_date,assigned_to,created_by:S.user?S.user.id:null};
    let res=await sb.from(tbl).insert(payload);
    if(res.error&&/column/i.test(res.error.message||"")){
      res=await sb.from(tbl).insert({pole_id:pid,title,status:"todo"});
    }
    if(res.error)return toast(errMsg(res.error));
    ev.target.reset();await loadTasks();render(true);
  });
}
async function setTaskStatus(id,next){
  const tk=D.tasks.find(x=>String(x.id)===String(id));if(!tk||tk.status===next)return;
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({status:next}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.status=next;render(true);
}
async function moveTask(id,dir){
  const cols=["todo","doing","done"],tk=D.tasks.find(x=>String(x.id)===String(id));if(!tk)return;
  const next=cols[cols.indexOf(tk.status)+dir];if(!next)return;
  await setTaskStatus(id,next);
}
const dropTask=st=>{if(dragId!=null)moveTask(dragId,(["todo","doing","done"].indexOf(st)-["todo","doing","done"].indexOf((D.tasks.find(x=>String(x.id)===String(dragId))||{}).status)))};
async function delTask(id,btn){
  await withBusy(btn,async()=>{
    const tbl=await detectTaskTable();
    const {error}=await sb.from(tbl).delete().eq("id",id);
    if(error)return toast(errMsg(error));
    D.tasks=D.tasks.filter(x=>String(x.id)!==String(id));render(true);
  });
}
async function toggleSubtask(taskId,idx){
  const tk=D.tasks.find(x=>String(x.id)===String(taskId));if(!tk)return;
  const items=Array.isArray(tk.checklist)?[...tk.checklist]:[];
  if(!items[idx])return;
  items[idx]={...items[idx],done:!items[idx].done};
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({checklist:items}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.checklist=items;
  if(taskModalId&&String(taskModalId)===String(tk.id))openTaskDetail(tk.id);
  render(true);
}

async function saveTaskDetail(ev,tid){
  ev.preventDefault();
  const tk=D.tasks.find(x=>String(x.id)===String(tid));if(!tk)return;
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    let title=String(f.get("title")||"").trim();
    const sub=String(f.get("subpole")||"").trim().toLowerCase();
    if(sub&&["culturel","partenariats","alumni"].includes(sub))title=`[${sub}] ${title}`;
    const rawRes=String(f.get("resource_url")||"").trim();
    const resource_url=rawRes?normalizeUrl(rawRes):null;
    if(rawRes&&!resource_url)return toast(t("e_url"));
    const payload={
      title,
      status:String(f.get("status")||tk.status),
      priority:String(f.get("priority")||"normal"),
      due_date:String(f.get("due_date")||"").trim()||null,
      assigned_to:String(f.get("assigned_to")||"").trim()||null,
      resource_url,
      description:String(f.get("description")||"").trim()||null
    };

    let res=await sb.from(tbl).update(payload).eq("id",tk.id);
    if(res.error&&/column/i.test(res.error.message||"")){
      res=await sb.from(tbl).update({title:payload.title,status:payload.status}).eq("id",tk.id);
    }
    if(res.error)return toast(errMsg(res.error));

async function addSubtask(ev,tid){
  ev.preventDefault();
  const tk=D.tasks.find(x=>String(x.id)===String(tid));if(!tk)return;
  const f=new FormData(ev.target),step=String(f.get("step")||"").trim();if(!step)return;
  const items=[...(Array.isArray(tk.checklist)?tk.checklist:[]),{text:step,done:false}];
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({checklist:items}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.checklist=items;render(true);openTaskDetail(tk.id);
}
async function removeSubtask(tid,idx){
  const tk=D.tasks.find(x=>String(x.id)===String(tid));if(!tk)return;
  const items=(Array.isArray(tk.checklist)?tk.checklist:[]).filter((_,i)=>i!==idx);
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({checklist:items}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.checklist=items;render(true);openTaskDetail(tk.id);
}

async function toggleMemberPaid(uid,paid,btn){
  await withBusy(btn,async()=>{
    const until=paid?academicYearEnd():null;
    const {error}=await sb.from("profiles").update({paid,paid_until:until}).eq("id",uid);
    if(error)return toast(errMsg(error));
    if(paid){
      await sb.from("membership_history").insert({user_id:uid,season:currentSeason(),source:"Validation manuelle Bureau",paid_until:until});
    }
    const m=D.members.find(x=>x.id===uid);if(m){m.paid=paid;m.paid_until=until}
    if(S.user&&uid===S.user.id)await loadPrivate(false);
    render(true);toast(t("t_ok"));
  });
}
async function importHelloAssoCSV(input){
  const file=input.files&&input.files[0];if(!file)return;
  const text=await file.text();input.value="";
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return toast(t("e_generic"));
  const sep=lines[0].includes(";")?";":",";
  const headers=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  const emailIdx=headers.findIndex(h=>h.includes("email")||h.includes("e-mail")||h.includes("courriel"));
  if(emailIdx<0)return toast("Colonne e-mail introuvable dans le CSV.");
  const emails=[...new Set(lines.slice(1).map(l=>(l.split(sep)[emailIdx]||"").replace(/^"|"$/g,"").trim().toLowerCase()).filter(e=>e.includes("@")))];
  const until=academicYearEnd(),season=currentSeason();
  let matched=0,queued=0;
  for(const em of emails){
    const m=D.members.find(x=>(x.email||"").toLowerCase()===em||(x.helloasso_email||"").toLowerCase()===em);
    if(m){
      const {error}=await sb.from("profiles").update({paid:true,paid_until:until}).eq("id",m.id);
      if(!error){
        matched++;
        await sb.from("membership_history").insert({user_id:m.id,season,source:"Import CSV HelloAsso",paid_until:until});
      }
    }else{
      const {error}=await sb.from("helloasso_pending").upsert({email:em,season,paid_until:until},{onConflict:"email"});
      if(!error)queued++;
    }
  }
  await loadAdmin();render(true);toast(t("csv_done",{m:matched,q:queued}));
}
async function syncHelloAssoAPI(btn){
  await withBusy(btn,async()=>{
    const {data,error}=await sb.functions.invoke("helloasso-sync",{body:{season:currentSeason(),paid_until:academicYearEnd()}});
    if(error){
      console.warn(error);
      return toast("Edge Function 'helloasso-sync' non déployée — utilise l'import CSV HelloAsso.");
    }
    await loadAdmin();render(true);toast(t("csv_done",{m:(data&&data.matched)||0,q:(data&&data.queued)||0}));
  });
}
async function resetAcademicYear(btn){
  if(!confirm(t("confirm_reset_year")))return;
  await withBusy(btn,async()=>{
    const today=todayStr();
    const expired=D.members.filter(m=>m.paid&&(!m.paid_until||isoDay(m.paid_until)<=today));
    const targets=expired.length?expired:D.members.filter(m=>m.paid);
    for(const m of targets){
      await sb.from("profiles").update({paid:false,paid_until:null}).eq("id",m.id);
    }
    await loadAdmin();render(true);toast(t("reset_year_done",{n:targets.length}));
  });
}
async function togglePole(uid,pid,btn){
  await withBusy(btn,async()=>{
    const idx=D.memberPoles.findIndex(x=>x.user_id===uid&&String(x.pole_id)===String(pid));
    const {error}=idx>-1?await sb.from("pole_members").delete().eq("user_id",uid).eq("pole_id",pid):await sb.from("pole_members").insert({user_id:uid,pole_id:pid,role:"member"});
    if(error)return toast(errMsg(error));
    if(idx>-1)D.memberPoles.splice(idx,1);else D.memberPoles.push({user_id:uid,pole_id:pid,role:"member"});
    if(S.user&&uid===S.user.id)await loadPrivate(false);
    render(true);
  });
}

async function saveSiteSettings(ev){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const rawHero=String(f.get("hero_img")||"").trim(),hero=rawHero?safeAsset(rawHero):null;
    const rawIg=String(f.get("instagram_url")||"").trim(),ig=rawIg?normalizeUrl(rawIg,"instagram"):null;
    const rawLi=String(f.get("linkedin_url")||"").trim(),li=rawLi?normalizeUrl(rawLi,"linkedin"):null;
    if((rawHero&&!hero)||(rawIg&&!ig)||(rawLi&&!li))return toast(t("e_url"));
    const rows=[
      {key:"hero_img",value:hero||""},
      {key:"contact_email",value:String(f.get("contact_email")||"").trim()},
      {key:"cotisation",value:String(Math.max(0,Number(f.get("cotisation"))||DEFAULT_COTISATION))},
      {key:"cotisation_boursier",value:String(Math.max(0,Number(f.get("cotisation_boursier"))||DEFAULT_COTISATION_BOURSIER))},
      {key:"instagram_url",value:ig||""},
      {key:"linkedin_url",value:li||""}
    ];
    const {error}=await sb.from("site_settings").upsert(rows,{onConflict:"key"});
    if(error)return toast(errMsg(error));
    await loadPublic();render(true);toast(t("t_ok"));
  });
}

async function saveBoard(ev,id){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const rawPhoto=String(f.get("photo_url")||"").trim(),photo=rawPhoto?safeAsset(rawPhoto):null;
    const rawBioPhoto=String(f.get("bio_photo_url")||"").trim(),bioPhoto=rawBioPhoto?safeAsset(rawBioPhoto):null;
    if((rawPhoto&&!photo)||(rawBioPhoto&&!bioPhoto))return toast(t("e_url"));
    const rawIg=String(f.get("instagram_url")||"").trim(),ig=rawIg?normalizeUrl(rawIg,"instagram"):null;
    const rawLi=String(f.get("linkedin_url")||"").trim(),li=rawLi?normalizeUrl(rawLi,"linkedin"):null;
    if((rawIg&&!ig)||(rawLi&&!li))return toast(t("e_url"));
    const row={
      name:f.get("name").trim(),
      role_fr:f.get("role_fr").trim(),
      role_en:(f.get("role_en")||"").trim()||null,
      bio:(f.get("bio")||"").trim()||null,
      photo_url:photo,
      bio_photo_url:bioPhoto,
      instagram_url:ig,
      linkedin_url:li
    };
    let res=id==null?await sb.from("board_members").insert(row):await sb.from("board_members").update(row).eq("id",id);
    if(res.error&&/column/i.test(res.error.message||"")){
      const baseRow={name:row.name,role_fr:row.role_fr,role_en:row.role_en,bio:row.bio};
      res=id==null?await sb.from("board_members").insert(baseRow):await sb.from("board_members").update(baseRow).eq("id",id);
    }
    if(res.error)return toast(errMsg(res.error));
    closeSheet();await loadPublic();render(true);toast(t("t_ok"));

async function submitAuth(ev){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const email=String(f.get("email")||"").trim().toLowerCase();
    const password=String(f.get("password")||"");
    const redirectTo=location.origin+location.pathname;
    if(authMode==="forgot"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
      if(error)return toast(authErr(error));
      authInfo=t("reset_sent");render();return;
    }
    if(authMode==="signup"){
      const prenom=String(f.get("prenom")||"").trim();
      const nom=String(f.get("nom")||"").trim();
      const {data,error}=await sb.auth.signUp({
        email,
        password,
        options:{
          emailRedirectTo:redirectTo,
          data:{prenom,nom}
        }
      });
      if(error)return toast(authErr(error));
      if(data&&data.user&&data.session){
        await sb.from("profiles").upsert(
          {id:data.user.id,email,prenom,nom},
          {onConflict:"id",ignoreDuplicates:false}
        ).catch(()=>{});
      }
      if(!data||!data.session){authMode="login";authInfo=t("check_mail");render();return}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)return toast(authErr(error));
    }
    authInfo="";toast(t("t_welcome"));go("accueil",true);
  });
}

/* ===== JEU : QUIZ DES ROP ===== */
const QZ_LEVELS=[[0,"🌱","Observateur","Observer"],[100,"🎙️","Délégué","Delegate"],[300,"📜","Sponsor","Sponsor"],[550,"⚖️","Rapporteur","Rapporteur"],[800,"🏛️","Chair","Chairperson"],[1000,"🌐","Secrétaire général","Secretary-General"]];
let qz=null,lbBusy=false;
const qzPoints=()=>Object.values(D.quiz).filter(x=>x.mastered).length*10;
const qzMastered=()=>Object.values(D.quiz).filter(x=>x.mastered).length;
function qzLevel(pts){let l=QZ_LEVELS[0],next=null;for(let i=0;i<QZ_LEVELS.length;i++){if(pts>=QZ_LEVELS[i][0]){l=QZ_LEVELS[i];next=QZ_LEVELS[i+1]||null}}return{ico:l[1],name:lang==="fr"?l[2]:l[3],min:l[0],next:next?{pts:next[0],name:lang==="fr"?next[2]:next[3]}:null}}
function qzShuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function qzRing(pct,size=122,sw=10){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="${sw}"/><circle class="qz-ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--or)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" style="--c:${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function qzStart(mode,ch){
  let pool=mode==="ch"?QUIZ.filter(q=>q.ch===ch):mode==="weak"?QUIZ.filter(q=>!(D.quiz[q.id]&&D.quiz[q.id].mastered)):QUIZ;
  if(!pool.length){toast(t("qz_all_mastered"));return}
  pool=qzShuffle(pool);if(mode==="mix")pool=pool.slice(0,20);
  qz={mode,ch:ch||null,qs:pool.map(q=>{const [qt,...opts]=q[lang],pairs=opts.map((txt,k)=>({txt,ok:k===0}));return{q,qt,opts:qzShuffle(pairs)}}),i:0,picked:null,streak:0,best:0,right:0,gain:0,wrong:[],beforePts:qzPoints(),end:false};
  render(false,true);
}
async function qzPick(idx){
  if(!qz||qz.picked!==null)return;
  const cur=qz.qs[qz.i],ok=cur.opts[idx].ok;
  qz.picked=idx;
  if(ok){qz.streak++;qz.best=Math.max(qz.best,qz.streak);qz.right++}else{qz.streak=0;qz.wrong.push(cur)}
  const prev=D.quiz[cur.q.id]||{attempts:0,correct:0,mastered:false};
  const next={attempts:prev.attempts+1,correct:prev.correct+(ok?1:0),mastered:prev.mastered||ok};
  if(ok&&!prev.mastered)qz.gain+=10;
  D.quiz[cur.q.id]=next;
  if(!S.user)ls.set("somun_qz",D.quiz);
  else{const {error}=await sb.from("quiz_progress").upsert({user_id:S.user.id,q_id:cur.q.id,attempts:next.attempts,correct:next.correct,mastered:next.mastered},{onConflict:"user_id,q_id"});if(error&&!qz.saveErr){qz.saveErr=true;toast(t("qz_save_err"))}}
  render(true);
}
function qzNext(){
  if(!qz)return;
  if(qz.i+1<qz.qs.length){qz.i++;qz.picked=null;render(true)}
  else{qz.end=true;D.lb=null;render(true);if(qz.right/qz.qs.length>=.7)qzConfetti()}
}
function qzConfetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";
  const cols=["#EBC000","#00008E","#3ddc84","#ff6b78","#ffffff"];
  for(let i=0;i<42;i++){const s=document.createElement("i");s.style.left=(Math.random()*100)+"%";s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.45)+"s";s.style.setProperty("--dx",((Math.random()-.5)*220)+"px");s.style.setProperty("--rot",(Math.random()*720-360)+"deg");box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3200);
}
async function loadLeaderboard(force=false){
  if((lbBusy&&!force)||!configured)return;lbBusy=true;
  const {data,error}=await sb.rpc("quiz_leaderboard");
  lbBusy=false;
  if(error){console.warn(error);D.lb=[];return}
  D.lb=data||[];
  if(route==="quiz"&&!qz)softRender();
}
async function qzReset(){
  if(!confirm(t("qz_reset_ask")))return;
  D.quiz={};ls.set("somun_qz",{});
  if(S.user){const {error}=await sb.from("quiz_progress").delete().eq("user_id",S.user.id);if(error)return toast(errMsg(error))}
  D.lb=null;toast(t("qz_reset_done"));render(true);
}
function vJeu(){
  if(qz)return qz.end?vQuizEnd():vQuizPlay();
  const total=QUIZ.length,m=qzMastered(),pts=qzPoints(),lv=qzLevel(pts),pct=total?Math.round(m/total*100):0;
  const att=Object.values(D.quiz).reduce((a,x)=>a+x.attempts,0),cor=Object.values(D.quiz).reduce((a,x)=>a+x.correct,0),acc=att?Math.round(cor/att*100):0;
  const weak=total-m;
  const lvPct=lv.next?Math.min(100,Math.round((pts-lv.min)/(lv.next.pts-lv.min)*100)):100;
  if(D.lb===null&&configured)loadLeaderboard();
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div><h1 style="margin-bottom:2px">${t("game_t")}</h1><p class="mute" style="margin:0">${t("game_s")}</p></div>
    <button class="btn ghost sm" onclick="go('ressources')">📘 ${t("qz_open_rop")}</button>
  </div>
  <div class="qz-hero">
    <div class="qz-ringbox">${qzRing(pct)}<div class="qz-ringtxt"><b>${m}</b><span>/ ${total}</span></div></div>
    <div class="qz-herotxt">
      <div class="qz-lv"><span class="qz-lvico">${lv.ico}</span><span>${esc(lv.name)}</span></div>
      <div class="qz-pts"><b>${pts}</b> ${t("qz_points")}</div>
      <div class="qz-lvbar"><span style="width:${lvPct}%"></span></div>
      <div class="qz-lvtxt">${lv.next?t("qz_next_level",{n:lv.next.pts-pts,l:lv.next.name}):t("qz_max")}</div>
      ${att?`<div class="qz-mini"><span>${pct}% ${t("qz_mastered")}</span><span>${acc}% ${t("qz_accuracy")}</span></div>`:""}
    </div>
  </div>
  ${S.user?"":`<div class="card qz-guest"><span>${t("qz_guest")}</span><button class="btn sm" onclick="go('login')">${t("login")}</button></div>`}
  <div class="qz-modes">
    <button class="qz-mode" onclick="qzStart('mix')"><span class="qz-mode-ico">⚡</span><b>${t("qz_mix")}</b><small>${t("qz_mix_d")}</small></button>
    <button class="qz-mode" onclick="qzStart('weak')" ${weak?"":"disabled"}><span class="qz-mode-ico">🎯</span><b>${t("qz_weak")}</b><small>${t("qz_weak_d",{n:weak})}</small></button>
    <button class="qz-mode" onclick="qzStart('all')"><span class="qz-mode-ico">🏆</span><b>${t("qz_all")}</b><small>${t("qz_all_d")}</small></button>
  </div>
  <h2>${t("qz_chapters")}</h2>
  <div class="grid">${QUIZ_CH.map(c=>{
    const qs=QUIZ.filter(q=>q.ch===c.id),done=qs.filter(q=>D.quiz[q.id]&&D.quiz[q.id].mastered).length,cp=qs.length?Math.round(done/qs.length*100):0;
    return `<div class="card qz-ch reveal"><div class="qz-ch-top"><span class="qz-ch-ico">${c.ico}</span><span class="tag">${esc(c.rop)}</span></div>
      <h3>${esc(c[lang])}</h3>
      <div class="bar-p" style="margin:10px 0 6px"><span style="width:${cp}%"></span></div>
      <div class="qz-ch-meta"><span>${done}/${qs.length} ${t("qz_mastered")}</span><span>${done*10} pts</span></div>
      <button class="btn sm ${done===qs.length?"ghost":""}" style="margin-top:12px;width:100%" onclick="qzStart('ch',${c.id})">${done===qs.length?t("qz_replay"):t("qz_play")}</button></div>`;
  }).join("")}</div>
  <h2>🏆 ${t("qz_lb")} <button onclick="loadLeaderboard(true)">↻</button></h2>
  <div class="card qz-board">${D.lb===null?`<div class="mute" style="padding:12px">${t("loading")}</div>`:!D.lb.length?`<div class="empty">${t("qz_lb_empty")}</div>`:D.lb.map((r,idx)=>{
    const me=S.user&&r.user_id===S.user.id,ptsR=Number(r.points)||0,lvR=qzLevel(ptsR),medal=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":(idx+1);
    const fullName=protectProperNames(`${r.prenom||""} ${r.nom||""}`.trim()||"Délégué");
    const init=(fullName[0]||"?").toUpperCase();
    return `<div class="qz-row ${me?"me":""}">
      <span class="qz-rank">${medal}</span>
      <span class="qz-avatar-sm">${esc(init)}</span>
      <span class="qz-name">${esc(fullName)}${me?` <em>(${t("qz_you")})</em>`:""}${r.role==="bureau"?` <span class="tag" style="font-size:9px;padding:2px 7px">${t("role_bureau")}</span>`:""}</span>
      <span class="tag gray">${lvR.ico} ${esc(lvR.name)}</span>
      <span class="qz-score">${ptsR} pts</span>
    </div>`;
  }).join("")}</div>
  ${m?`<div style="text-align:center;margin-top:18px"><button class="btn ghost sm" onclick="qzReset()">${t("qz_reset")}</button></div>`:""}`;
}
function vQuizPlay(){
  const cur=qz.qs[qz.i],ch=QUIZ_CH.find(c=>c.id===cur.q.ch),pct=Math.round((qz.i+(qz.picked!==null?1:0))/qz.qs.length*100);
  const letters=["A","B","C","D"],good=cur.opts.find(o=>o.ok);
  return `<div class="qz-top">
    <button class="chip" onclick="qz=null;render(false,true)">← ${t("qz_quit")}</button>
    <div class="qz-top-r">
      <button class="chip sm" onclick="go('ressources')">📘 ROP</button>
      ${qz.streak>=2?`<span class="qz-streak">🔥 ${qz.streak}</span>`:""}
      <span class="qz-run">+${qz.gain} pts</span>
    </div>
  </div>
  <div class="bar-p qz-prog"><span style="width:${pct}%"></span></div>
  <div class="qz-card qz-in">
    <div class="qz-meta"><span class="tag">${ch.ico} ${esc(ch[lang])}</span><span class="mute">${t("qz_q",{i:qz.i+1,n:qz.qs.length})}</span></div>
    <h2 class="qz-q">${esc(cur.qt)}</h2>
    <div class="qz-opts">${cur.opts.map((o,k)=>{
      let cls="qz-opt";
      if(qz.picked!==null){if(o.ok)cls+=" good";else if(k===qz.picked)cls+=" bad";else cls+=" dim"}
      return `<button class="${cls}" ${qz.picked!==null?"disabled":""} onclick="qzPick(${k})"><b>${letters[k]}</b><span>${esc(o.txt)}</span></button>`;
    }).join("")}</div>
    ${qz.picked!==null?`<div class="qz-fb ${cur.opts[qz.picked].ok?"ok":"ko"}">
      <div class="qz-fb-t">${cur.opts[qz.picked].ok?t("qz_good"):t("qz_bad")}</div>
      ${cur.opts[qz.picked].ok?"":`<div class="qz-fb-a">${esc(good.txt)}</div>`}
      <div class="qz-fb-r">${t("qz_rule")} ${esc(cur.q.ref)}</div>
    </div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="qzNext()">${qz.i+1<qz.qs.length?t("qz_next"):t("qz_finish")}</button>`:""}
  </div>`;
}
function vQuizEnd(){
  const n=qz.qs.length,pct=Math.round(qz.right/n*100),pts=qzPoints(),lv=qzLevel(pts),before=qzLevel(qz.beforePts);
  const up=lv.name!==before.name;
  const msg=pct===100?t("qz_m100"):pct>=80?t("qz_m80"):pct>=50?t("qz_m50"):t("qz_m0");
  return `<div class="qz-card qz-end qz-in">
    <div class="qz-endring">${qzRing(pct,150,12)}<div class="qz-ringtxt"><b>${qz.right}/${n}</b><span>${pct}%</span></div></div>
    <h1 style="margin:14px 0 4px">${t("qz_end_t")}</h1>
    <p class="mute" style="margin:0 0 16px">${msg}</p>
    <div class="qz-stats">
      <div class="qz-stat gold"><b>+${qz.gain}</b><span>${t("qz_gain")}</span></div>
      <div class="qz-stat"><b>${pts}</b><span>${t("qz_total")}</span></div>
      <div class="qz-stat"><b>🔥 ${qz.best}</b><span>${t("qz_streak")}</span></div>
    </div>
    ${up?`<div class="qz-up">${lv.ico} ${t("qz_levelup",{l:lv.name})}</div>`:""}
    ${qz.gain===0&&qz.right>0?`<p class="mute" style="font-size:13px;margin:10px 0 0">${t("qz_gain0")}</p>`:""}
    ${qz.wrong.length?`<details class="qz-wrong"><summary>${t("qz_review",{n:qz.wrong.length})}</summary>${qz.wrong.map(w=>`<div class="qz-wq"><b>${esc(w.qt)}</b><div>✓ ${esc(w.opts.find(o=>o.ok).txt)}</div><small>${t("qz_rule")} ${esc(w.q.ref)}</small></div>`).join("")}</details>`:""}
    <div class="qz-actions">
      <button class="btn" onclick="qzStart('${qz.mode}',${qz.ch||"null"})">${t("qz_again")}</button>
      <button class="btn ghost" onclick="qz=null;render(false,true)">${t("qz_back")}</button>
    </div>
  </div>`;
}

/* ===== DÉMARRAGE ===== */
async function init(){
  readHash();render();
  if(!configured){D.loading=false;render();return}
  D.quiz=ls.get("somun_qz",{});
  sb.auth.onAuthStateChange((ev,session)=>{
    S.user=session?session.user:null;
    if(ev==="PASSWORD_RECOVERY")route="reset";
    if(ev==="SIGNED_IN")setTimeout(async()=>{
      await syncCurrentUserMembership();
      await loadPrivate(false);
      if(route==="login")route="accueil";
      syncHash(true);softRender();
    },0);
  });
  try{
    const {data:{session}}=await sb.auth.getSession();
    S.user=session?session.user:null;
    await Promise.all([loadPublic(),loadPrivate(true)]);
    if(route==="pole"&&poleSel)await loadTasks();
    if(route==="event")await loadRegistrants();
    if(location.hash.includes("type=signup")||location.hash.includes("type=email")){toast(t("t_mail_confirmed"));syncHash(true)}
    else if(!location.hash&&route!=="accueil")syncHash(true);
  }catch(e){console.error(e);D.err=t("err_load")}
  D.loading=false;render();
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&configured&&Date.now()-lastSync>30000)refreshAll();
});

/* ===== AFFICHAGE DYNAMIQUE ===== */
const TABICON={
  home:'<svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>',
  ticket:'<svg viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a2 2 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a2 2 0 0 0 0-3Z"/><path d="M15 7v10" stroke-dasharray="2 2"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.5 14.3c2.4.4 4.5 2.1 4.5 5.2"/></svg>',
  menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>'
};
function stagger(){
  document.querySelectorAll(".grid .reveal, .board-grid .reveal").forEach((el,i)=>{
    el.style.transitionDelay=Math.min(i,7)*65+"ms";
  });
}
function animateStats(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  document.querySelectorAll(".stat b").forEach(el=>{
    const to=parseInt(el.textContent,10);
    if(!Number.isFinite(to)||to<=0)return;
    const t0=performance.now(),dur=750;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
      if(p<1)requestAnimationFrame(step);
    };
    el.textContent="0";requestAnimationFrame(step);
  });
}
const GLOW=".ev,.news,.about .card,.board-card,.partners a.card,.pole-pick button";
document.addEventListener("pointermove",e=>{
  const c=e.target.closest&&e.target.closest(GLOW);
  if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty("--gx",(e.clientX-r.left)+"px");
  c.style.setProperty("--gy",(e.clientY-r.top)+"px");
},{passive:true});
let scrollRaf=0;
window.addEventListener("scroll",()=>{
  if(scrollRaf)return;
  scrollRaf=requestAnimationFrame(()=>{
    scrollRaf=0;
    const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    const sp=$("#sp");if(sp)sp.style.transform="scaleX("+(max>0?Math.min(1,scrollY/max):0)+")";
    const hv=document.querySelector(".hero-visual");
    if(hv)hv.style.setProperty("--py",Math.min(60,scrollY*.14)+"px");
  });
},{passive:true});

const reduceMotionGlobe=()=>Boolean(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function setHeroTilt(hero,nx,ny){
  if(reduceMotionGlobe())return;
  hero.style.setProperty("--mx",nx.toFixed(3));
  hero.style.setProperty("--my",ny.toFixed(3));
}
document.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;
  const hero=e.target.closest&&e.target.closest(".hero,.bn-next");
  if(!hero)return;
  const r=hero.getBoundingClientRect();
  setHeroTilt(hero,((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2);
},{passive:true});
document.addEventListener("pointerout",e=>{
  const hero=e.target.closest&&e.target.closest(".hero,.bn-next");
  if(hero&&(!e.relatedTarget||!hero.contains(e.relatedTarget)))setHeroTilt(hero,0,0);
},{passive:true});

init();
</script>
