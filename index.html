<noscript><link rel="stylesheet" href="https://fonts.bunny.net/css?family=league-spartan:600,700,800|poppins:400,500,600,700|simonetta:900&display=swap"></noscript>
<style>
:root{
  --bleu:#00008E;--or:#EBC000;--marine:#020259;--rouge:#C12A3A;
  --bleu-soft:#ececf9;--or-soft:#fdf5d3;--rouge-soft:#fbe8ea;
  --bg:#fafafe;--soft:#f2f3fa;--ink:#121238;--mute:#585b7d;--line:#e2e4f2;
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ios-ease:cubic-bezier(.32,.72,0,1);
  --shadow-sm:0 2px 10px rgba(2,2,89,.04);
  --shadow-md:0 10px 28px rgba(2,2,89,.08);
  --shadow-lg:0 20px 44px rgba(2,2,89,.14);
  --f-titre:"League Spartan",system-ui,sans-serif;
  --f-texte:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-marque:"Simonetta",Georgia,serif;
  --navy:var(--bleu);--gold:var(--or);--navy-soft:var(--bleu-soft);--gold-soft:var(--or-soft);--ok:var(--bleu)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:light}
body{margin:0;font-family:var(--f-texte);background:var(--bg);color:var(--ink);line-height:1.62;padding-bottom:92px;font-size:15px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--or);outline-offset:2px}
::selection{background:var(--or);color:var(--marine)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- En-tête semi-transparent & lisible ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.7);backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);border-bottom:1px solid rgba(226,228,242,.65);transition:background .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
header.scrolled{background:rgba(255,255,255,.86);border-bottom-color:rgba(226,228,242,.95);box-shadow:0 12px 30px -20px rgba(2,2,89,.38)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:10px;color:var(--bleu);transition:transform .2s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand:active{transform:scale(.97)}
.brand img,.mark{width:auto;height:46px;object-fit:contain;display:block;border-radius:8px;transform-origin:left center;transition:transform .3s var(--ease)}
header.scrolled .brand img,header.scrolled .mark{transform:scale(.88)}
.mark{display:grid;place-items:center;width:46px;background:var(--bleu-soft);color:var(--bleu);font-size:13px;font-weight:800}
.wordmark{font-family:var(--f-marque);font-weight:900;font-size:23px;letter-spacing:2.5px;line-height:1;padding-top:3px}
.right{display:flex;gap:8px;align-items:center}
.lang{border:1.5px solid rgba(226,228,242,.95);background:rgba(255,255,255,.82);color:var(--bleu);border-radius:99px;padding:6px 13px;min-height:36px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.6px;transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.lang:hover{border-color:var(--bleu);background:rgba(236,236,249,.92)}
.lang:active{transform:scale(.96)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--bleu),var(--marine));color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--or);cursor:pointer;font-family:var(--f-titre);font-size:16px;padding-top:2px;box-shadow:0 3px 10px rgba(0,0,142,.18);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.avatar:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 6px 16px rgba(0,0,142,.26)}

/* ---------- Menu (ordinateur) ---------- */
.dnav{--nav-fs:13.5px;--nav-px:15px;position:relative;display:none;align-items:center;gap:2px;padding:4px;border-radius:99px;background:rgba(242,243,250,.78);border:1px solid rgba(226,228,242,.9);isolation:isolate;min-width:0;max-width:100%;transition:background .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
header.scrolled .dnav{background:rgba(255,255,255,.94);border-color:var(--line);box-shadow:0 3px 10px -6px rgba(2,2,89,.18)}
.dnav.tight{overflow-x:auto;scrollbar-width:none}
.dnav.tight::-webkit-scrollbar{display:none}
.dnav button{position:relative;z-index:1;flex:none;border:0;background:none;margin:0;padding:7px var(--nav-px);font-size:var(--nav-fs);line-height:1.5;color:var(--marine);font-weight:500;cursor:pointer;white-space:nowrap;border-radius:99px;transition:color .2s var(--ease),transform .15s var(--ease)}
.dnav button:hover{color:var(--bleu)}
.dnav button:not(.on):active{transform:scale(.95)}
.dnav:not(.ready) button.on{background:var(--bleu);color:#fff}
.tab-hover{position:absolute;z-index:0;left:0;top:4px;width:0;height:0;border-radius:99px;background:rgba(0,0,142,.075);opacity:0;pointer-events:none;transition:left .28s var(--ios-ease),width .28s var(--ios-ease),opacity .2s var(--ease)}
.dnav.hovering .tab-hover{opacity:1}
.nav-pill{position:absolute;z-index:2;left:0;top:4px;width:0;height:0;border-radius:99px;overflow:hidden;pointer-events:none;opacity:0;background:linear-gradient(180deg,#1717b5 0%,var(--bleu) 52%,#00007a 100%);box-shadow:0 8px 18px -8px rgba(0,0,142,.7),inset 0 1px 0 rgba(255,255,255,.2);transition:opacity .2s var(--ease)}
.nav-pill::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:3px;margin-left:-8px;border-radius:3px;background:var(--or);box-shadow:0 0 8px rgba(235,192,0,.55);transition:transform .38s var(--ios-ease),opacity .25s var(--ease)}
.nav-pill.moving::after{transform:scaleX(0);opacity:0;transition-duration:.12s}
.tab-ink{position:absolute;left:0;top:0}
.tab-ink span{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:#fff;font-weight:500;font-size:var(--nav-fs);line-height:1.5}

/* ---------- Barre d'onglets (mobile) ---------- */
.tabbar{position:fixed;left:12px;right:12px;bottom:10px;z-index:100;background:rgba(2,2,89,.92);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.12);border-radius:22px;display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom)*.35);box-shadow:0 12px 32px rgba(2,2,89,.28)}
.tabbar button{flex:1;border:0;background:none;color:rgba(255,255,255,.68);font-size:10.5px;font-weight:500;padding:6px 2px;min-height:46px;border-radius:16px;cursor:pointer;position:relative;z-index:1;transition:color .22s var(--ease) .06s,transform .15s var(--ease)}
.tabbar button:active{transform:scale(.94)}
.tabbar button .ico{display:block;font-size:19px;line-height:1.25;filter:grayscale(.25);transition:transform .28s var(--ios-ease),filter .2s var(--ease)}
.tabbar button.on{color:var(--or);font-weight:600}
.tabbar:not(.ready) button.on{background:rgba(235,192,0,.14)}
.tab-pill{position:absolute;z-index:0;left:0;top:0;width:0;height:0;border-radius:16px;background:linear-gradient(180deg,rgba(235,192,0,.24),rgba(235,192,0,.09));box-shadow:inset 0 0 0 1px rgba(235,192,0,.3);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.tabbar button.on .ico{filter:none;transform:translateY(-2px) scale(1.08)}
@media(min-width:860px){
  .dnav{display:flex}.tabbar{display:none}body{padding-bottom:0}
  .bar{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,max-content) minmax(max-content,1fr);gap:16px}
  .bar>.brand{justify-self:start}.bar>.right{justify-self:end}
}
@media(min-width:860px) and (max-width:1179px){.dnav{--nav-fs:12.5px;--nav-px:10px}.bar{gap:10px}}

/* ---------- Mise en page & glissement bidirectionnel ---------- */
main{max-width:1120px;width:100%;margin:0 auto;padding:24px 18px 48px;flex:1;position:relative}
.view{will-change:transform,opacity}
.view.anim-right{animation:goRight .42s var(--ios-ease) forwards}
.view.anim-left{animation:goLeft .42s var(--ios-ease) forwards}
@keyframes goRight{
  from{opacity:0;transform:translateX(72px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes goLeft{
  from{opacity:0;transform:translateX(-72px)}
  to{opacity:1;transform:translateX(0)}
}
.view-ghost{position:absolute;left:18px;right:18px;z-index:0;pointer-events:none;will-change:transform,opacity}
.view-ghost.out-left{animation:outLeft .34s var(--ios-ease) forwards}
.view-ghost.out-right{animation:outRight .34s var(--ios-ease) forwards}
@keyframes outLeft{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-72px)}}
@keyframes outRight{from{opacity:1;transform:none}to{opacity:0;transform:translateX(72px)}}
.view-ghost .reveal{opacity:1;filter:none;transform:none}
h1{font-family:var(--f-titre);font-weight:800;font-size:clamp(30px,4.5vw,42px);line-height:1.06;margin:6px 0 8px;color:var(--bleu);letter-spacing:-.4px}
h2{font-family:var(--f-titre);font-weight:700;font-size:clamp(20px,2.6vw,24px);color:var(--marine);margin:40px 0 16px;display:flex;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap}
h2::before{content:"";width:6px;height:22px;background:linear-gradient(180deg,var(--or),#d4ab00);border-radius:4px;margin-right:2px;flex:none;margin-top:-2px}
h2 button{margin-left:auto;border:0;background:var(--soft);font-family:var(--f-texte);font-size:13px;color:var(--bleu);font-weight:600;cursor:pointer;padding:6px 13px;border-radius:99px;transition:background .2s var(--ease),transform .15s var(--ease)}
h2 button:hover{background:var(--or-soft);color:var(--marine);transform:translateX(2px)}
h3{margin:0 0 4px;font-size:16.5px;font-weight:600;color:var(--marine)}
.mute{color:var(--mute);font-size:14px}
a{color:var(--bleu);transition:color .2s var(--ease)}

/* ---------- Bandeau d'accueil & Logo mis en évidence ---------- */
.hero{position:relative;display:grid;background:linear-gradient(125deg,var(--marine) 0%,var(--bleu) 62%,#1212b5 100%);color:#fff;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 85%,rgba(235,192,0,.14),transparent 45%);pointer-events:none;z-index:0}
.hero-visual{position:relative;min-height:230px;display:grid;place-items:center;padding:30px 22px;background:radial-gradient(circle at 60% 35%,rgba(235,192,0,.22) 0%,rgba(2,2,89,.45) 75%);background-size:cover;background-position:center 30%;clip-path:polygon(0 0,100% 0,100% 85%,0 100%);z-index:1}
.hero-visual.has-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(2,2,89,.72),rgba(0,0,142,.45));z-index:0}
.hero-crest{position:relative;z-index:1;background:#ffffff;border:3px solid var(--or);border-radius:24px;padding:18px 26px;box-shadow:0 18px 40px rgba(0,0,0,.28);display:grid;place-items:center;max-width:236px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.hero:hover .hero-crest{transform:translateY(-4px) scale(1.02);box-shadow:0 24px 48px rgba(0,0,0,.35)}
.hero-crest img{width:168px;max-width:100%;height:auto;display:block}
.hero-txt{padding:16px 24px 30px;position:relative;z-index:1}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--or);font-weight:700;margin:0 0 10px;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:99px;border:1px solid rgba(235,192,0,.28)}
.hero h1{font-size:clamp(34px,5.5vw,54px);line-height:1.03;margin:0;color:#fff;text-transform:uppercase;letter-spacing:-.2px}
.hero h1::after{content:"";display:block;width:64px;height:4px;background:linear-gradient(90deg,var(--or),#ffe055);border-radius:4px;margin-top:16px}
.hero p{color:rgba(255,255,255,.86);max-width:470px;margin:14px 0 0;font-size:15px}
.hero .btn{background:var(--or);border-color:var(--or);color:var(--marine);box-shadow:0 6px 20px rgba(235,192,0,.28)}
.hero .btn:hover{background:#ffd51e;border-color:#ffd51e;transform:translateY(-2px);box-shadow:0 10px 26px rgba(235,192,0,.38)}
.hero .btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.55);color:#fff;box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.15);border-color:#fff}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;max-width:440px}
.stat b{display:block;font-family:var(--f-titre);font-size:30px;line-height:1;color:var(--or);padding-top:4px;letter-spacing:-.5px}
.stat span{font-size:12px;color:rgba(255,255,255,.74)}
@media(min-width:760px){
  .hero{grid-template-columns:1.12fr .95fr;min-height:410px}
  .hero-visual{grid-column:2;grid-row:1;margin-left:-56px;padding-left:68px;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
  .hero-crest img{width:198px}
  .hero-txt{grid-column:1;grid-row:1;padding:44px 16px 40px 46px;align-self:center}
}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--bleu);background:var(--bleu);color:#fff;padding:10px 22px;min-height:42px;border-radius:99px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .18s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);text-decoration:none;line-height:1.25}
.btn:active{transform:scale(.96)}
.btn:hover{background:var(--marine);border-color:var(--marine);transform:translateY(-1.5px);box-shadow:0 6px 18px rgba(0,0,142,.22)}
.btn.ghost{background:#fff;color:var(--bleu);border-color:var(--line)}
.btn.ghost:hover{background:var(--bleu-soft);border-color:var(--bleu);box-shadow:none}
.btn.sm{padding:6px 15px;min-height:36px;font-size:13px}
.btn.xs{padding:4px 10px;min-height:28px;font-size:12px}
.btn.gold{background:var(--or);border-color:var(--or);color:var(--marine)}
.btn.gold:hover{background:#ffd51e;border-color:#ffd51e;box-shadow:0 6px 18px rgba(235,192,0,.32)}
.btn.danger{background:#fff;color:var(--rouge);border-color:#efc3c8}
.btn.danger:hover{background:var(--rouge-soft);border-color:var(--rouge);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- Étiquettes ---------- */
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bleu-soft);color:var(--bleu);margin-right:5px;text-transform:uppercase;letter-spacing:.7px}
.tag.paid{background:var(--or-soft);color:#6b5600}
.tag.free{background:var(--bleu);color:#fff}
.tag.red{background:var(--rouge-soft);color:var(--rouge)}
.tag.gray{background:var(--soft);color:var(--mute)}
.tag.trip{background:linear-gradient(135deg,#020259,#00008E);color:var(--or);border:1px solid rgba(235,192,0,.45)}

/* ---------- Cartes ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .48s var(--ease),transform .48s var(--ease)}.reveal.show{opacity:1;transform:none}
.ev{display:flex;gap:15px}
.ev:hover{border-color:#c6c9e8;box-shadow:var(--shadow-md);transform:translateY(-3px)}
.ev.past{opacity:.72}
.ev.past:hover{transform:none;box-shadow:var(--shadow-sm)}
.ev.is-trip{border-top:4px solid var(--or)}
.date{min-width:60px;border-radius:14px;background:linear-gradient(160deg,var(--bleu),var(--marine));color:#fff;text-align:center;padding:10px 6px 9px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,142,.16)}
.date::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--or)}
.ev.past .date{background:var(--mute);box-shadow:none}
.date b{font-family:var(--f-titre);font-size:27px;line-height:1;font-weight:800}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;opacity:.88;margin-top:2px}
.ev .body{flex:1;min-width:0}
.ev h3{font-size:17px;line-height:1.3}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.left{font-size:12px;color:var(--mute);font-weight:500}
.bar-p{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:11px;border:1px solid rgba(226,228,242,.6)}
.bar-p span{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--or));border-radius:99px;transition:width .6s var(--ease)}
.news{border-left:4px solid var(--or)}
.news:hover{border-color:#c6c9e8;border-left-color:var(--or);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.news h3{font-family:var(--f-titre);font-weight:700;font-size:19.5px;padding-top:2px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}

/* ---------- Bureau : fond pleine page, portraits & fiche bio grand format ---------- */
body:has(.bureau-wrap){position:relative}
body:has(.bureau-wrap)::before{content:"";position:fixed;inset:0;background:url('photo_bureau.jpeg') center 18%/cover no-repeat;opacity:.26;z-index:-1;pointer-events:none}
body:has(.bureau-wrap) header{background:rgba(255,255,255,.56);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom-color:rgba(226,228,242,.7)}
.bureau-wrap{padding:6px 0}
.board-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
@media(max-width:859px){.board-card{order:var(--om,99)}}
.board-card{flex:1 1 280px;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:4px solid var(--or);border-radius:20px;cursor:pointer}
.board-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);background:rgba(255,255,255,.98);border-color:#c6c9e8;border-top-color:var(--or)}
.board-photo{width:106px;height:106px;border-radius:50%;object-fit:cover;object-position:center 18%;border:3px solid var(--or);background:var(--bleu-soft);color:var(--bleu);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:34px;margin-bottom:12px;box-shadow:0 8px 20px rgba(2,2,89,.15);transition:transform .3s var(--ease)}

  {id:1,ico:"📜",rop:"I",  fr:"Dispositions générales",     en:"General provisions"},

const QN=(ch,ref,frq,enq,o)=>QUIZ.push({id:QUIZ.length+1,ch,ref,fr:[frq,...o],en:[enq,...o]});

/* ---------- I. GENERAL PROVISIONS (5) ---------- */
Q(1,"I.a",
 ["Quelle est la langue officielle et de travail de la conférence ?","L'anglais","Le français","L'anglais et le français","Au choix de chaque délégué"],
 ["What is the official and working language of the conference?","English","French","English and French","Each delegate's choice"]);
Q(1,"I.b",
 ["Comment les délégués doivent-ils s'adresser aux autres délégués et aux officiers du Conseil ?","À la troisième personne (singulier ou pluriel)","À la première personne du singulier","À la deuxième personne (tutoiement)","Comme ils le souhaitent, en informel"],
 ["How must delegates address each other and the Council officers?","In the third person (singular or plural)","In the first person singular","In the second person (“you”)","However they like, in informal sessions"]);
Q(1,"I.b",
 ["Laquelle de ces formulations respecte la courtoisie diplomatique ?","« La délégation de la France estime que… »","« Je pense que… »","« Nous, on trouve que… »","« Vous vous trompez, Chair. »"],

Q(1,"I.b",
 ["À qui s'applique la règle de courtoisie diplomatique ?","Aux autres délégués ET aux officiers du Conseil","Uniquement aux autres délégués","Uniquement aux chairs","Uniquement au discours d'ouverture"],
 ["Who does the diplomatic courtesy rule apply to?","Other delegates AND the Council officers","Other delegates only","The chairs only","The opening speech only"]);
Q(1,"I.b",
 ["Quand la courtoisie diplomatique est-elle attendue des délégués ?","Pendant les sessions du Conseil","Uniquement pendant les votes","Uniquement face aux chairs","Uniquement pendant les discours officiels"],
 ["When are delegates expected to exercise diplomatic courtesy?","During Council sessions","Only during votes","Only towards the chairs","Only during formal speeches"]);

/* ---------- II. CHAIRPERSONS (10) ---------- */
Q(2,"II",
 ["Qui préside toutes les sessions du Conseil ?","Les présidents de l'Assemblée générale (les chairs)","Le Secrétaire général","Les délégués, à tour de rôle","Les sponsors de la résolution"],
 ["Who chairs all Council sessions?","The General Assembly presidents (the chairs)","The Secretary-General","The delegates, in turn","The sponsors of the resolution"]);
Q(2,"II",
 ["Qui déclare l'ouverture et la clôture de chaque réunion ?","Les chairs","Le Secrétaire général","Un vote du Conseil","Les sponsors"],
 ["Who declares the opening and closing of each meeting?","The chairs","The Secretary-General","A vote of the Council","The sponsors"]);
Q(2,"II",
 ["Qui décide de l'ordre dans lequel les résolutions sont débattues ?","Les chairs","Les sponsors","Le Conseil, par un vote à la majorité simple","L'ordre alphabétique des pays"],
 ["Who decides the order in which resolutions are debated?","The chairs","The sponsors","The Council, by simple majority vote","The alphabetical order of countries"]);
Q(2,"II",
 ["Qui est habilité à déclarer des pauses (recesses), des ajournements ou à suspendre les règles ?","Uniquement les chairs","N'importe quel délégué","Les sponsors","Les observateurs"],
 ["Who is empowered to call recesses or adjournments or to suspend the rules?","Only the chairs","Any delegate","The sponsors","The observers"]);
Q(2,"II",
 ["Laquelle de ces limitations les chairs peuvent-elles proposer ?","Le temps de débat, le nombre d'interventions par délégué, la clôture du débat","Le nombre de pays membres de l'ONU","La durée du mandat des chairs","La langue utilisée dans les discours"],
 ["Which of these limitations may the chairs propose?","Debate time, the number of times each delegate may speak, the closure of debate","The number of UN member states","The chairs' term of office","The language used in speeches"]);
Q(2,"II",
 ["Dans quel but les chairs peuvent-elles donner la parole à une délégation qui ne l'a pas demandée ?","Dans l'intérêt du débat ou pour avancer vers le consensus","Pour sanctionner une délégation","Pour gagner du temps avant un vote","Elles ne peuvent jamais le faire"],
 ["Why may the chairs call upon a delegation that has not requested the floor?","In the interest of debate, or to work towards consensus","To sanction a delegation","To save time before a vote","They may never do so"]);
Q(2,"II",
 ["Que peuvent faire les chairs pour un délégué donné dans l'intérêt du débat ?","Restreindre son temps de parole","Lui retirer son droit de vote","L'exclure définitivement du Conseil","Lui imposer une langue de travail"],
 ["What may the chairs do regarding an individual delegate, in the interest of debate?","Restrict his or her speaking time","Remove his or her right to vote","Permanently exclude him or her from the Council","Impose a working language"]);
Q(2,"II",
 ["Qui statue sur les points d'ordre (points of order) ?","Les chairs","Le Conseil, par un vote","Le délégué qui l'a soulevé","Les sponsors de la résolution"],
 ["Who rules on points of order?","The chairs","The Council, by vote","The delegate who raised it","The sponsors of the resolution"]);
Q(2,"II",
 ["Qui a le contrôle complet des débats et le maintien de l'ordre lors des réunions formelles ?","Les chairs","Les observateurs","Les délégations les plus nombreuses","Les sponsors"],
 ["Who has complete control over the proceedings and the maintenance of order at formal meetings?","The chairs","The observers","The largest delegations","The sponsors"]);
Q(2,"II / IX.a",
 ["Parmi ces actions, laquelle n'est PAS un pouvoir des chairs ?","Voter à la place d'une délégation absente","Accorder le droit de parole","Mettre les questions au vote et annoncer les décisions","Statuer sur les points d'ordre"],
 ["Which of these is NOT a power of the chairs?","Casting a vote on behalf of an absent delegation","Accord the right to speak","Put questions to vote and announce decisions","Rule on points of order"]);

/* ---------- III. PARLIAMENTARY PROCEDURE (15) ---------- */
Q(3,"III.a",
 ["Par quoi les chairs commencent-elles une session après son ouverture ?","Par l'appel (roll call)","Par le vote de l'ordre du jour","Par l'ouverture de la liste des orateurs","Par un caucus non modéré"],
 ["How do the chairs begin once the session is open?","With a roll call","With a vote on the agenda","By opening the speakers' list","With an unmoderated caucus"]);
Q(3,"III.a",
 ["Dans quel ordre les chairs appellent-elles les nations lors du roll call ?","Dans l'ordre alphabétique","Dans l'ordre d'arrivée","Au hasard","Par taille de délégation"],
 ["In which order do the chairs call the nations during the roll call?","In alphabetical order","In order of arrival","At random","By size of delegation"]);
Q(3,"III.a",
 ["Que peut déclarer un État membre lors du roll call ?","« Present » ou « Present and Voting »","« Yes » ou « No »","« Present », « Absent » ou « Pass »","« Sponsor » ou « Signatory »"],
 ["What may a Member State declare during the roll call?","“Present” or “Present and Voting”","“Yes” or “No”","“Present”, “Absent” or “Pass”","“Sponsor” or “Signatory”"]);
Q(3,"III.a",
 ["Que implique le fait de se déclarer « Present and Voting » ?","On ne peut pas s'abstenir lors des votes de fond","On est obligé de prendre la parole","On a deux voix","On est dispensé des votes procéduraux"],

QN(3,"III.b",
 "Quelle proportion du total des représentants doit être présente pour ouvrir une session du Conseil (quorum) ?",
 "What proportion of the total number of representatives must be present to begin a Council session (quorum)?",
 ["Au moins un tiers","Au moins la moitié","Au moins deux tiers","Au moins trois quarts"]);
Q(3,"III.b",
 ["Quelle majorité faut-il pour passer à la procédure de vote sur un projet de résolution ?","Une majorité des trois quarts","Une majorité simple","Une majorité des deux tiers","L'unanimité"],
 ["What majority is needed to move to the voting procedure on a draft resolution?","A three-quarter majority","A simple majority","A two-thirds majority","Unanimity"]);
Q(3,"III.c",
 ["Quand les délégués peuvent-ils déposer une motion pour fixer l'ordre du jour (Agenda) ?","Après le roll call","Avant le roll call","Pendant la procédure de vote","Seulement à la clôture du débat"],
 ["When may delegates submit a motion to set the Agenda?","After a roll call","Before the roll call","During the voting procedure","Only at the closure of debate"]);
Q(3,"III.d",
 ["Quels votes sont dits « procéduraux » ?","Tous sauf le vote sur la résolution finale et ses amendements","Uniquement le vote sur l'ordre du jour","Uniquement les votes sur les motions de caucus","Uniquement les votes à main levée"],
 ["Which votes are “procedural”?","All votes except the vote on the final draft resolution and its amendments","Only the vote on the agenda","Only the votes on caucus motions","Only votes by show of hands"]);
Q(3,"III.d",
 ["Lors d'un vote procédural, que peut voter un représentant ?","Uniquement pour ou contre : l'abstention n'est pas recevable","Pour, contre ou abstention","Pour, contre, ou « with rights »","Il ne peut pas voter"],
 ["In a procedural vote, how may a representative vote?","Only in favor or against: abstentions are not in order","In favor, against or abstain","In favor, against, or “with rights”","He or she may not vote"]);
Q(3,"III.e",
 ["Que comprend le vote de fond (substantive vote) ?","Le vote sur les projets de résolution et les amendements","Le vote sur l'ordre du jour","Le vote sur les motions de caucus","Le vote sur la clôture de la liste des orateurs"],
 ["What does the substantive vote include?","Voting on draft resolutions and amendments","Voting on the agenda","Voting on caucus motions","Voting on closing the speakers' list"]);
Q(3,"III.e",
 ["Quelle majorité faut-il pour qu'un vote de fond soit adopté ?","Une majorité simple","Les deux tiers","Les trois quarts","L'unanimité"],
 ["What majority is needed to pass a substantive vote?","A simple majority","Two thirds","Three quarters","Unanimity"]);
Q(3,"III.e",
 ["Quelles sont les cinq options de vote lors d'un vote de fond ?","Yes, No, Abstain, Yes with rights, No with rights","Yes, No, Abstain, Pass, Absent","Yes, No, Present, Absent, Pass","Yes, No, Abstain, Veto, Pass"],
 ["What are the five voting options during a substantive vote?","Yes, No, Abstain, Yes with rights, No with rights","Yes, No, Abstain, Pass, Absent","Yes, No, Present, Absent, Pass","Yes, No, Abstain, Veto, Pass"]);
Q(3,"III.e",
 ["Comment sont considérés les membres qui s'abstiennent ?","Ils ne sont pas considérés comme votants","Ils comptent comme votant « Yes »","Ils comptent comme votant « No »","Ils sont exclus de la salle"],
 ["How are abstaining members considered?","They are not considered to be voting","They count as voting “Yes”","They count as voting “No”","They are asked to leave the room"]);
QN(3,"III.f",
 "Quelle majorité faut-il pour adopter une motion d'ajournement de la réunion ?",
 "What majority is needed to pass a motion of adjournment?",
 ["Deux tiers","Majorité simple","Trois quarts","Unanimité"]);
Q(3,"III.f",
 ["Que signifie une motion d'ajournement (adjournment) ?","Toutes les affaires du Conseil sont terminées et il ne se réunira plus avant la prochaine session","Le débat est suspendu pour quelques minutes","Le Conseil passe à un caucus non modéré","Le débat reprend sur un autre sujet"],
 ["What does a motion of adjournment mean?","All the business of the Council has been completed and it will not reconvene until the next session","The debate is paused for a few minutes","The Council moves to an unmoderated caucus","The debate resumes on another topic"]);

/* ---------- IV. CONDUCT OF DEBATE (18) ---------- */
Q(4,"IV.a",
 ["Quand les délégués peuvent-ils déposer une motion pour ouvrir la General Speakers' List (GSL) ?","Après les discours d'ouverture (Opening Speeches)","Avant le roll call","Après le vote de la résolution","Seulement à la demande des chairs"],
 ["When may delegates submit a motion to open the General Speakers' List (GSL)?","After the Opening Speeches","Before the roll call","After the resolution has been voted","Only at the chairs' request"]);
QN(4,"IV.a",
 "Quel est le temps de parole par défaut dans la GSL ?",
 "What is the default speaker's time in the GSL?",
 ["90 secondes","60 secondes","120 secondes","30 secondes"]);
Q(4,"IV.a",
 ["Comment modifier le temps de parole par défaut ?","Par une motion pour changer le temps de parole","Par une décision d'un seul délégué","Par un point d'ordre","On ne peut pas le modifier"],
 ["How can the default speaker's time be changed?","By a motion to change the speaker's time","By a single delegate's decision","By a point of order","It cannot be changed"]);
Q(4,"IV.a",
 ["Que font les chairs lorsqu'un délégué dépasse son temps de parole ?","Elles le rappellent immédiatement à l'ordre","Elles le laissent finir sa phrase puis votent","Elles lui retirent son droit de vote","Elles ne font rien"],
 ["What do the chairs do when a delegate exceeds his or her allotted time?","They call him or her to order immediately","They let him or her finish and then hold a vote","They remove his or her voting right","Nothing"]);
Q(4,"IV.a",
 ["Quelle est l'activité par défaut du Comité ?","La liste des orateurs (Speakers' List)","Le caucus non modéré","La procédure de vote","La suspension de la réunion"],
 ["What is the default activity of the Committee?","The Speakers' List","The unmoderated caucus","The voting procedure","The suspension of the meeting"]);
Q(4,"IV.a",
 ["Que doit-on faire de la GSL avant d'introduire un projet de résolution ?","La clore","L'étendre à tous les délégués","La suspendre à jamais","Rien : les deux peuvent coexister"],
 ["What must happen to the GSL before any draft resolution is introduced?","It must be closed","It must be extended to all delegates","It must be suspended forever","Nothing: both can run together"]);
Q(4,"IV.a",
 ["Dans quel cas le débat se clôt-il automatiquement ?","Quand la GSL est épuisée et qu'il n'y a plus de projet de résolution à introduire","Dès que le premier projet est introduit","Après 30 minutes de débat","Quand les chairs le décident seules sans raison"],
 ["When does the debate close automatically?","As soon as the GSL runs out and there are no draft resolutions to be introduced","As soon as the first draft is introduced","After 30 minutes of debate","When the chairs decide so, with no reason"]);
Q(4,"IV.b",
 ["Comment une délégation signale-t-elle qu'elle veut prendre la parole ?","En levant son placard","En se levant sans rien dire","En envoyant un e-mail aux chairs","En prenant la parole directement"],
 ["How does a delegation signify that it wants to speak?","By raising its placard","By standing up silently","By sending an e-mail to the chairs","By speaking right away"]);
Q(4,"IV.b",
 ["Un délégué peut-il s'adresser au Conseil sans autorisation préalable ?","Non, il doit obtenir la permission des chairs","Oui, s'il parle moins de 30 secondes","Oui, s'il est sponsor","Oui, s'il lève son placard"],
 ["May a delegate address the Council without prior permission?","No, he or she must obtain the chairs' permission","Yes, if he or she speaks less than 30 seconds","Yes, if he or she is a sponsor","Yes, if he or she raises a placard"]);
Q(4,"IV.b",
 ["Dans quel cas les chairs peuvent-elles rappeler un orateur à l'ordre ?","Si ses propos ne sont pas pertinents par rapport au sujet débattu","Si son discours est trop long de plus de 5 minutes","S'il est d'un autre bloc","Uniquement s'il utilise le français"],
 ["When may the chairs call a speaker to order?","If his or her remarks are not relevant to the subject under discussion","If his or her speech is more than 5 minutes too long","If he or she belongs to another bloc","Only if he or she uses French"]);
Q(4,"IV.c",
 ["Lequel n'est PAS un type de yield prévu par les ROP ?","Yield to the secretariat","Yield to the chairs","Yield to questions","Yield to another delegate"],
 ["Which of these is NOT a type of yield provided by the ROP?","Yield to the secretariat","Yield to the chairs","Yield to questions","Yield to another delegate"]);
Q(4,"IV.c",
 ["Comment fonctionne le « yield to questions » ?","Une question par délégué ; seules les réponses de l'orateur comptent dans le temps","Les questions sont illimitées","Les questions comptent dans le temps de l'orateur","Seul le chair peut poser des questions"],
 ["How does a “yield to questions” work?","One question per delegate; only the speaker's answers count towards the time limit","Questions are unlimited","Questions count towards the speaker's time","Only the chair may ask questions"]);
Q(4,"IV.c",
 ["Quelle règle s'applique au « yield to another delegate » ?","Le délégué qui reçoit le yield ne peut pas faire de nouveau yield ; un seul yield de ce type par orateur","Il peut en faire autant qu'il veut","Il faut un vote du Conseil","Il est interdit"],
 ["Which rule applies to a “yield to another delegate”?","The receiving delegate may not make any further yields; only one such yield per speaker","He or she may yield as many times as he or she wants","A Council vote is needed","It is forbidden"]);
Q(4,"IV.d",
 ["Quelles sont les caractéristiques principales du débat informel (caucus non modéré) ?","Pas de liste d'orateurs et pas de limite sur les réponses et commentaires de chaque délégué","Une liste d'orateurs stricte, avec 30 secondes par délégué","Les chairs désignent chaque orateur","Un yield est obligatoire à chaque discours"],
 ["What are the main features of informal debate (unmoderated caucus)?","No list of speakers and no limitation on replies and comments per speaking delegate","A strict speakers' list, with 30 seconds per delegate","The chairs appoint each speaker","A yield is mandatory after each speech"]);
Q(4,"IV.d",
 ["Quelle est la durée maximale d'une prolongation d'un caucus non modéré ?","Pas plus de la moitié de la durée initiale, et une seule fois","Autant que la durée initiale, plusieurs fois","Le double de la durée initiale","10 minutes exactement"],
 ["What is the maximum extension of an unmoderated caucus?","Once, and no more than half of its original time","As long as its original time, several times","Twice its original time","Exactly 10 minutes"]);
Q(4,"IV.e",
 ["Si plusieurs motions de caucus modéré sont sur la table, dans quel ordre sont-elles votées ?","De la plus disruptive à la moins disruptive","De la plus courte à la plus longue","Dans l'ordre alphabétique des pays","Par tirage au sort"],
 ["If several motions for a moderated caucus are on the floor, in which order are they voted?","From the most disruptive to the least disruptive","From the shortest to the longest","In alphabetical order of countries","By lot"]);
Q(4,"IV.e",
 ["Qui décide quel caucus modéré est le plus ou le moins disruptif ?","Les chairs, à leur discrétion","Le Conseil, par un vote","Le délégué à l'origine de la motion","Le Secrétaire général"],
 ["Who decides which moderated caucus is more or less disruptive?","The chairs, at their discretion","The Council, by vote","The delegate who made the motion","The Secretary-General"]);
Q(4,"IV.e",
 ["Peut-on faire un yield pendant un caucus modéré ?","Non, il n'y a pas de yield dans les caucus modérés","Oui, uniquement au chair","Oui, uniquement à un autre délégué","Oui, sans limite"],
 ["May a delegate yield time during a moderated caucus?","No, there is no yielding of time in moderated caucuses","Yes, only to the chairs","Yes, only to another delegate","Yes, without limit"]);

/* ---------- V. POINTS DURING DEBATE (11) ---------- */
Q(5,"V.a",
 ["Quand un délégué peut-il lever un point d'ordre (Point of Order) ?","S'il estime que les chairs ne respectent pas les Rules of Procedure","S'il n'entend pas l'orateur","S'il veut une précision sur le sujet débattu","S'il est insulté par un autre délégué"],
 ["When may a delegate raise a Point of Order?","If he or she believes the chairs are not following the Rules of Procedure","If he or she cannot hear the speaker","If he or she wants clarification on the matter before the Council","If he or she is insulted by another delegate"]);
Q(5,"V.a",
 ["Un point d'ordre peut-il interrompre un orateur ?","Non","Oui, toujours","Oui, si les chairs sont d'accord","Oui, s'il dure moins de 10 secondes"],
 ["May a Point of Order interrupt a speaker?","No","Yes, always","Yes, if the chairs agree","Yes, if it lasts less than 10 seconds"]);
Q(5,"V.a",
 ["Un délégué qui lève un point d'ordre peut-il parler sur le fond du sujet débattu ?","Non","Oui, pendant 30 secondes","Oui, si les chairs l'y autorisent","Oui, toujours"],
 ["May a delegate rising to a Point of Order speak on the substance of the matter under discussion?","No","Yes, for 30 seconds","Yes, if the chairs allow it","Yes, always"]);
Q(5,"V.b",
 ["Quand lève-t-on un Point of Personal Privilege ?","Pour signaler un inconfort physique qui gêne la participation (chaleur, mauvaise audition…)","Pour contester une décision des chairs","Pour demander une précision procédurale","Pour répondre à une insulte"],
 ["When is a Point of Personal Privilege raised?","To report a physical discomfort that impairs participation (heat, inability to hear…)","To challenge a chairs' decision","To ask for a clarification of procedure","To answer an insult"]);
Q(5,"V.b",
 ["Un Point of Personal Privilege peut-il interrompre un orateur ?","Oui, si c'est inévitablement nécessaire","Non, jamais","Oui, toujours et sans réserve","Seulement pendant un vote"],
 ["May a Point of Personal Privilege interrupt a speaker?","Yes, if unavoidably necessary","No, never","Yes, always and without restriction","Only during a vote"]);
Q(5,"V.c",
 ["Quel est l'objet d'un Point of Information ?","Obtenir une clarification de la procédure ou un état des questions soumises au Conseil","Signaler un inconfort physique","Contester le règlement","Répondre à un propos insultant"],
 ["What is the purpose of a Point of Information?","To obtain a clarification of procedure or a statement of the matters before the Council","To report a physical discomfort","To challenge the rules","To reply to an insulting remark"]);
Q(5,"V.c",
 ["Un Point of Information peut-il interrompre un orateur ?","Non","Oui","Oui, si les chairs l'autorisent","Oui, une fois par session"],
 ["May a Point of Information interrupt a speaker?","No","Yes","Yes, if the chairs allow it","Yes, once per session"]);
Q(5,"V.d",
 ["Dans quel cas les chairs peuvent-elles accorder un Right of Reply ?","Si un discours contient des propos clairement insultants pour la dignité personnelle ou nationale","Si une délégation n'est pas d'accord avec un discours","Si un orateur dépasse son temps","Si une délégation veut ajouter un argument"],
 ["When may the chairs accord a Right of Reply?","If a speech contains language clearly insulting to personal or national dignity","If a delegation disagrees with a speech","If a speaker exceeds his or her time","If a delegation wants to add an argument"]);
Q(5,"V.d",
 ["Comment un délégué demande-t-il un Right of Reply ?","En envoyant une note aux chairs","En levant son placard","En interrompant l'orateur","En déposant une motion"],
 ["How does a delegate request a Right of Reply?","By sending a note to the chairs","By raising his or her placard","By interrupting the speaker","By submitting a motion"]);
QN(5,"V.d",
 "Quelle est la durée maximale d'un Right of Reply ?",
 "What is the time limit of a Right of Reply?",
 ["30 secondes","15 secondes","60 secondes","90 secondes"]);
Q(5,"V.d",
 ["Peut-on demander un Right of Reply à un Right of Reply ?","Non, il n'y a pas de droit de réponse à un droit de réponse","Oui, une seule fois","Oui, avec l'accord des sponsors","Oui, sans limite"],
 ["May a Right of Reply be requested in answer to a Right of Reply?","No, there shall be no Right of Reply to a Right of Reply","Yes, once","Yes, with the sponsors' agreement","Yes, without limit"]);

/* ---------- VI. MOTIONS DURING DEBATE (12) ---------- */
Q(6,"VI.A",
 ["Quand peut-on déposer des motions procédurales ?","Pendant le débat formel, quand la parole est libre, avant la clôture du débat","À tout moment, y compris pendant un discours","Uniquement en procédure de vote","Uniquement avant le roll call"],
 ["When may procedural motions be raised?","During formal debate, when the floor is open, prior to the closure of debate","At any time, including during a speech","Only during the voting procedure","Only before the roll call"]);
Q(6,"VI.A",
 ["Une motion peut-elle interrompre un orateur ?","Non","Oui, si elle est urgente","Oui, avec un second","Oui, si les chairs sont d'accord"],
 ["May a motion interrupt a speaker?","No","Yes, if urgent","Yes, with a second","Yes, if the chairs agree"]);
Q(6,"VI.A",
 ["De quoi une motion a-t-elle besoin pour avancer, et que se passe-t-il en cas d'objection ?","De seconds ; en cas d'objection, on vote","D'un vote préalable systématique","De l'accord écrit des chairs ; pas de vote possible","De l'unanimité"],
 ["What does a motion need, and what happens if there are objections?","Seconds; in case of objections, a vote is necessary","A systematic prior vote","Written agreement of the chairs; no vote possible","Unanimity"]);
Q(6,"VI.A.iii",
 ["En quoi consiste une consultation of the whole ?","Un caucus avec un temps global fixé mais où le tour de parole est informel","Un vote de tous les membres","Un caucus avec liste d'orateurs et temps individuel imposé","Une suspension de la réunion"],
 ["What is a consultation of the whole?","A caucus where an overall time is set but the moderating of who speaks is informal","A vote of all members","A caucus with a speakers' list and imposed individual time","A suspension of the meeting"]);
Q(6,"VI.A.iii",
 ["Dans une consultation of the whole, que peut faire le délégué à l'origine de la motion ?","Parler aussi longtemps qu'il veut puis céder (yield) le temps restant à un délégué de son choix","Parler 30 secondes exactement","Désigner un chair","Voter pour tout le Conseil"],
 ["In a consultation of the whole, what may the delegate who made the motion do?","Speak as long as he or she wants, then yield the remaining time to whichever delegate he or she wants","Speak exactly 30 seconds","Appoint a chair","Vote for the whole Council"]);
Q(6,"VI.A.iii",
 ["Si une délégation limite ses yields par favoritisme contre la volonté du comité, que peuvent faire les chairs ?","Demander que le temps soit cédé à d'autres délégués","Exclure la délégation","Annuler la motion sans vote","Rien"],
 ["If a delegate limits yields out of favouritism against the will of the committee, what may the chairs do?","Ask for the time to be yielded to other delegates","Expel the delegation","Cancel the motion without vote","Nothing"]);
Q(6,"VI.A.iv",
 ["Que fait une motion de suspension de la réunion si elle passe ?","Elle suspend la séance plénière jusqu'à la prochaine séance plénière","Elle met fin définitivement à la conférence","Elle ouvre un caucus non modéré","Elle clôt le débat"],
 ["What does a motion to suspend the meeting do if it passes?","It suspends the plenary meeting until its next plenary meeting","It ends the conference for good","It opens an unmoderated caucus","It closes the debate"]);
Q(6,"VI.A.iv",
 ["Quelle majorité est requise pour la suspension de la réunion en cas d'objection ?","Majorité simple","Deux tiers","Trois quarts","Unanimité"],
 ["Which majority is required for a suspension of the meeting in the event of an objection?","Simple majority","Two thirds","Three quarters","Unanimity"]);
Q(6,"VI.A.v",
 ["Qu'exige une motion pour reprendre le débat (resume debate) ?","Un second et une majorité simple","Une majorité des deux tiers","Les trois quarts du Conseil","Aucun vote"],
 ["What does a motion to resume debate require?","A second and a simple majority","A two-thirds majority","Three quarters of the Council","No vote"]);
Q(6,"VI.A.vi",
 ["Quelle proportion du Conseil doit être en faveur de la clôture du débat pour que les chairs la déclarent ?","Trois quarts","Une moitié","Deux tiers","Un tiers"],
 ["What proportion of the Council must be in favour of the closure of debate for the chairs to declare it?","Three quarters","One half","Two thirds","One third"]);
Q(6,"VI.A.vi",
 ["Que se passe-t-il après la clôture du débat sur un sujet de fond ?","Le Conseil entre en procédure de vote sur tous les amendements et projets de résolution","Le Conseil est ajourné","Un nouveau débat s'ouvre","Les chairs choisissent la résolution gagnante"],
 ["What happens after the closure of debate on a substantive issue?","The Council enters the voting procedure on all amendments and draft resolutions","The Council is adjourned","A new debate opens","The chairs choose the winning resolution"]);
Q(6,"VI.B",
 ["Quand peut-on retirer une motion ?","À tout moment avant le début du vote, par son auteur","Uniquement avant le second","Jamais","Uniquement avec l'accord des chairs"],
 ["When may a motion be withdrawn?","At any time before voting has commenced, by its proposer","Only before it is seconded","Never","Only with the chairs' agreement"]);

/* ---------- VII. DRAFT RESOLUTION (10) ---------- */
Q(7,"VII.a",
 ["De quoi un projet de résolution est-il au minimum composé ?","D'au moins un paragraphe préambulaire et une clause opérative","D'au moins trois clauses opératives","D'un préambule et de cinq clauses","D'une seule clause opérative"],
 ["What does a Draft Resolution consist of at minimum?","At least one preambular and one operative clause","At least three operative clauses","A preamble and five clauses","A single operative clause"]);
Q(7,"VII.a",
 ["Dans quel cas les chairs approuvent-elles un projet de résolution ?","S'il est legible, organisé dans son contenu et son enchaînement, et au bon format","S'il est signé par tous les délégués","S'il a été voté par le Conseil","S'il est écrit en moins de dix lignes"],
 ["When do the chairs approve a Draft Resolution?","If it is legible, organized in content and flow, and in the proper format","If it is signed by all delegates","If the Council has voted for it","If it is shorter than ten lines"]);
QN(7,"VII.b",
 "Combien de sponsors doit avoir un projet de résolution ?",
 "How many sponsors must a Draft Resolution have?",
 ["Au moins 2 et au plus 5","Au moins 1 et au plus 3","Au moins 3 et au plus 8","Au moins 5 et au plus 10"]);
QN(7,"VII.c",
 "Combien de délégations doivent être signatories d'un projet de résolution ?",
 "How many delegations must be Signatories of a Draft Resolution?",
 ["Au moins 2 et au plus 8","Au moins 1 et au plus 5","Au moins 5 et au plus 12","Exactement 10"]);
Q(7,"VII.b-c",
 ["Quelle est la différence entre sponsors et signatories ?","Les sponsors sont les auteurs principaux ; les signatories (co-submitters) sont les soutiens","Les sponsors votent, les signatories non","Les sponsors sont les chairs, les signatories les délégués","Il n'y en a pas"],
 ["What is the difference between sponsors and signatories?","Sponsors are the principal authors; signatories (co-submitters) are the supporters","Sponsors vote, signatories do not","Sponsors are the chairs, signatories the delegates","There is none"]);
Q(7,"VII.d",
 ["Une fois le projet approuvé, qui l'introduit ?","L'un des sponsors, appelé par les chairs","Un signatory tiré au sort","Les chairs elles-mêmes","Le Secrétaire général"],
 ["Once a Draft Resolution is approved, who introduces it?","One of the Sponsors, called by the chairs","A signatory drawn by lot","The chairs themselves","The Secretary-General"]);
Q(7,"VII.d",
 ["Combien de temps la délégation a-t-elle pour introduire le projet de résolution ?","4 minutes : 3 pour le présenter et 1 pour les questions","3 minutes : 2 pour le présenter et 1 pour les questions","5 minutes : 4 pour le présenter et 1 pour les questions","2 minutes au total"],
 ["How much time does the delegation have to introduce the Draft Resolution?","4 minutes: 3 to present it and 1 for questions","3 minutes: 2 to present it and 1 for questions","5 minutes: 4 to present it and 1 for questions","2 minutes in total"]);
Q(7,"VII.d",
 ["Quelles questions peut-on poser pendant la minute de questions après l'introduction ?","Des questions non substantielles : abréviations, terminologie, sens général d'une partie du texte","Des questions sur la position politique de chaque pays","Des questions sur la vie privée des délégués","Toute question, sans limite"],
 ["What may be asked during the minute of questions following the introduction?","Non-substantive questions: abbreviations, terminology, general meaning of a part of the text","Questions on each country's political position","Questions on delegates' private lives","Any question, without limit"]);
Q(7,"VII.e",
 ["Comment débat-on d'un projet de résolution après son introduction ?","Les délégués peuvent déposer une motion pour ouvrir une general speakers' list sur la résolution","Les chairs ouvrent un vote immédiat","On passe directement aux amendements","On suspend la réunion"],
 ["How is a Draft Resolution debated after its introduction?","Delegates may introduce a motion to open a general speakers' list on the resolution","The chairs open an immediate vote","The amendments come straight away","The meeting is suspended"]);
Q(7,"VII.f",
 ["Dans quel cas un projet de résolution ne peut-il PAS être retiré ?","Si un amendement inamical (unfriendly) est sur la table","S'il a plus de 5 sponsors","S'il est déjà introduit","S'il n'a pas de préambule"],
 ["In which case may a Draft Resolution NOT be withdrawn?","If an Unfriendly Amendment to it is on the floor","If it has more than 5 sponsors","If it has already been introduced","If it has no preamble"]);

/* ---------- VIII. AMENDMENTS (10) ---------- */
Q(8,"VIII.a",
 ["Qu'est-ce qu'un amendement ?","Une motion écrite qui ajoute, supprime ou révise une partie du projet de résolution","Un vote sur une clause","Une question aux sponsors","Une nouvelle résolution complète"],
 ["What is an amendment?","A written motion that adds to, deletes from or revises any part of the Draft Resolution","A vote on a clause","A question to the sponsors","A whole new resolution"]);
Q(8,"VIII.a",
 ["Quelle mention ne faut-il pas oublier dans un amendement ?","Le numéro de ligne où il doit être apporté","La date de la séance","Le nom de chaque signataire du projet","Le temps de parole prévu"],
 ["What must not be forgotten in an amendment?","The line number in which the amendment should be made","The date of the session","The name of each signatory of the draft","The planned speaking time"]);
Q(8,"VIII.a",
 ["Combien de sponsors et de signatories faut-il pour un amendement ?","Un sponsor et deux signatories","Deux sponsors et un signatory","Cinq sponsors","Un sponsor, sans signatory"],
 ["How many sponsors and signatories must an amendment have?","One sponsor and two signatories","Two sponsors and one signatory","Five sponsors","One sponsor, no signatory"]);
Q(8,"VIII.a",
 ["Comment un amendement est-il soumis aux chairs ?","Sur un formulaire officiel d'amendement, pour approbation","Oralement, en séance","Par e-mail à tous les délégués","Il n'a pas besoin d'approbation"],
 ["How is an amendment submitted to the chairs?","On an official amendment form, for approval","Orally, in session","By e-mail to all delegates","It needs no approval"]);
Q(8,"VIII.b",
 ["Quand un amendement est présenté, sur quoi vote-t-on en premier ?","Sur l'amendement","Sur la résolution complète","Sur l'ordre du jour","Sur la clôture du débat"],
 ["When an amendment is moved to a proposal, what is voted on first?","The amendment","The whole resolution","The agenda","The closure of debate"]);
Q(8,"VIII.b",
 ["Un amendement à l'amendement à l'amendement est-il recevable ?","Non, il n'est pas en ordre","Oui, avec l'accord des sponsors","Oui, avec les deux tiers","Oui, sans limite"],
 ["Is an amendment to the amendment to the amendment in order?","No, it will not be in order","Yes, with the sponsors' agreement","Yes, with two thirds","Yes, without limit"]);
Q(8,"VIII.c",
 ["Quand un amendement est-il « friendly » ?","Si tous les sponsors l'approuvent et s'il ne change pas fondamentalement l'intention du projet","Si une majorité simple des délégués l'approuve","Si les chairs le trouvent court","Si un seul sponsor l'approuve"],
 ["When is an amendment “friendly”?","If all Sponsors agree with it and it does not fundamentally change the intent of the Draft Resolution","If a simple majority of delegates agree","If the chairs find it short","If only one Sponsor agrees"]);
Q(8,"VIII.c",
 ["Faut-il un vote pour ajouter un amendement friendly au projet ?","Non, aucun vote n'est requis","Oui, à la majorité simple","Oui, aux deux tiers","Oui, à l'unanimité"],
 ["Is a vote required to add a friendly amendment to a Draft Resolution?","No vote is required","Yes, by simple majority","Yes, by two thirds","Yes, by unanimity"]);
Q(8,"VIII.d",
 ["Comment un amendement « unfriendly » est-il débattu ?","Deux orateurs pour et deux contre, chaque discours d'une minute maximum","Une liste d'orateurs complète","Un seul orateur pour et un contre, deux minutes chacun","Sans débat, vote immédiat"],
 ["How is an unfriendly amendment debated?","Two speakers in favor and two against, each speech not exceeding one minute","A full speakers' list","One speaker for and one against, two minutes each","No debate, immediate vote"]);
QN(8,"VIII.d",
 "Quelle majorité faut-il pour incorporer un amendement unfriendly au projet de résolution ?",
 "What majority is required to incorporate an unfriendly amendment into the Draft Resolution?",
 ["Deux tiers","Majorité simple","Trois quarts","Unanimité"]);

/* ---------- IX. VOTING (9) ---------- */
Q(9,"IX.a",
 ["Combien de voix chaque membre du Conseil a-t-il sur les questions de fond et de procédure ?","Une voix","Deux voix sur le fond, une sur la procédure","Une voix sur le fond seulement","Autant que de délégués dans sa délégation"],
 ["How many votes does each Council member have on substantive and procedural matters?","One vote","Two votes on substance, one on procedure","One vote on substance only","As many as delegates in the delegation"]);
Q(9,"IX.a",
 ["Une délégation peut-elle voter au nom d'un autre pays ?","Non, jamais","Oui, si les deux délégations sont alliées","Oui, avec l'accord des chairs","Oui, si l'autre pays est absent"],
 ["May a delegation cast a vote on behalf of another country?","No, never","Yes, if the two delegations are allies","Yes, with the chairs' agreement","Yes, if the other country is absent"]);
Q(9,"IX.a",
 ["Les observateurs ont-ils le droit de vote ?","Non","Oui, uniquement sur la procédure","Oui, sur les résolutions","Oui, avec droits (« with rights »)"],
 ["Do observers have voting rights?","No","Yes, on procedural matters only","Yes, on resolutions","Yes, “with rights”"]);
Q(9,"IX.c",
 ["Que doit faire un délégué qui a déjà « passé » une fois pendant un vote par appel nominal ?","Confirmer son vote : il ne peut plus passer, s'abstenir ni voter « with rights »","Passer de nouveau","S'abstenir","Voter « with rights »"],
 ["What must a delegate do who has already passed once during a roll call vote?","Ascertain his or her vote: he or she may not pass again, nor abstain, nor vote “with rights”","Pass again","Abstain","Vote “with rights”"]);
Q(9,"IX.c",
 ["Quand la procédure de vote commence-t-elle et se termine-t-elle ?","Elle commence à la déclaration « we are in voting procedure » des chairs et finit à l'annonce des résultats","Elle commence au roll call et finit à la fin de la session","Elle commence avec la première motion et finit avec le dernier discours","Elle commence à la clôture de la GSL et finit à l'ajournement"],
 ["When does the voting procedure begin and end?","It begins with the chairs' declaration “we are in voting procedure” and ends when the results are announced","It begins at the roll call and ends with the session","It begins with the first motion and ends with the last speech","It begins when the GSL is closed and ends at adjournment"]);
Q(9,"IX.c",
 ["Pendant la procédure de vote, que se passe-t-il dans la salle ?","Les chambres sont scellées et aucune interruption n'est autorisée","Les délégués peuvent circuler librement","Un caucus modéré est autorisé","Les débats continuent"],
 ["During the voting procedure, what happens in the chamber?","The chambers are sealed and no interruptions are allowed","Delegates may move around freely","A moderated caucus is allowed","The debate continues"]);
Q(9,"IX.c",
 ["Lequel de ces points ou motions est recevable pendant la procédure de vote ?","Point of Personal Privilege","Motion pour un caucus modéré","Motion pour un caucus non modéré","Right of Reply"],
 ["Which of these points or motions is in order during the voting procedure?","Point of Personal Privilege","Motion for a moderated caucus","Motion for an unmoderated caucus","Right of Reply"]);
Q(9,"IX.c",
 ["Comment se déroule un vote « clause par clause » ?","Chaque clause opérative est votée séparément à la majorité simple, puis on vote sur l'ensemble de la résolution","On vote uniquement l'ensemble de la résolution","Chaque clause nécessite les deux tiers","Seuls les sponsors votent par clause"],
 ["How does a “clause by clause” vote work?","Each operative clause is voted separately by simple majority, then the entire resolution is voted","Only the entire resolution is voted","Each clause requires two thirds","Only the sponsors vote by clause"]);
Q(9,"IX.c",
 ["Que signifie voter « with rights » lors d'un vote par appel nominal ?","La délégation dispose de 30 secondes à la fin de l'appel pour expliquer sa décision","La délégation a un droit de veto","La délégation vote deux fois","La délégation peut modifier le texte"],
 ["What does voting “with rights” mean in a roll call vote?","The delegation has thirty seconds at the end of the roll call to explain its decision","The delegation has a veto","The delegation votes twice","The delegation may modify the text"]);

let trCache=ls.get("somun_tr",{});
const pending=new Set();let flushing=false,nativeT=null,trFailures=0;
function protectProperNames(str){
  return String(str).replace(/\bC[ôo]me\b/gi,"Côme");
}
function isBadTranslation(res,orig){
  if(!res||typeof res!=="string")return true;
  const u=res.toUpperCase();
  if(u.includes("MYMEMORY WARNING")||u.includes("PLEASE SELECT TWO DISTINCT")||u.includes("QUERY LENGTH LIMIT"))return true;
  return protectProperNames(res).trim()===protectProperNames(orig).trim();
}
function chunkText(txt,max=450){
  if(txt.length<=max)return [txt];
  const parts=[];
  for(const para of txt.split(/(\n+)/)){
    if(!para)continue;
    if(para.length<=max){parts.push(para);continue}
    let cur="";
    for(const word of para.split(/(\s+)/)){
      if((cur+word).length>max&&cur){parts.push(cur);cur=word}
      else cur+=word;
    }
    if(cur)parts.push(cur);
  }
  return parts;
}
function T(txt){
  if(!txt)return txt;
  const raw=String(txt);
  if(lang==="fr")return protectProperNames(raw);
  const cached=trCache[raw];
  if(cached&&!isBadTranslation(cached,raw)){
    return protectProperNames(cached.replace(/\bComo\b/g,"Côme"));
  }
  if(cached)delete trCache[raw];
  if(trFailures<2&&!pending.has(raw)){pending.add(raw);if(!flushing)flush()}
  return protectProperNames(raw);
}
async function translateChunk(txt){
  try{
    if("Translator" in self){
      if(!nativeT)nativeT=Translator.create({sourceLanguage:"fr",targetLanguage:"en"});
      return await (await nativeT).translate(txt);
    }
  }catch(e){nativeT=null}
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair=fr|en",{signal:ctrl.signal});
    const j=await r.json();
    return j&&j.responseData&&j.responseData.translatedText;
  }finally{clearTimeout(timer)}
}
async function translateOne(txt){
  const parts=chunkText(txt,450);
  if(parts.length===1)return translateChunk(txt);
  const out=[];
  for(const p of parts){
    if(!p.trim()){out.push(p);continue}
    const r=await translateChunk(p);
    if(isBadTranslation(r,p))return r;
    out.push(r);
  }
  return out.join("");
}
async function flush(){
  flushing=true;let changed=false;
  while(pending.size&&trFailures<2){
    const batch=[...pending].slice(0,3);
    batch.forEach(x=>pending.delete(x));
    await Promise.all(batch.map(async txt=>{
      try{
        const r=await translateOne(txt);
        if(!isBadTranslation(r,txt)){
          trCache[txt]=protectProperNames(r.replace(/\bComo\b/g,"Côme"));
          changed=true;trFailures=0;
        }else if(r&&r.toUpperCase().includes("MYMEMORY WARNING")){trFailures=2}
      }catch(e){trFailures++}
    }));
  }
  if(trFailures>=2)pending.clear();
  flushing=false;
  if(changed){ls.set("somun_tr",trCache);softRender()}
}
function softRender(){
  const a=document.activeElement;
  if((a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"))||$("#sheetbg").classList.contains("open")){
    setTimeout(softRender,1200);return;
  }
  render(true);
}

  else{route=ROUTES.includes(h)?h:"accueil";poleSel=null;evSel=null}

const TABS={};
const tabsReduce=()=>Boolean(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const tabsLead=t=>1-Math.pow(1-t,4);
const tabsTrail=t=>{const u=Math.min(1,Math.max(0,(t-.12)/.88));return u<.5?4*u*u*u:1-Math.pow(2-2*u,3)/2};
function tabsBuild(id,items,cur,opt){
  const box=$("#"+id);if(!box)return;
  let s=TABS[id];
  if(!s){
    s=TABS[id]={id,box,l:null,w:null,raf:0,rq:0,goal:null,sig:"",ink:null,hov:null,ro:null};
    if(opt.hover){s.hov=document.createElement("span");s.hov.className="tab-hover";s.hov.setAttribute("aria-hidden","true");box.appendChild(s.hov);tabsHover(s)}
    s.pill=document.createElement("span");s.pill.className=opt.pill;s.pill.setAttribute("aria-hidden","true");
    if(opt.ink){s.ink=document.createElement("span");s.ink.className="tab-ink";s.pill.appendChild(s.ink)}
    box.appendChild(s.pill);
    if("ResizeObserver" in window){s.ro=new ResizeObserver(()=>{cancelAnimationFrame(s.rq);s.rq=requestAnimationFrame(()=>tabsSync(s,true))});s.ro.observe(box)}
  }
  if(opt.label)box.setAttribute("aria-label",opt.label);
  const sig=items.map(i=>i[0]+":"+i[1]).join("|");
  if(sig!==s.sig){
    s.sig=sig;
    box.querySelectorAll(":scope>button").forEach(b=>{if(s.ro)s.ro.unobserve(b);b.remove()});
    box.insertAdjacentHTML("beforeend",items.map(([k,l,ico,click])=>`<button type="button" data-k="${k}" onclick="${click||`go('${k}')`}">${ico?`<span class="ico" aria-hidden="true">${ico}</span>`:""}${esc(l)}</button>`).join(""));
    if(s.ink)s.ink.innerHTML=items.map(i=>`<span>${esc(i[1])}</span>`).join("");
    if(s.ro)box.querySelectorAll(":scope>button").forEach(b=>s.ro.observe(b));
  }
  box.querySelectorAll(":scope>button").forEach(b=>{const on=b.dataset.k===cur;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
function tabsSync(s,instant){
  if(!s)return;
  const box=s.box,btns=[...box.querySelectorAll(":scope>button")];
  if(!box.offsetWidth){cancelAnimationFrame(s.raf);s.raf=0;s.pill.style.opacity="0";s.l=null;s.goal=null;box.classList.remove("ready");return}
  if(s.ink)btns.forEach((b,i)=>{const e=s.ink.children[i];if(e)e.style.cssText=`left:${b.offsetLeft}px;top:${b.offsetTop}px;width:${b.offsetWidth}px;height:${b.offsetHeight}px`});
  if(s.hov)box.classList.toggle("tight",box.scrollWidth>box.clientWidth+1);
  tabsGo(s,btns.find(b=>b.classList.contains("on")),instant);
}
function tabsPut(s,l,w){s.l=l;s.w=w;s.pill.style.left=l+"px";s.pill.style.width=w+"px";if(s.ink)s.ink.style.left=-l+"px"}
function tabsGo(s,btn,instant){
  const pill=s.pill;
  if(!btn){cancelAnimationFrame(s.raf);s.raf=0;pill.style.opacity="0";s.l=null;s.goal=null;return}
  const L=btn.offsetLeft,W=btn.offsetWidth,goal=L+":"+W;
  pill.style.top=btn.offsetTop+"px";pill.style.height=btn.offsetHeight+"px";
  if(s.ink)s.ink.style.top=-btn.offsetTop+"px";
  if(s.raf&&s.goal===goal)return;
  s.goal=goal;
  tabsReveal(s,btn,instant);
  if(instant||s.l==null||tabsReduce()||(Math.abs(L-s.l)<1&&Math.abs(W-s.w)<1)){
    cancelAnimationFrame(s.raf);s.raf=0;
    const fresh=!s.box.classList.contains("ready");
    if(fresh)pill.style.transition="none";
    tabsPut(s,L,W);pill.classList.remove("moving");pill.style.opacity="1";s.box.classList.add("ready");
    if(fresh){pill.getBoundingClientRect();pill.style.transition=""}
    return;
  }
  cancelAnimationFrame(s.raf);
  const L0=s.l,R0=s.l+s.w,R1=L+W,toRight=L>L0,cap=Math.max(s.w,W)+150;
  const dur=Math.min(620,Math.max(320,260+Math.abs(L+W/2-(L0+s.w/2))*.5));
  let t0=null;
  pill.classList.add("moving");pill.style.opacity="1";
  const step=now=>{
    if(t0==null)t0=now;
    const t=Math.max(0,Math.min(1,(now-t0)/dur)),lead=tabsLead(t),trail=tabsTrail(t);
    let l=L0+(L-L0)*(toRight?trail:lead),r=R0+(R1-R0)*(toRight?lead:trail);
    if(r-l>cap){if(toRight)l=r-cap;else r=l+cap}
    tabsPut(s,l,r-l);
    if(t<1)s.raf=requestAnimationFrame(step);
    else{s.raf=0;pill.classList.remove("moving")}
  };
  s.raf=requestAnimationFrame(step);
}
function tabsReveal(s,btn,instant){
  const box=s.box;if(box.scrollWidth<=box.clientWidth+1)return;
  const a=btn.offsetLeft-14,b=btn.offsetLeft+btn.offsetWidth+14;let x=box.scrollLeft;
  if(a<x)x=a;else if(b>x+box.clientWidth)x=b-box.clientWidth;
  if(x!==box.scrollLeft)box.scrollTo({left:x,behavior:instant||tabsReduce()?"auto":"smooth"});
}
function tabsHover(s){
  const box=s.box,h=s.hov;
  box.addEventListener("pointerover",e=>{
    if(e.pointerType!=="mouse")return;
    const b=e.target.closest&&e.target.closest("button");
    if(!b||b.parentNode!==box)return;
    const first=!box.classList.contains("hovering");
    if(first)h.style.transition="opacity .2s ease";
    h.style.left=b.offsetLeft+"px";h.style.top=b.offsetTop+"px";h.style.width=b.offsetWidth+"px";h.style.height=b.offsetHeight+"px";
    if(first){h.getBoundingClientRect();box.classList.add("hovering");requestAnimationFrame(()=>{h.style.transition=""})}
  });
  box.addEventListener("pointerleave",()=>box.classList.remove("hovering"));
}

  const st=D.myRegs[e.id],j=daysTo(e.date),past=j<0,id=idArg(e.id),formHref=safeUrl(e.form_url);

/* --- Onglet Bureau & Fiche Bio grand format --- */
function firstKey(name){
  return String(name||"").trim().split(/\s+/)[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function sortedBoard(){
  return [...D.board].sort((a,b)=>{
    const ia=BOARD_ORDER.indexOf(firstKey(a.name));
    const ib=BOARD_ORDER.indexOf(firstKey(b.name));
    const ra=ia===-1?999:ia;
    const rb=ib===-1?999:ib;
    if(ra!==rb)return ra-rb;
    return (a.sort||0)-(b.sort||0);
  });
}
function boardMemberPhoto(m){
  const key=firstKey(m.name);
  const custom=safeAsset(m.photo_url||m.avatar_url||m.image_url);
  if(custom){
    const preset=BOARD_PHOTOS[key];
    if(key==="come"&&(!preset||custom!==preset))return preset||"photo_come_bureau.jpeg";
    return custom;
  }
  return BOARD_PHOTOS[key]||null;
}
function boardBioPhoto(m){
  const key=firstKey(m.name);
  const dedicated=safeAsset(m.bio_photo_url||m.detail_photo_url||m.portrait_url);
  if(dedicated)return dedicated;
  const presetBio=safeAsset(BOARD_BIO_PHOTOS[key]);
  if(presetBio)return presetBio;
  if(key==="come")return "photo_bio_come.jpeg";
  return boardMemberPhoto(m);
}
function handleImgError(img){
  const src=img.getAttribute("src")||"";
  if(!img.dataset.fb1&&src.toLowerCase().endsWith(".jpeg")){
    img.dataset.fb1="1";
    img.src=src.slice(0,-5)+".jpg";
    return;
  }
  if(!img.dataset.fb2&&img.dataset.fallback==="1"){
    img.dataset.fb2="1";
    img.src="IMG_2778.jpeg";
    return;
  }
  const div=document.createElement("div");
  div.className=img.className;
  div.textContent=img.dataset.init||"?";
  img.replaceWith(div);
}
function avatarMarkup(src,init,cls,extraCls=""){
  const safe=safeAsset(src);
  const fullCls=extraCls?`${cls} ${extraCls}`:cls;
  const hasJpegFallback=safe&&safe.toLowerCase().endsWith(".jpeg")?"1":"0";
  return safe
    ?`<img class="${esc(fullCls)}" src="${esc(safe)}" alt="${esc(init)}" data-init="${esc(init)}" data-fallback="${hasJpegFallback}" loading="lazy" onerror="handleImgError(this)">`
    :`<div class="${esc(fullCls)}">${esc(init)}</div>`;
}

function previewBioPhoto(val){
  const form=$("#bioEditForm");
  const init=(form&&form.dataset.init)||"?";
  const box=$("#sheet .bio-preview");
  if(!box)return;
  const safe=safeAsset(val);
  if(safe){
    const img=document.createElement("img");
    img.className="bio-preview";
    img.src=safe;
    img.alt=init;
    img.dataset.init=init;
    img.dataset.fallback=safe.toLowerCase().endsWith(".jpeg")?"1":"0";
    img.onerror=function(){handleImgError(this)};
    box.replaceWith(img);
  }else{
    const div=document.createElement("div");
    div.className="bio-preview";
    div.textContent=init;
    box.replaceWith(div);
  }
}
function handleBioPhotoFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(file.size>5*1024*1024){input.value="";return toast(t("e_file_big"))}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=720,ratio=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*ratio));
      c.height=Math.max(1,Math.round(img.height*ratio));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL("image/jpeg",0.85);
      const inp=$("#bioPhotoInput");
      if(inp)inp.value=dataUrl;
      previewBioPhoto(dataUrl);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
async function saveBoardBio(ev,id){

function exportCSV(id){
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  const cell=v=>{let x=String(v??"");if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const lines=[[t("col_ln"),t("col_fn"),t("col_mail"),t("col_member"),t("col_status")].map(cell).join(";")]
    .concat(registrantRows().map(r=>[r.nom,r.prenom,r.email,r.paid?t("yes"):t("no"),stLabel(r.status)].map(cell).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const slug=String(e.title||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`inscrits-${isoDay(e.date)}-${slug}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
