function openReg(id){
  if(!S.user){toast(t("t_need"));go("login");return}
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  if(e.members_only&&!hasPaid()){toast(t("t_err_members"));go("adherer");return}
  if(Number(e.prix)>0&&!eventUrl(e))return toast(t("t_err_slug"));
  const ei=idArg(e.id);
  openSheet(`<h3>${esc(T(e.title))}</h3><p class="mute">${long(e.date)} · ${esc(T(e.lieu))}</p>
   <p>${e.prix?t("pay_note",{p:e.prix}):t("free_note")}</p>
   <button class="btn" style="width:100%" onclick="confirmReg(${ei},this)">${e.prix?t("go_pay"):t("confirm")}</button>
   <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">${t("cancel")}</button>`);
}
async function confirmReg(id,btn){
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  const u=eventUrl(e);
  if(Number(e.prix)>0&&!u)return toast(t("t_err_slug"));
  await withBusy(btn,async()=>{
    const {error}=await sb.rpc("register_event",{p_event_id:e.id});
    if(error)return toast(errMsg(error));
    await Promise.all([loadTaken(),loadPrivate(false)]);
    if(route==="event")await loadRegistrants();
    if(Number(e.prix)>0){
      openSheet(`<h3>${esc(T(e.title))}</h3><p>${t("ha_after")}</p><p class="mute" style="font-size:13px">${esc(S.user.email)}</p>
      <a class="btn gold" style="width:100%" target="_blank" rel="noopener noreferrer" href="${u}" onclick="closeSheet()">${t("go_ha")}</a>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">${t("cancel")}</button>`);
    }else{closeSheet();toast(t("t_reg"))}
    render(true);
  });
}
function payEvent(id){
  const e=D.events.find(x=>String(x.id)===String(id)),u=eventUrl(e);
  if(!u)return toast(t("t_err_slug"));
  openSheet(`<h3>${esc(T(e.title))}</h3><p>${t("ha_after")}</p><p class="mute" style="font-size:13px">${esc(S.user.email)}</p>
   <a class="btn gold" style="width:100%" target="_blank" rel="noopener noreferrer" href="${u}" onclick="closeSheet()">${t("go_ha")}</a>`);
}
async function cancelReg(id,btn){
  if(!confirm(t("confirm_cancel")))return;
  await withBusy(btn,async()=>{
    const {error}=await sb.rpc("cancel_registration",{p_event_id:id});
    if(error)return toast(errMsg(error));
    await Promise.all([loadTaken(),loadPrivate(false)]);
    if(route==="event")await loadRegistrants();
    toast(t("t_cancelled"));render(true);
  });
}

/* --- Espace pôles collaboratif enrichi --- */
const SUBPOLE_MATCH={
  culturel:/cultur/i,
  partenariats:/partenar/i,
  alumni:/alumni/i
};
function isGroupPole(p){
  const s=`${p.slug||""} ${p.name_fr||""} ${p.name_en||""}`.toLowerCase();
  return s.includes("culturel")&&(s.includes("partenar")||s.includes("alumni"));
}
function getSubPoleKey(task){
  const txt=String(task.title||"");
  const m=txt.match(/^\[(culturel|partenariats|alumni)\]\s*/i);
  if(m)return m[1].toLowerCase();
  return "culturel";
}
function stripSubPoleTag(title){
  return String(title||"").replace(/^\[(culturel|partenariats|alumni)\]\s*/i,"");
}
function isTaskOverdue(tk){
  if(!tk.due_date||tk.status==="done")return false;
  return isoDay(tk.due_date)<todayStr();
}
function isTaskSoon(tk){
  if(!tk.due_date||tk.status==="done")return false;
  const d=daysTo(tk.due_date);
  return d>=0&&d<=2;
}
function assigneeName(uid){
  if(!uid)return null;
  const m=D.members.find(x=>x.id===uid);
  if(!m)return null;
  return protectProperNames(`${m.prenom||""} ${m.nom||""}`.trim()||m.email||"");
}
function poleTeamRoster(pid){
  const list=D.memberPoles.filter(x=>String(x.pole_id)===String(pid));
  const byId=Object.fromEntries(D.members.map(m=>[m.id,m]));
  return list.map(pm=>({user_id:pm.user_id,role:pm.role,member:byId[pm.user_id]||{}}));
}
function taskCardHTML(tk,canWrite,isGrp,i){
  const tid=idArg(tk.id);
  const rawTitle=isGrp?stripSubPoleTag(tk.title):tk.title;
  const subKey=isGrp?getSubPoleKey(tk):null;
  const prio=tk.priority||"normal";
  const prioCls=prio==="urgent"?"prio-urgent":prio==="high"?"prio-high":"";
  const prioBadge=prio==="urgent"?`<span class="task-badge overdue">🔥 ${t("prio_urgent")}</span>`:prio==="high"?`<span class="task-badge soon">⚡ ${t("prio_high")}</span>`:"";
  const dueBadge=tk.due_date?`<span class="task-badge ${isTaskOverdue(tk)?"overdue":isTaskSoon(tk)?"soon":""}">📅 ${isoDay(tk.due_date).slice(5)}${isTaskOverdue(tk)?" · "+t("overdue_lbl"):""}</span>`:"";
  const who=assigneeName(tk.assigned_to);
  const whoBadge=who?`<span class="task-badge">👤 ${esc(who)}</span>`:"";
  const resHref=safeUrl(tk.resource_url);
  const resBadge=resHref?`<a class="task-badge link" href="${esc(resHref)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 ${t("open_resource")}</a>`:"";
  const items=Array.isArray(tk.checklist)?tk.checklist:[];
  const doneCount=items.filter(x=>x.done).length;
  const checkBadge=items.length?`<span class="task-badge">☑️ ${doneCount}/${items.length}</span>`:"";
  const miniChecks=items.length?`<div class="task-mini-check" onclick="event.stopPropagation()">${items.slice(0,3).map((it,idx)=>`<label class="${it.done?"done-sub":""}"><input type="checkbox" ${it.done?"checked":""} ${canWrite?`onchange="toggleSubtask(${tid},${idx})"`: "disabled"}> <span>${esc(T(it.text))}</span></label>`).join("")}${items.length>3?`<div class="mute" style="font-size:11px;cursor:pointer" onclick="openTaskDetail(${tid})">+${items.length-3}…</div>`:""}</div>`:"";
  return `<div class="task ${prioCls}" ${canWrite?`draggable="true" ondragstart="dragId=${tid};this.classList.add('drag')" ondragend="dragId=null;this.classList.remove('drag')"`:""}>
    <div class="task-head">
      <button type="button" class="task-title" onclick="openTaskDetail(${tid})">${isGrp?`<span class="tag" style="margin-right:4px">${esc(t("subpole_"+subKey))}</span>`:""}${esc(T(rawTitle))}</button>
      <button type="button" class="btn xs ghost" style="padding:2px 7px;min-height:24px;flex:none" onclick="openTaskDetail(${tid})" aria-label="${esc(t("task_details"))}">💬</button>
    </div>
    ${(prioBadge||dueBadge||whoBadge||resBadge||checkBadge)?`<div class="task-meta">${prioBadge}${dueBadge}${whoBadge}${checkBadge}${resBadge}</div>`:""}
    ${miniChecks}
    ${canWrite?`<div class="tb">
      <div class="tb-arrows">${i>0?`<button onclick="moveTask(${tid},-1)" aria-label="Gauche">←</button>`:""}${i<2?`<button onclick="moveTask(${tid},1)" aria-label="Droite">→</button>`:""}</div>
      <div><button onclick="openTaskDetail(${tid})" title="${esc(t("edit"))}">✏️</button> <button onclick="delTask(${tid},this)" aria-label="${esc(t("del"))}">✕</button></div>
    </div>`:""}
  </div>`;
}

async function openPole(id){
  poleSel=id;D.tasks=[];
  if(!D.memberPoles.length&&S.user)await loadAdmin();
  syncHash();render();await loadTasks();render(true);
}
async function addTask(ev,pid){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    let title=String(f.get("title")||"").trim();
    const sub=String(f.get("subpole")||"").trim().toLowerCase();
    if(sub&&["culturel","partenariats","alumni"].includes(sub))title=`[${sub}] ${title}`;
    const priority=String(f.get("priority")||"normal");
    const due_date=String(f.get("due_date")||"").trim()||null;
    const assigned_to=String(f.get("assigned_to")||"").trim()||null;
    const tbl=await detectTaskTable();
    const payload={pole_id:pid,title,status:"todo",priority,due_date,assigned_to,created_by:S.user?S.user.id:null};
    let res=await sb.from(tbl).insert(payload);
    if(res.error&&/column/i.test(res.error.message||"")){
      res=await sb.from(tbl).insert({pole_id:pid,title,status:"todo"});
    }
    if(res.error)return toast(errMsg(res.error));
    ev.target.reset();await loadTasks();render(true);
  });
}
async function setTaskStatus(id,next){
  const tk=D.tasks.find(x=>String(x.id)===String(id));if(!tk||tk.status===next)return;
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({status:next}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.status=next;render(true);
}
async function moveTask(id,dir){
  const cols=["todo","doing","done"],tk=D.tasks.find(x=>String(x.id)===String(id));if(!tk)return;
  const next=cols[cols.indexOf(tk.status)+dir];if(!next)return;
  await setTaskStatus(id,next);
}
const dropTask=st=>{if(dragId!=null)moveTask(dragId,(["todo","doing","done"].indexOf(st)-["todo","doing","done"].indexOf((D.tasks.find(x=>String(x.id)===String(dragId))||{}).status)))};
async function delTask(id,btn){
  await withBusy(btn,async()=>{
    const tbl=await detectTaskTable();
    const {error}=await sb.from(tbl).delete().eq("id",id);
    if(error)return toast(errMsg(error));
    D.tasks=D.tasks.filter(x=>String(x.id)!==String(id));render(true);
  });
}
async function toggleSubtask(taskId,idx){
  const tk=D.tasks.find(x=>String(x.id)===String(taskId));if(!tk)return;
  const items=Array.isArray(tk.checklist)?[...tk.checklist]:[];
  if(!items[idx])return;
  items[idx]={...items[idx],done:!items[idx].done};
  const tbl=await detectTaskTable();
  const {error}=await sb.from(tbl).update({checklist:items}).eq("id",tk.id);
  if(error)return toast(errMsg(error));
  tk.checklist=items;
  if(taskModalId&&String(taskModalId)===String(tk.id))openTaskDetail(tk.id);
  render(true);
}

async function saveTaskDetail(ev,tid){
  ev.preventDefault();
  const tk=D.tasks.find(x=>String(x.id)===String(tid));if(!tk)return;
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    let title=String(f.get("title")||"").trim();
    const sub=String(f.get("subpole")||"").trim().toLowerCase();
    if(sub&&["culturel","partenariats","alumni"].includes(sub))title=`[${sub}] ${title}`;
    const rawRes=String(f.get("resource_url")||"").trim();
    const resource_url=rawRes?normalizeUrl(rawRes):null;
    if(rawRes&&!resource_url)return toast(t("e_url"));
    const payload={
      title,
      status:String(f.get("status")||tk.status),
      priority:String(f.get("priority")||"normal"),
      due_date:String(f.get("due_date")||"").trim()||null,
      assigned_to:String(f.get("assigned_to")||"").trim()||null,
      resource_url,
      description:String(f.get("description")||"").trim()||null
    };
    const tbl=await detectTaskTable();
    let res=await sb.from(tbl).update(payload).eq("id",tk.id);
    if(res.error&&/column/i.test(res.error.message||"")){
      res=await sb.from(tbl).update({title:payload.title,status:payload.status}).eq("id",tk.id);
    }
    if(res.error)return toast(errMsg(res.error));
    await loadTasks();render(true);toast(t("t_ok"));closeSheet();
  });
}

async function importHelloAssoCSV(input){
  const file=input.files&&input.files[0];if(!file)return;
  const text=await file.text();input.value="";
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return toast(t("e_generic"));
  const sep=lines[0].includes(";")?";":",";
  const headers=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  const emailIdx=headers.findIndex(h=>h.includes("email")||h.includes("e-mail")||h.includes("courriel"));
  if(emailIdx<0)return toast("Colonne e-mail introuvable dans le CSV.");
  const emails=[...new Set(lines.slice(1).map(l=>(l.split(sep)[emailIdx]||"").replace(/^"|"$/g,"").trim().toLowerCase()).filter(e=>e.includes("@")))];
  const until=academicYearEnd(),season=currentSeason();
  let matched=0,queued=0;
  for(const em of emails){
    const m=D.members.find(x=>(x.email||"").toLowerCase()===em||(x.helloasso_email||"").toLowerCase()===em);
    if(m){
      const {error}=await sb.from("profiles").update({paid:true,paid_until:until}).eq("id",m.id);
      if(!error){
        matched++;
        await sb.from("membership_history").insert({user_id:m.id,season,source:"Import CSV HelloAsso",paid_until:until});
      }
    }else{
      const {error}=await sb.from("helloasso_pending").upsert({email:em,season,paid_until:until},{onConflict:"email"});
      if(!error)queued++;
    }
  }
  await loadAdmin();render(true);toast(t("csv_done",{m:matched,q:queued}));
}

async function submitAuth(ev){
  ev.preventDefault();
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target),email=f.get("email").trim(),password=f.get("password");
    const redirectTo=location.origin+location.pathname;
    if(authMode==="forgot"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
      if(error)return toast(authErr(error));
      authInfo=t("reset_sent");render();return;
    }
    if(authMode==="signup"){

/* ===== JEU : QUIZ DES ROP ===== */
const QZ_LEVELS=[[0,"🌱","Observateur","Observer"],[100,"🎙️","Délégué","Delegate"],[300,"📜","Sponsor","Sponsor"],[550,"⚖️","Rapporteur","Rapporteur"],[800,"🏛️","Chair","Chairperson"],[1000,"🌐","Secrétaire général","Secretary-General"]];
let qz=null,lbBusy=false;
const qzPoints=()=>Object.values(D.quiz).filter(x=>x.mastered).length*10;
const qzMastered=()=>Object.values(D.quiz).filter(x=>x.mastered).length;
function qzLevel(pts){let l=QZ_LEVELS[0],next=null;for(let i=0;i<QZ_LEVELS.length;i++){if(pts>=QZ_LEVELS[i][0]){l=QZ_LEVELS[i];next=QZ_LEVELS[i+1]||null}}return{ico:l[1],name:lang==="fr"?l[2]:l[3],min:l[0],next:next?{pts:next[0],name:lang==="fr"?next[2]:next[3]}:null}}
function qzShuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function qzRing(pct,size=122,sw=10){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="${sw}"/><circle class="qz-ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--or)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" style="--c:${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function qzStart(mode,ch){
  let pool=mode==="ch"?QUIZ.filter(q=>q.ch===ch):mode==="weak"?QUIZ.filter(q=>!(D.quiz[q.id]&&D.quiz[q.id].mastered)):QUIZ;
  if(!pool.length){toast(t("qz_all_mastered"));return}
  pool=qzShuffle(pool);if(mode==="mix")pool=pool.slice(0,20);
  qz={mode,ch:ch||null,qs:pool.map(q=>{const [qt,...opts]=q[lang],pairs=opts.map((txt,k)=>({txt,ok:k===0}));return{q,qt,opts:qzShuffle(pairs)}}),i:0,picked:null,streak:0,best:0,right:0,gain:0,wrong:[],beforePts:qzPoints(),end:false};
  render(false,true);
}
async function qzPick(idx){
  if(!qz||qz.picked!==null)return;
  const cur=qz.qs[qz.i],ok=cur.opts[idx].ok;
  qz.picked=idx;
  if(ok){qz.streak++;qz.best=Math.max(qz.best,qz.streak);qz.right++}else{qz.streak=0;qz.wrong.push(cur)}
  const prev=D.quiz[cur.q.id]||{attempts:0,correct:0,mastered:false};
  const next={attempts:prev.attempts+1,correct:prev.correct+(ok?1:0),mastered:prev.mastered||ok};
  if(ok&&!prev.mastered)qz.gain+=10;
  D.quiz[cur.q.id]=next;
  if(!S.user)ls.set("somun_qz",D.quiz);
  else{const {error}=await sb.from("quiz_progress").upsert({user_id:S.user.id,q_id:cur.q.id,attempts:next.attempts,correct:next.correct,mastered:next.mastered},{onConflict:"user_id,q_id"});if(error&&!qz.saveErr){qz.saveErr=true;toast(t("qz_save_err"))}}
  render(true);
}
function qzNext(){
  if(!qz)return;
  if(qz.i+1<qz.qs.length){qz.i++;qz.picked=null;render(true)}
  else{qz.end=true;D.lb=null;render(true);if(qz.right/qz.qs.length>=.7)qzConfetti()}
}
function qzConfetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";
  const cols=["#EBC000","#00008E","#3ddc84","#ff6b78","#ffffff"];
  for(let i=0;i<42;i++){const s=document.createElement("i");s.style.left=(Math.random()*100)+"%";s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.45)+"s";s.style.setProperty("--dx",((Math.random()-.5)*220)+"px");s.style.setProperty("--rot",(Math.random()*720-360)+"deg");box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3200);
}

  </div>
  <h2>${t("qz_chapters")}</h2>
  <div class="grid">${QUIZ_CH.map(c=>{
    const qs=QUIZ.filter(q=>q.ch===c.id),done=qs.filter(q=>D.quiz[q.id]&&D.quiz[q.id].mastered).length,cp=qs.length?Math.round(done/qs.length*100):0;
    return `<div class="card qz-ch reveal"><div class="qz-ch-top"><span class="qz-ch-ico">${c.ico}</span><span class="tag">${esc(c.rop)}</span></div>
      <h3>${esc(c[lang])}</h3>

      <button class="btn sm ${done===qs.length?"ghost":""}" style="margin-top:12px;width:100%" onclick="qzStart('ch',${c.id})">${done===qs.length?t("qz_replay"):t("qz_play")}</button></div>`;
  }).join("")}</div>
  <h2>🏆 ${t("qz_lb")} <button onclick="loadLeaderboard(true)">↻</button></h2>
  <div class="card qz-board">${D.lb===null?`<div class="mute" style="padding:12px">${t("loading")}</div>`:!D.lb.length?`<div class="empty">${t("qz_lb_empty")}</div>`:D.lb.map((r,idx)=>{
    const me=S.user&&r.user_id===S.user.id,ptsR=Number(r.points)||0,lvR=qzLevel(ptsR),medal=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":(idx+1);
    const fullName=protectProperNames(`${r.prenom||""} ${r.nom||""}`.trim()||"Délégué");
    const init=(fullName[0]||"?").toUpperCase();
    return `<div class="qz-row ${me?"me":""}">

function vQuizPlay(){

function stagger(){
  document.querySelectorAll(".grid .reveal, .board-grid .reveal").forEach((el,i)=>{
    el.style.transitionDelay=Math.min(i,7)*65+"ms";
  });
}
function animateStats(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  document.querySelectorAll(".stat b").forEach(el=>{
    const to=parseInt(el.textContent,10);
    if(!Number.isFinite(to)||to<=0)return;
    const t0=performance.now(),dur=750;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
      if(p<1)requestAnimationFrame(step);
    };
    el.textContent="0";requestAnimationFrame(step);
  });
}
const GLOW=".ev,.news,.about .card,.board-card,.partners a.card,.pole-pick button";
document.addEventListener("pointermove",e=>{
  const c=e.target.closest&&e.target.closest(GLOW);
  if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty("--gx",(e.clientX-r.left)+"px");
  c.style.setProperty("--gy",(e.clientY-r.top)+"px");
},{passive:true});
let scrollRaf=0;
window.addEventListener("scroll",()=>{
  if(scrollRaf)return;
  scrollRaf=requestAnimationFrame(()=>{
    scrollRaf=0;
    const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    const sp=$("#sp");if(sp)sp.style.transform="scaleX("+(max>0?Math.min(1,scrollY/max):0)+")";
    const hv=document.querySelector(".hero-visual");
    if(hv)hv.style.setProperty("--py",Math.min(60,scrollY*.14)+"px");
  });
},{passive:true});

const reduceMotionGlobe=()=>Boolean(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function setHeroTilt(hero,nx,ny){
  if(reduceMotionGlobe())return;
  hero.style.setProperty("--mx",nx.toFixed(3));
  hero.style.setProperty("--my",ny.toFixed(3));
}
document.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;
  const hero=e.target.closest&&e.target.closest(".hero");
  if(!hero)return;
  const r=hero.getBoundingClientRect();
  setHeroTilt(hero,((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2);
},{passive:true});
document.addEventListener("pointerout",e=>{
  const hero=e.target.closest&&e.target.closest(".hero");
  if(hero&&(!e.relatedTarget||!hero.contains(e.relatedTarget)))setHeroTilt(hero,0,0);
},{passive:true});

init();
