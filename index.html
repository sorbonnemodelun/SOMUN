   expEn:"Under Rule III.e, each member has one vote in substantive voting."},
  {id:27,cat:"par",ref:"III.e",
   qFr:"Quelles options de vote figurent à la règle III.e pour le vote de fond ?",
   qEn:"Which voting options are listed in Rule III.e for substantive voting?",
   oFr:["« Yes », « No », « Abstain », « Yes with rights » ou « No with rights »","« Pour », « Contre » ou « Blanc » uniquement","« Present » ou « Present and Voting »","« Pass » ou « Veto »"],
   oEn:["'Yes', 'No', 'Abstain', 'Yes with rights' or 'No with rights'","'For', 'Against' or 'Blank' only","'Present' or 'Present and Voting'","'Pass' or 'Veto'"],
   ans:0,
   expFr:"La règle III.e énumère « Yes », « No », « Abstain », « Yes with rights » et « No with rights » (voir règle IX.c).",
   expEn:"Rule III.e lists 'Yes', 'No', 'Abstain', 'Yes with rights', and 'No with rights' (see Rule IX.c)."},
  {id:28,cat:"par",ref:"III.e",
   qFr:"Les membres qui s'abstiennent lors d'un vote de fond sont-ils comptés comme votants ?",
   qEn:"Are abstaining members counted as voting in a substantive vote?",
   oFr:["Non, les membres qui s'abstiennent ne sont pas considérés comme votants","Oui, ils comptent comme un vote négatif","Oui, ils comptent dans le décompte des « Yes »","Uniquement si le quorum est atteint"],
   oEn:["No, abstaining members are not considered to be voting","Yes, they count as a negative vote","Yes, they count toward 'Yes'","Only if quorum is met"],
   ans:0,
   expFr:"La règle III.e indique que les membres qui s'abstiennent ne sont pas considérés comme votants.",
   expEn:"Rule III.e states that abstaining members are not considered to be voting."},
  {id:29,cat:"par",ref:"III.f",
   qFr:"Que signifie la motion d'ajournement (Adjournment of the meeting) selon la règle III.f ?",
   qEn:"What does a motion for adjournment of the meeting mean under Rule III.f?",
   oFr:["Tous les travaux du Conseil sont achevés et le Conseil ne se réunira plus jusqu'à la prochaine session","Une pause de 10 minutes dans le débat","Le passage immédiat au vote final","La réouverture de la liste des orateurs"],
   oEn:["All Council business is completed and the Council will not reconvene until the next session","A 10-minute break in debate","Immediate move to final vote","Reopening the speakers' list"],
   ans:0,
   expFr:"Selon la règle III.f, l'ajournement signifie que tous les travaux du Conseil sont achevés et que le Conseil ne se réunira pas avant la session suivante.",
   expEn:"Under Rule III.f, adjournment means all Council business is completed and it will not reconvene until the next session."},
  {id:30,cat:"par",ref:"III.f",
   qFr:"Quelle majorité est requise pour une motion d'ajournement de la séance ?",
   qEn:"What majority is required for a motion to adjourn the meeting?",
   oFr:["Une majorité des deux tiers","Une majorité simple","Une majorité des trois quarts","L'unanimité"],
   oEn:["A two-thirds majority","A simple majority","A three-quarters majority","Unanimity"],
   ans:0,
   expFr:"La règle III.f précise qu'une majorité des deux tiers est nécessaire pour l'ajournement de la séance.",
   expEn:"Rule III.f specifies that a two-thirds majority is needed for adjournment of the meeting."},
  {id:31,cat:"par",ref:"III.f",
   qFr:"Une motion d'ajournement prononcée par les présidents est-elle susceptible d'appel ?",
   qEn:"Is a motion to adjourn by the chairs subject to appeal?",
   oFr:["Non, une motion d'ajournement par les présidents n'est pas susceptible d'appel","Oui, sur motion de trois délégués","Oui, pendant les 30 secondes suivantes","Uniquement si elle est rejetée"],
   oEn:["No, a motion to adjourn by the chairs is not appealable","Yes, on a motion by three delegates","Yes, within the next 30 seconds","Only if defeated"],
   ans:0,
   expFr:"La règle III.f dispose qu'une motion d'ajournement décidée par les présidents n'est pas susceptible d'appel.",
   expEn:"Rule III.f states that a motion to adjourn by the chairs is not appealable."},
  {id:32,cat:"par",ref:"III.e",
   qFr:"À quel moment le comité passe-t-il à la procédure de vote de fond sur le sujet ?",
   qEn:"When does the committee move into substantive voting procedures on the Topic Area?",
   oFr:["Une fois que le Comité a clos le débat sur le sujet","Dès l'ouverture de la liste des orateurs","Avant la présentation du projet de résolution","Dès que l'appel est terminé"],
   oEn:["Once the Committee closes debate on the Topic Area","As soon as the speakers' list opens","Before introducing the draft resolution","As soon as roll call ends"],
   ans:0,
   expFr:"La règle III.e prévoit que le Comité entre en procédure de vote de fond une fois le débat sur le sujet clos.",
   expEn:"Rule III.e states that once the Committee closes debate on the Topic Area, it moves into substantive voting procedures."},
  {id:33,cat:"par",ref:"III.a",
   qFr:"Quand débute l'appel (Roll Call) selon la règle III.a ?",
   qEn:"When does the Roll Call begin under Rule III.a?",
   oFr:["Après l'ouverture de la séance par les présidents","Après la clôture du débat","Pendant un caucus modéré","Avant l'arrivée du Bureau"],
   oEn:["After the opening of the session by the chairs","After closure of debate","During a moderated caucus","Before the chairs arrive"],
   ans:0,
   expFr:"Selon la règle III.a, après l'ouverture de la séance, les présidents commencent par un appel.",
   expEn:"Under Rule III.a, after the opening of the session, the chairs begin with a roll call."},
  {id:34,cat:"par",ref:"III.c",
   qFr:"Quelle action intervient juste après l'appel selon la règle III.c ?",
   qEn:"What step follows roll call under Rule III.c?",
   oFr:["Les délégués peuvent soumettre une motion pour fixer l'ordre du jour","Le vote final sur la résolution","La clôture définitive de la session","Le dépôt d'un amendement inimical"],
   oEn:["Delegates may submit a motion to set the Agenda","The final vote on the resolution","Final closure of the session","Filing an unfriendly amendment"],
   ans:0,
   expFr:"La règle III.c prévoit qu'après l'appel, les délégués peuvent proposer une motion pour fixer l'ordre du jour.",
   expEn:"Rule III.c provides that after a roll call, delegates may submit a motion to set the Agenda."},

  // --- Catégorie 3 : IV–VI Débats, Points & Motions (34 questions) ---
  {id:35,cat:"deb",ref:"IV.a",
   qFr:"Quel est le temps de parole par défaut sur la General Speakers' List (GSL) ?",
   qEn:"What is the default speaking time on the General Speakers' List (GSL)?",
   oFr:["90 secondes","60 secondes","120 secondes","30 secondes"],
   oEn:["90 seconds","60 seconds","120 seconds","30 seconds"],
   ans:0,
   expFr:"La règle IV.a fixe par défaut le temps de parole à 90 secondes, modifiable par motion.",
   expEn:"Rule IV.a sets speaker's time by default to 90 seconds, which delegates can move to change."},
  {id:36,cat:"deb",ref:"IV.a",
   qFr:"Quelle est l'activité par défaut du Comité lorsqu'aucune motion n'est en cours ?",
   qEn:"What is the default activity of the Committee when no motions are on the floor?",
   oFr:["La General Speakers' List (liste des orateurs)","Un unmoderated caucus","Une consultation of the whole","Un vote par appel nominal"],
   oEn:["The General Speakers' List","An unmoderated caucus","A consultation of the whole","A roll call vote"],
   ans:0,
   expFr:"Selon la règle IV.a, la liste des orateurs est l'activité par défaut et les débats y reviennent automatiquement sans motion active.",
   expEn:"Under Rule IV.a, the Speaker's List is the default activity and debate automatically returns to it if no motions are on the floor."},
  {id:37,cat:"deb",ref:"IV.a",
   qFr:"Que doit-il se passer avant de pouvoir présenter un projet de résolution selon la règle IV.a ?",
   qEn:"What must happen before introducing any draft resolution under Rule IV.a?",
   oFr:["La liste générale des orateurs (GSL) doit être close","Un vote à la majorité des trois quarts doit avoir eu lieu","Deux amendements amicaux doivent être adoptés","Le quorum doit être doublé"],
   oEn:["The general speakers' list must be closed","A three-quarters vote must have occurred","Two friendly amendments must pass","Quorum must be doubled"],
   ans:0,
   expFr:"La règle IV.a dispose que la liste générale des orateurs doit être close avant l'introduction de tout projet de résolution.",
   expEn:"Rule IV.a states that the general speakers' list must be closed before introducing any draft resolution."},
  {id:38,cat:"deb",ref:"IV.a",
   qFr:"Quand le débat prend-il fin automatiquement si la liste des orateurs s'épuise sans projet de résolution à présenter ?",
   qEn:"When does debate close automatically if the General Speakers' List runs out with no draft resolutions to introduce?",
   oFr:["Dès que la liste des orateurs s'épuise et qu'aucun projet de résolution n'est à introduire","Après trois minutes de silence","Dès qu'un délégué demande un caucus","Uniquement sur décision du Secrétaire général"],
   oEn:["As soon as the General Speaker's List runs out and there are no draft resolutions to be introduced","After three minutes of silence","As soon as a delegate moves a caucus","Only by Secretary-General decision"],
   ans:0,
   expFr:"La règle IV.a précise que le débat est clos dès que la liste des orateurs s'épuise et qu'aucun projet de résolution n'est à présenter.",
   expEn:"Rule IV.a states that debate closes as soon as the General Speaker's List runs out and there are no draft resolutions to be introduced."},
  {id:39,cat:"deb",ref:"IV.b",
   qFr:"Comment les délégations signalent-elles leur souhait de prendre la parole ?",
   qEn:"How do delegations signify their wish to speak on an item before the Council?",
   oFr:["En levant leur pancarte (placard)","En se levant sans mot dire","En envoyant un message au rapporteur","En frappant sur la table"],
   oEn:["By raising their placards","By standing up silently","By sending a note to the rapporteur","By knocking on the table"],
   ans:0,
   expFr:"La règle IV.b prévoit que les délégations manifestent leur souhait de parler en levant leur pancarte.",
   expEn:"Rule IV.b states that delegations wishing to speak signify this by raising their placards."},
  {id:40,cat:"deb",ref:"IV.b",
   qFr:"Un délégué peut-il intervenir sans avoir préalablement obtenu l'autorisation du Bureau ?",
   qEn:"May a delegate address the Council without first obtaining permission from the chairs?",
   oFr:["Non, aucune intervention sans autorisation préalable du Bureau","Oui, s'il s'agit d'un sponsor","Oui, pendant moins de 15 secondes","Oui, si la pancarte est levée depuis deux tours"],
   oEn:["No, no delegate may address the Council without prior permission from the chairs","Yes, if a sponsor","Yes, for under 15 seconds","Yes, if placard was raised for two rounds"],
   ans:0,
   expFr:"La règle IV.b énonce qu'aucun délégué ne peut s'adresser au Conseil sans avoir obtenu l'autorisation préalable des présidents.",
   expEn:"Rule IV.b states that no delegate may address the Council without having previously obtained permission from the chairs."},
  {id:41,cat:"deb",ref:"IV.b",
   qFr:"Que peuvent faire les présidents si les propos d'un orateur ne portent pas sur le sujet en discussion ?",
   qEn:"What may chairs do if a speaker's remarks are not relevant to the subject under discussion?",
   oFr:["Rappeler l'orateur à l'ordre (qu'il respecte les règles de la séance formelle)","Lui accorder 30 secondes supplémentaires","L'exclure définitivement de la conférence","Suspendre le vote de fond"],
   oEn:["Call the speaker to order to obey formal meeting rules","Grant 30 extra seconds","Expel the delegation permanently","Suspend substantive voting"],
   ans:0,
   expFr:"La règle IV.b permet aux présidents de rappeler un orateur à l'ordre si ses remarques ne sont pas pertinentes par rapport au sujet.",
   expEn:"Rule IV.b allows chairs to call a speaker to order if remarks are not relevant to the subject under discussion."},
  {id:42,cat:"deb",ref:"IV.c",
   qFr:"Quels sont les trois modes de cession (yield) du temps restant lorsqu'un orateur a terminé avant la fin de son temps ?",
   qEn:"What are the three ways a speaker who finishes early may yield remaining time?",
   oFr:["Au Bureau, aux questions, ou à un autre délégué","À un observateur, à la presse, ou au chronométreur","Aux questions, à l'ajournement, ou au vote","Au Bureau, à l'amendement, ou au secrétaire"],
   oEn:["To the chairs, to questions, or to another delegate","To an observer, to press, or to the timer","To questions, to adjournment, or to vote","To chairs, to amendment, or to secretary"],
   ans:0,
   expFr:"La règle IV.c prévoit la cession (yield) aux présidents, aux questions ou à un autre délégué.",
   expEn:"Rule IV.c provides yields to the chairs, to questions, or to another delegate."},
  {id:43,cat:"deb",ref:"IV.c",
   qFr:"Lors d'un yield aux questions, combien de questions chaque délégué sélectionné peut-il poser, et quel temps compte dans la limite ?",
   qEn:"During a yield to questions, how many questions may each selected delegate ask, and what counts toward the time limit?",
   oFr:["Une question chacun ; seules les réponses de l'orateur comptent dans le temps imparti","Deux questions chacun ; tout le temps de questionnement compte","Trois questions chacun ; seules les questions comptent","Une question chacun ; le chronomètre est arrêté"],
   oEn:["One question each; only the speaker's answers count toward the time limit","Two questions each; all questioning time counts","Three questions each; only questions count","One question each; the clock is paused"],
   ans:0,
   expFr:"Selon la règle IV.c, chaque intervenant sélectionné est limité à une question et seules les réponses de l'orateur comptent dans la limite de temps.",
   expEn:"Under Rule IV.c, selected questioners are limited to one question each, and only the speaker's answers count toward the time limit."},
  {id:44,cat:"deb",ref:"IV.c",
   qFr:"Un délégué qui reçoit un yield d'un autre délégué peut-il céder le temps restant à un troisième délégué ?",
   qEn:"May a delegate who accepts a yield from another delegate make a further yield to a third delegate?",
   oFr:["Non, un seul yield à un autre délégué est possible dans le temps d'un orateur","Oui, jusqu'à deux cessions successives","Oui, s'il cède aux questions","Oui, sur accord du délégué initial"],
   oEn:["No, only one yield to another delegate is possible within one speaker's time","Yes, up to two successive yields","Yes, if yielding to questions","Yes, with the initial speaker's consent"],
   ans:0,
   expFr:"La règle IV.c précise que le délégué acceptant un yield ne peut faire de nouvelle cession : un seul yield vers un autre délégué est possible.",
   expEn:"Rule IV.c states that a delegate accepting a yield may make no further yields; only one yield to another delegate is possible."},
  {id:45,cat:"deb",ref:"IV.d",
   qFr:"Quelle est la durée maximale d'une prolongation unique d'un unmoderated caucus ?",
   qEn:"What is the maximum length of a single extension of an unmoderated caucus?",
   oFr:["La moitié de sa durée initiale","Le double de sa durée initiale","5 minutes maximum","Égale à sa durée initiale"],
   oEn:["Half of its original time","Double its original time","5 minutes maximum","Equal to its original time"],
   ans:0,
   expFr:"La règle IV.d indique qu'un unmoderated caucus peut être prolongé une fois et ne peut excéder la moitié de sa durée initiale.",
   expEn:"Rule IV.d states an unmoderated caucus can be extended once and cannot exceed half of its original time."},
  {id:46,cat:"deb",ref:"IV.e",
   qFr:"Que doit préciser un délégué lorsqu'il propose une motion de moderated caucus ?",
   qEn:"What must a delegate state when proposing a Motion for a Moderated Caucus?",
   oFr:["L'objet du caucus, la durée totale et le temps de parole individuel par délégué","Uniquement la durée totale","Le nom des co-auteurs de la résolution","Le type de vote souhaité"],
   oEn:["The purpose, total time, and individual speaking time per delegate","Only the total time","Names of resolution co-authors","Desired voting type"],
   ans:0,
   expFr:"Selon la règle IV.e, le délégué indique brièvement l'objet du caucus, propose une durée totale et un temps de parole individuel.",
   expEn:"Under Rule IV.e, the delegate briefly states the purpose, proposes a total time, and proposes an individual speaking time."},
  {id:47,cat:"deb",ref:"IV.e",
   qFr:"Si plusieurs motions de moderated caucus sont proposées simultanément, dans quel ordre sont-elles mises aux voix ?",
   qEn:"If multiple Motions for a Moderated Caucus are on the floor at once, in what order are they voted on?",
   oFr:["Par ordre de perturbation par rapport à la liste des orateurs, de la plus perturbatrice à la moins perturbatrice","Par ordre alphabétique des pays","De la durée totale la plus courte à la plus longue","Dans l'ordre exact où elles ont été déposées"],
   oEn:["In order of disruptiveness relative to the General Speakers' List, from most to least disruptive","In alphabetical order of countries","Shortest total duration to longest","In exact chronological order of proposal"],
   ans:0,
   expFr:"La règle IV.e prévoit un vote par ordre de perturbation par rapport à la GSL, en commençant par la motion la plus perturbatrice.",
   expEn:"Rule IV.e states they are voted on in order of disruptiveness relative to the GSL, beginning with the most disruptive."},
  {id:48,cat:"deb",ref:"IV.e",
   qFr:"La cession de temps (yielding) est-elle autorisée pendant un moderated caucus ?",
   qEn:"Is yielding of time allowed during moderated caucuses?",
   oFr:["Non, il n'y a pas de cession de temps dans les moderated caucuses","Oui, uniquement vers le Bureau","Oui, vers un autre délégué","Oui, si le temps restant dépasse 30 secondes"],
   oEn:["No, there is no yielding of time in moderated caucuses","Yes, only to the chairs","Yes, to another delegate","Yes, if over 30 seconds remain"],
   ans:0,
   expFr:"La règle IV.e énonce clairement qu'il n'y a pas de cession de temps (no yielding of time) dans les moderated caucuses.",
   expEn:"Rule IV.e clearly states there is no yielding of time in moderated caucuses."},
  {id:49,cat:"deb",ref:"IV.e",
   qFr:"Quelle est la durée maximale d'une prolongation d'un moderated caucus ?",
   qEn:"What is the maximum duration of an extension of a moderated caucus?",
   oFr:["Au plus égale à la durée initiale du moderated caucus","La moitié de la durée initiale","Trois fois la durée initiale","Illimitée sur vote simple"],
   oEn:["Cannot exceed the original time of the moderated caucus","Half of the original time","Three times the original time","Unlimited by simple majority"],
   ans:0,
   expFr:"La règle IV.e précise qu'un moderated caucus peut être prolongé une fois sans dépasser sa durée initiale.",
   expEn:"Rule IV.e states a moderated caucus can be extended once and cannot exceed its original time."},
  {id:50,cat:"deb",ref:"IV.e",
   qFr:"La décision du Bureau de déclarer irrecevable une motion de moderated caucus peut-elle faire l'objet d'un appel ?",
   qEn:"Is the chairpersons' decision to rule out a Motion for a Moderated Caucus subject to appeal?",
   oFr:["Non, la décision des présidents n'est pas susceptible d'appel","Oui, à la majorité simple","Oui, à la majorité des deux tiers","Oui, si deux sponsors le demandent"],
   oEn:["No, the decision of the chairpersons is not subject to appeal","Yes, by simple majority","Yes, by two-thirds majority","Yes, if two sponsors request it"],
   ans:0,
   expFr:"La règle IV.e indique que la décision des présidents d'écarter une motion de moderated caucus n'est pas susceptible d'appel.",
   expEn:"Rule IV.e states that the chairpersons' decision to rule out a Motion for a Moderated Caucus is not subject to appeal."},
  {id:51,cat:"deb",ref:"V.a",
   qFr:"Quand un délégué peut-il soulever un Point of Order ?",
   qEn:"When may a delegate raise a Point of Order?",
   oFr:["Lorsqu'il estime que le Bureau procède d'une manière contraire au règlement intérieur","Pour répondre à une critique sur le fond du texte","Pour poser une question de fond à un autre délégué","Pendant le discours d'un autre orateur"],
   oEn:["When believing the chairs are proceeding contrary to the Rules of Procedure","To rebut a substantive argument","To ask a substantive question to another delegate","While a speaker is speaking"],
   ans:0,
   expFr:"Selon la règle V.a, un Point of Order porte sur un manquement supposé au règlement intérieur par le Bureau et n'interrompt pas un orateur.",
   expEn:"Under Rule V.a, a Point of Order addresses chairs proceeding contrary to the ROP and may not interrupt a speaker."},
  {id:52,cat:"deb",ref:"V.a",
   qFr:"Un délégué qui soulève un Point of Order peut-il parler du fond de la question débattue ?",
   qEn:"May a delegate rising to a Point of Order speak on the substance of the matter under discussion?",
   oFr:["Non, il ne peut pas parler du fond du sujet en discussion","Oui, pendant 30 secondes","Oui, s'il a obtenu l'accord des signataires","Uniquement en fin de séance"],
   oEn:["No, a delegate rising to a Point of Order may not speak on the substance","Yes, for 30 seconds","Yes, with signatories' consent","Only at session end"],
   ans:0,
   expFr:"La règle V.a interdit expressément de parler du fond de la question lors d'un Point of Order.",
   expEn:"Rule V.a explicitly states that a delegate rising to a Point of Order may not speak on the substance."},
  {id:53,cat:"deb",ref:"V.b",
   qFr:"Quel est l'objet d'un Point of Personal Privilege ?",
   qEn:"What is the purpose of a Point of Personal Privilege?",
   oFr:["Signaler au Bureau un inconfort physique nuisant à la participation (ex. température ou audition difficile)","Contester l'ordre des amendements","Demander le retrait d'un projet de résolution","Proposer un vote par appel nominal"],
   oEn:["Inform chairs of physical discomfort impairing participation (e.g. room heat or unable to hear)","Challenge amendment order","Move to withdraw a draft resolution","Propose a roll call vote"],
   ans:0,
   expFr:"La règle V.b couvre l'inconfort physique nuisant à la participation, comme une chaleur excessive ou l'impossibilité d'entendre l'orateur.",
   expEn:"Rule V.b covers physical discomfort impairing participation, such as high room temperature or inability to hear the speaker."},
  {id:54,cat:"deb",ref:"V.b",
   qFr:"Un Point of Personal Privilege peut-il interrompre un orateur ?",
   qEn:"May a Point of Personal Privilege interrupt a speaker?",
   oFr:["Oui, si cela est inévitablement nécessaire, avec la plus grande discrétion","Jamais en aucune circonstance","Uniquement si le délégué est rapporteur","Seulement après 60 secondes de discours"],
   oEn:["Yes, if unavoidably necessary, with utmost discretion","Never under any circumstances","Only if rapporteur","Only after 60 seconds of speech"],
   ans:0,
   expFr:"La règle V.b prévoit qu'un Point of Personal Privilege peut interrompre un orateur si cela est inévitablement nécessaire, avec discrétion.",
   expEn:"Rule V.b states a Point of Personal Privilege may interrupt a speaker if unavoidably necessary, with utmost discretion."},
  {id:55,cat:"deb",ref:"V.c",
   qFr:"À quoi sert un Point of Information selon la règle V.c ?",
   qEn:"What is a Point of Information used for under Rule V.c?",
   oFr:["Demander au Bureau une clarification de procédure ou un rappel des points dont le Conseil est saisi","Interrompre un orateur en plein discours","Modifier le texte d'une clause opératoire","Demander un droit de réponse"],
   oEn:["Obtain procedural clarification from chairs or a statement of matters before the Council","Interrupt a speaker mid-speech","Edit an operative clause","Request a right of reply"],
   ans:0,
   expFr:"La règle V.c définit le Point of Information comme une demande au Bureau pour clarifier la procédure ou l'état des questions à l'ordre du jour.",
   expEn:"Rule V.c defines a Point of Information as raised to chairs to obtain procedural clarification or a statement of matters before the Council."},
  {id:56,cat:"deb",ref:"V.c",
   qFr:"Un Point of Information peut-il interrompre un orateur ?",
   qEn:"May a Point of Information interrupt a speaker?",
   oFr:["Non, les délégués ne peuvent pas interrompre un orateur sur un Point of Information","Oui, si la question est courte","Oui, sur décision d'un co-auteur","Uniquement lors d'un caucus"],
   oEn:["No, delegates may not interrupt a speaker on a Point of Information","Yes, if the question is brief","Yes, if approved by a co-author","Only during a caucus"],
   ans:0,
   expFr:"La règle V.c indique explicitement que les délégués ne peuvent pas interrompre un orateur sur un Point of Information.",
   expEn:"Rule V.c explicitly states delegates may not interrupt a speaker on a Point of Information."},
  {id:57,cat:"deb",ref:"V.d",
   qFr:"Dans quel cas le Bureau peut-il accorder un Right of Reply ?",
   qEn:"When may the chairs accord a Right of Reply?",
   oFr:["Lorsqu'un discours contient des propos clairement insultants pour la dignité personnelle ou nationale d'un délégué","Dès qu'un délégué n'est pas d'accord avec un argument","À chaque fin de discours sur la GSL","Uniquement pendant les votes"],
   oEn:["When a speech contains language clearly insulting to personal or national dignity","Whenever a delegate disagrees with an argument","After every GSL speech","Only during voting"],
   ans:0,
   expFr:"La règle V.d prévoit qu'un Right of Reply peut être accordé si un discours porte atteinte à la dignité personnelle ou nationale.",
   expEn:"Rule V.d allows a Right of Reply if a speech contains language clearly insulting to personal or national dignity."},
  {id:58,cat:"deb",ref:"V.d",
   qFr:"Quelle est la durée maximale d'un Right of Reply selon la règle V.d ?",
   qEn:"What is the time limit of a Right of Reply under Rule V.d?",
   oFr:["30 secondes","60 secondes","90 secondes","15 secondes"],
   oEn:["30 seconds","60 seconds","90 seconds","15 seconds"],
   ans:0,
   expFr:"La règle V.d fixe la limite d'un Right of Reply à 30 secondes.",
   expEn:"Rule V.d limits a Right of Reply to 30 seconds."},
  {id:59,cat:"deb",ref:"V.d",
   qFr:"Peut-on demander un Right of Reply en réponse à un Right of Reply ?",
   qEn:"May there be a Right of Reply to a Right of Reply?",
   oFr:["Non, il n'y a pas de droit de réponse à un droit de réponse","Oui, limité à 15 secondes","Oui, avec l'accord du Bureau","Uniquement sur vote des deux tiers"],
   oEn:["No, there shall be no Right of Reply to a Right of Reply","Yes, limited to 15 seconds","Yes, with chairs' consent","Only by two-thirds vote"],
   ans:0,
   expFr:"La règle V.d stipule expressément qu'il n'y a pas de Right of Reply à un Right of Reply.",
   expEn:"Rule V.d explicitly states there shall be no Right of Reply to a Right of Reply."},
  {id:60,cat:"deb",ref:"V.d",
   qFr:"Comment demande-t-on un Right of Reply et la décision du Bureau est-elle susceptible d'appel ?",
   qEn:"How is a Right of Reply requested, and is the chair's decision appealable?",
   oFr:["Par note envoyée au Bureau ; la décision du président n'est pas susceptible d'appel","À voix haute en interrompant l'orateur ; appel possible","Par pancarte levée ; appel à majorité simple","Par e-mail au secrétaire ; appel possible"],
   oEn:["By sending a note to the chairs; the chair's decision is not subject to appeal","Aloud interrupting the speaker; appealable","By raising a placard; appealable by simple majority","By email to the secretary; appealable"],
   ans:0,
   expFr:"Selon la règle V.d, la demande se fait par note au Bureau et la décision du président n'est pas susceptible d'appel.",
   expEn:"Under Rule V.d, a delegate requests it by note to the chairs and the chair's decision is not subject to appeal."},
  {id:61,cat:"deb",ref:"VI.A",
   qFr:"Quand les motions procédurales peuvent-elles être présentées pendant le débat formel ?",
   qEn:"When may procedural motions be raised during formal debate?",
   oFr:["À tout moment où la parole est libre, avant la clôture du débat, sans interrompre un orateur","Uniquement après l'adoption d'un amendement","Pendant qu'un orateur a la parole","Uniquement pendant la procédure de vote"],
   oEn:["At any time when the floor is open, prior to Closure of Debate, without interrupting a speaker","Only after an amendment passes","While a speaker has the floor","Only during voting procedure"],
   ans:0,
   expFr:"La règle VI.A précise que les motions sont recevables lorsque la parole est ouverte, avant la clôture du débat, et n'interrompent pas un orateur.",
   expEn:"Rule VI.A states motions may be raised when the floor is open, prior to Closure of Debate, without interrupting a speaker."},
  {id:62,cat:"deb",ref:"VI.A.iii",
   qFr:"Comment fonctionne une « Motion for a consultation of the whole » ?",
   qEn:"How does a 'Motion for a consultation of the whole' work?",
   oFr:["Un temps global est fixé et l'auteur peut parler puis céder le temps restant à qui il souhaite jusqu'à épuisement","Chaque orateur a exactement 45 secondes sur liste","Le Bureau choisit seul chaque intervenant sans cession","Le vote se fait clause par clause"],
   oEn:["Overall time is set and the mover may speak and yield remaining time to chosen delegates until time runs out","Each speaker gets 45 seconds on a list","Chairs alone pick speakers with no yields","Voting happens clause by clause"],
   ans:0,
   expFr:"Selon la règle VI.A.iii, une consultation of the whole fixe une durée globale et permet de céder le temps restant de délégué en délégué.",
   expEn:"Under Rule VI.A.iii, a consultation of the whole sets an overall time and lets the mover speak and yield remaining time to chosen delegates."},
  {id:63,cat:"deb",ref:"VI.A.iii",
   qFr:"Que peuvent faire les présidents si un délégué limite ses cessions par favoritisme contre la volonté du comité ?",
   qEn:"What may chairs do if a delegate limits yields out of favouritism against the will of the committee?",
   oFr:["Ils peuvent demander que le temps soit cédé à d'autres délégués","Ils doivent clore définitivement le débat","Ils annulent toutes les résolutions","Ils doublent la durée du caucus"],
   oEn:["They may ask for the time to be yielded to other delegates","They must permanently close debate","They cancel all draft resolutions","They double the caucus time"],
   ans:0,
   expFr:"La règle VI.A.iii permet aux présidents de demander que le temps soit cédé à d'autres délégués en cas de favoritisme contraire à la volonté du comité.",
   expEn:"Rule VI.A.iii allows chairs to ask for time to be yielded to other delegates if favouritism goes against the committee's will."},
  {id:64,cat:"deb",ref:"VI.A.iv",
   qFr:"Quelle majorité est requise pour adopter une motion de suspension de la séance (en cas d'objection) ?",
   qEn:"What majority is required to pass a motion for the suspension of the meeting if objected to?",
   oFr:["Une majorité simple","Une majorité des trois quarts","Une majorité des deux tiers","L'unanimité"],
   oEn:["A simple majority","A three-quarters majority","A two-thirds majority","Unanimity"],
   ans:0,
   expFr:"Selon la règle VI.A.iv, en cas d'objection, la motion de suspension de la séance nécessite une majorité simple.",
   expEn:"Under Rule VI.A.iv, if objected to, a motion to suspend the meeting requires a simple majority to pass."},
  {id:65,cat:"deb",ref:"VI.A.v",
   qFr:"Quelle majorité est nécessaire pour adopter une motion de reprise du débat (Motion to resume debate) ?",
   qEn:"What majority is needed to pass a Motion to resume debate?",
   oFr:["Une majorité simple","Une majorité des trois quarts","Une majorité des deux tiers","Uniquement l'accord du président"],
   oEn:["A simple majority","A three-quarters majority","A two-thirds majority","Chair's consent alone"],
   ans:0,
   expFr:"La règle VI.A.v prévoit qu'une motion de reprise du débat requiert un soutien (second) et une majorité simple.",
   expEn:"Rule VI.A.v states a motion to resume debate requires a second and a simple majority."},
  {id:66,cat:"deb",ref:"VI.A.vi",
   qFr:"Quelle majorité est exigée pour adopter une motion de clôture du débat (Motion to Close Debate) ?",
   qEn:"What majority is required for a Motion to Close Debate?",
   oFr:["Trois quarts du Conseil","Deux tiers du Conseil","Majorité simple","Quatre cinquièmes du Conseil"],
   oEn:["Three-quarters of the Council","Two-thirds of the Council","Simple majority","Four-fifths of the Council"],
   ans:0,
   expFr:"La règle VI.A.vi dispose que si trois quarts du Conseil sont favorables à la clôture du débat, les présidents prononcent la clôture.",
   expEn:"Rule VI.A.vi states that if three-quarters of the Council favor closure, the chairs declare debate closed."},
  {id:67,cat:"deb",ref:"VI.A.vi",
   qFr:"Que se passe-t-il lorsque la clôture du débat est prononcée sur un sujet de fond ?",
   qEn:"What happens when closure of debate is declared on a substantive issue?",
   oFr:["Le Conseil entre en procédure de vote sur l'ensemble des amendements et projets de résolution présentés","La séance est ajournée jusqu'à l'année suivante","La liste des orateurs recommence avec 90 secondes","Tous les amendements sont rejetés d'office"],
   oEn:["The Council enters voting procedure on all amendments and draft resolutions presented","The meeting is adjourned until next year","The speakers' list restarts at 90 seconds","All amendments are automatically rejected"],
   ans:0,
   expFr:"Selon la règle VI.A.vi, la clôture du débat fait entrer le Conseil en procédure de vote sur tous les amendements et projets de résolution présentés.",
   expEn:"Under Rule VI.A.vi, closure of debate brings the Council into voting procedure on all amendments and draft resolutions presented."},
  {id:68,cat:"deb",ref:"VI.B",
   qFr:"Jusqu'à quel moment l'auteur d'une motion peut-il la retirer, et peut-elle être représentée ?",
   qEn:"Until when may a motion be withdrawn by its proposer, and may it be reintroduced?",
   oFr:["À tout moment avant le début du vote ; n'importe quel membre peut la représenter","Jamais une fois le second obtenu ; non représentable","Jusqu'à 10 secondes après l'annonce ; uniquement par le même délégué","Uniquement avant l'ouverture du débat ; non représentable"],
   oEn:["At any time before voting on it has commenced; any member may reintroduce it","Never once seconded; cannot be reintroduced","Up to 10 seconds after announcement; only by same delegate","Only before debate opens; cannot be reintroduced"],
   ans:0,
   expFr:"La règle VI.B permet le retrait d'une motion avant le début du vote et sa réintroduction par n'importe quel membre.",
   expEn:"Rule VI.B allows withdrawing a motion before voting begins and reintroducing it by any member."},

  // --- Catégorie 4 : VII–VIII Résolutions & Amendements (17 questions) ---
  {id:69,cat:"res",ref:"VII.a",
   qFr:"De quoi se compose au minimum un Draft Resolution selon la règle VII.a ?",
   qEn:"What does a Draft Resolution consist of at minimum under Rule VII.a?",
   oFr:["Au moins une clause préambulatoire et une clause opératoire","Au moins trois clauses préambulatoires et cinq opératoires","Uniquement des clauses opératoires","Au moins deux annexes et un préambule"],
   oEn:["At least one preambular and one operative clause","At least three preambular and five operative clauses","Operative clauses only","At least two annexes and a preamble"],
   ans:0,
   expFr:"La règle VII.a définit un projet de résolution comme comportant au moins une clause préambulatoire et une clause opératoire.",
   expEn:"Rule VII.a defines a draft resolution as consisting of at least one preambular and one operative clause."},
  {id:70,cat:"res",ref:"VII.b",
   qFr:"Combien un projet de résolution doit-il compter de sponsors (auteurs principaux) ?",
   qEn:"How many sponsors (principal submitters) must a Draft Resolution have?",
   oFr:["Au minimum 2 et au maximum 5 sponsors","Au minimum 1 et au maximum 3 sponsors","Au minimum 3 et au maximum 8 sponsors","Exactement 2 sponsors"],
   oEn:["At least two and at most five sponsors","At least one and at most three sponsors","At least three and at most eight sponsors","Exactly two sponsors"],
   ans:0,
   expFr:"La règle VII.b fixe le nombre de sponsors entre deux minimum et cinq maximum.",
   expEn:"Rule VII.b requires at least two sponsors and at most five sponsors."},
  {id:71,cat:"res",ref:"VII.c",
   qFr:"Combien un projet de résolution doit-il compter de signatories (co-auteurs soutiens) ?",
   qEn:"How many signatories (supporters) must a Draft Resolution have?",
   oFr:["Au minimum 2 et au maximum 8 délégations","Au minimum 1 et au maximum 5 délégations","Au minimum 5 et au maximum 12 délégations","Aucune limite supérieure"],
   oEn:["At least 2 and at most 8 delegations","At least 1 and at most 5 delegations","At least 5 and at most 12 delegations","No upper limit"],
   ans:0,
   expFr:"La règle VII.c impose au moins 2 et au plus 8 signataires pour un projet de résolution.",
   expEn:"Rule VII.c requires at least 2 and at most 8 delegations as signatories."},
  {id:72,cat:"res",ref:"VII.d",
   qFr:"Quelle est la durée totale accordée pour introduire un projet de résolution approuvé, et comment se répartit-elle ?",
   qEn:"What is the total time to introduce an approved Draft Resolution, and how is it divided?",
   oFr:["4 minutes : 3 minutes de présentation et 1 minute pour les questions de clarification non substantielles","3 minutes : 2 minutes de présentation et 1 minute de questions","5 minutes de présentation sans questions","2 minutes au total"],
   oEn:["4 minutes: 3 minutes to present and 1 minute for non-substantive clarifying questions","3 minutes: 2 minutes to present and 1 minute for questions","5 minutes presentation with no questions","2 minutes total"],
   ans:0,
   expFr:"La règle VII.d accorde quatre minutes : trois minutes pour présenter et une minute pour répondre aux questions de clarification non substantielles.",
   expEn:"Rule VII.d grants four minutes: three minutes to present and one minute to answer non-substantive clarifying questions."},
  {id:73,cat:"res",ref:"VII.e",
   qFr:"Que peuvent faire les délégués après l'introduction d'un projet de résolution ?",
   qEn:"What may delegates do after a Draft Resolution is introduced?",
   oFr:["Proposer une motion pour ouvrir une liste générale des orateurs afin d'en débattre","Passer obligatoirement à l'ajournement","Déposer un amendement sans forme écrite","Exiger un vote immédiat sans débat"],
   oEn:["Introduce a motion to open a general speakers' list to debate on the resolution","Move immediately to adjournment","Submit an unformatted oral amendment","Demand an immediate vote without debate"],
   ans:0,
   expFr:"La règle VII.e prévoit qu'après l'introduction, les délégués peuvent proposer une motion pour ouvrir une liste générale des orateurs sur la résolution.",
   expEn:"Rule VII.e states that after introduction, delegates may move to open a general speakers' list to debate the resolution."},
  {id:74,cat:"res",ref:"VII.f",
   qFr:"Dans quel cas un projet de résolution ne peut-il pas être retiré par ses sponsors avant le vote ?",
   qEn:"When may a Draft Resolution NOT be withdrawn by its Sponsors prior to voting?",
   oFr:["Lorsqu'un amendement inimical (Unfriendly Amendment) est sur le bureau","Lorsqu'il a plus de trois sponsors","Lorsque le quorum est supérieur à la moitié","Lorsqu'il comporte une clause préambulatoire"],
   oEn:["If an Unfriendly Amendment to it is on the floor","If it has more than three sponsors","If quorum exceeds half","If it contains a preambular clause"],
   ans:0,
   expFr:"La règle VII.f précise qu'un projet de résolution ne peut être retiré si un amendement inimical le visant est en cours d'examen.",
   expEn:"Rule VII.f states a Draft Resolution may not be withdrawn if an Unfriendly Amendment to it is on the floor."},
  {id:75,cat:"res",ref:"VIII.a",
   qFr:"Combien un amendement doit-il réunir de sponsor et de signatories selon la règle VIII.a ?",
   qEn:"How many sponsors and signatories must an amendment have under Rule VIII.a?",
   oFr:["Un sponsor et deux signatories","Deux sponsors et quatre signatories","Un sponsor et zéro signatory","Cinq sponsors et deux signatories"],
   oEn:["One sponsor and two signatories","Two sponsors and four signatories","One sponsor and zero signatories","Five sponsors and two signatories"],
   ans:0,
   expFr:"La règle VIII.a exige un sponsor et deux signatories sur un formulaire officiel d'amendement.",
   expEn:"Rule VIII.a requires one sponsor and two signatories on an official amendment form."},
  {id:76,cat:"res",ref:"VIII.a",
   qFr:"Quelle précision importante ne faut-il pas oublier dans la rédaction d'un amendement ?",
   qEn:"What important detail must be included when drafting an amendment?",
   oFr:["Mentionner le numéro de ligne où l'amendement doit être effectué","Indiquer le nom du président","Rédiger le texte en deux colonnes","Ajouter un titre en majuscules"],
   oEn:["Mention the line number in which the amendment should be made","State the chair's name","Write in two columns","Add an all-caps title"],
   ans:0,
   expFr:"La règle VIII.a rappelle de ne pas oublier de mentionner le numéro de ligne auquel l'amendement doit s'appliquer.",
   expEn:"Rule VIII.a reminds delegates not to forget to mention the line number in which the amendment should be made."},
  {id:77,cat:"res",ref:"VIII.b",
   qFr:"Un amendement à un amendement (« amendement à l'amendement à l'amendement ») est-il recevable ?",
   qEn:"Is an amendment to an amendment to an amendment in order?",
   oFr:["Non, un amendement à l'amendement à l'amendement n'est pas recevable","Oui, s'il est amical","Oui, à la majorité des deux tiers","Oui, sur décision des signataires"],
   oEn:["No, an amendment to the amendment to the amendment is not in order","Yes, if friendly","Yes, by two-thirds majority","Yes, if signatories agree"],
   ans:0,
   expFr:"La règle VIII.b stipule qu'un amendement à l'amendement à l'amendement n'est pas recevable.",
   expEn:"Rule VIII.b states that an amendment to the amendment to the amendment will not be in order."},
  {id:78,cat:"res",ref:"VIII.b",
   qFr:"Lorsqu'un amendement est soumis sur une proposition, à quel moment est-il mis aux voix ?",
   qEn:"When an amendment is moved to a proposal, when is it voted on?",
   oFr:["L'amendement est mis aux voix en premier","Après le vote définitif sur le projet de résolution","Uniquement à la fin de la session","Après l'élection du Bureau"],
   oEn:["The amendment is voted on first","After the final vote on the draft resolution","Only at session end","After chair elections"],
   ans:0,
   expFr:"La règle VIII.b prévoit que l'amendement est mis aux voix en premier.",
   expEn:"Rule VIII.b states that when an amendment is moved to a proposal, the amendment shall be voted on first."},
  {id:79,cat:"res",ref:"VIII.c",
   qFr:"À quelles conditions un amendement est-il qualifié d'amical (Friendly Amendment) ?",
   qEn:"Under what conditions is an amendment considered 'friendly'?",
   oFr:["Tous les sponsors sont d'accord et l'amendement ne modifie pas fondamentalement l'intention globale du texte","Au moins un sponsor est contre mais la majorité est pour","Il ajoute cinq nouvelles clauses opératoires","Il supprime l'ensemble du préambule"],
   oEn:["All sponsors agree and it does not fundamentally change the intent of the Draft Resolution as a whole","At least one sponsor opposes but majority agrees","It adds five operative clauses","It deletes the entire preamble"],
   ans:0,
   expFr:"Selon la règle VIII.c, l'accord de tous les sponsors et le respect de l'intention globale du texte caractérisent un amendement amical.",
   expEn:"Under Rule VIII.c, all sponsors must agree and it must not fundamentally change the intent of the Draft Resolution as a whole."},
  {id:80,cat:"res",ref:"VIII.c",
   qFr:"Un vote est-il nécessaire pour intégrer un amendement amical à un projet de résolution ?",
   qEn:"Is a vote required to add a friendly amendment to a Draft Resolution?",
   oFr:["Non, aucun vote n'est requis pour ajouter un amendement amical","Oui, une majorité simple est requise","Oui, une majorité des deux tiers est requise","Oui, une majorité des trois quarts est requise"],
   oEn:["No, no vote is required to add a friendly amendment","Yes, a simple majority is required","Yes, a two-thirds majority is required","Yes, a three-quarters majority is required"],
   ans:0,
   expFr:"La règle VIII.c précise qu'aucun vote n'est requis pour ajouter un amendement amical à un projet de résolution.",
   expEn:"Rule VIII.c states no vote is required to add a friendly amendment to a Draft Resolution."},
  {id:81,cat:"res",ref:"VIII.d",
   qFr:"Comment se déroule le débat sur un amendement inimical (Unfriendly Amendment) ?",
   qEn:"How is an Unfriendly Amendment debated?",
   oFr:["Avec deux orateurs pour et deux orateurs contre, chacun limité à une minute maximum","Avec cinq orateurs pour et cinq contre de deux minutes chacun","Sans aucun débat préalable","Avec un seul orateur de 90 secondes"],
   oEn:["With two speakers in favor and two speakers against, each speech not exceeding one minute","With five speakers for and five against of two minutes each","With no prior debate","With one 90-second speaker"],
   ans:0,
   expFr:"La règle VIII.d prévoit deux intervenants pour et deux contre, chaque intervention ne pouvant excéder une minute.",
   expEn:"Rule VIII.d provides two speakers in favor and two against, each speech not exceeding one minute."},
  {id:82,cat:"res",ref:"VIII.d",
   qFr:"Quelle majorité est nécessaire pour qu'un amendement inimical soit intégré au projet de résolution ?",
   qEn:"What majority is required for an Unfriendly Amendment to be incorporated into the Draft Resolution?",
   oFr:["Une majorité des deux tiers","Une majorité simple","Une majorité des trois quarts","L'unanimité des sponsors"],
   oEn:["A two-thirds majority","A simple majority","A three-quarters majority","Unanimity of sponsors"],
   ans:0,
   expFr:"La règle VIII.d dispose qu'un amendement inimical requiert une majorité des deux tiers pour être incorporé.",
   expEn:"Rule VIII.d states unfriendly amendments require a two-thirds majority to be incorporated into the Draft Resolution."},
  {id:83,cat:"res",ref:"VIII.d",
   qFr:"Les amendements à des amendements inimicaux sont-ils recevables ?",
   qEn:"Are amendments to unfriendly amendments in order?",
   oFr:["Non, les amendements à des amendements inimicaux ne sont pas recevables","Oui, s'ils sont rédigés par un sponsor","Oui, sur vote majoritaire","Oui, pendant 30 secondes"],
   oEn:["No, amendments to unfriendly amendments are out of order","Yes, if drafted by a sponsor","Yes, by majority vote","Yes, for 30 seconds"],
   ans:0,
   expFr:"La règle VIII.d précise que les amendements à des amendements inimicaux sont irrecevables (out of order).",
   expEn:"Rule VIII.d states amendments to unfriendly amendments are out of order."},
  {id:84,cat:"res",ref:"VIII.e",
   qFr:"Quel est l'objet d'un amendement non substantiel (Non-substantive Amendment) ?",
   qEn:"What is the purpose of a Non-substantive Amendment?",
   oFr:["Corriger des erreurs d'orthographe ou de mise en forme","Modifier la portée politique d'une clause opératoire","Ajouter un nouveau paragraphe complet","Supprimer une clause existante"],
   oEn:["Correct errors in spelling or format","Change the policy scope of an operative clause","Add a new full paragraph","Delete an existing clause"],
   ans:0,
   expFr:"Selon la règle VIII.e, les amendements non substantiels corrigent des erreurs d'orthographe ou de format sans vote.",
   expEn:"Under Rule VIII.e, non-substantive amendments correct errors in spelling or format without a vote."},
  {id:85,cat:"res",ref:"VIII.e",
   qFr:"Un amendement non substantiel nécessite-t-il un vote pour être intégré au projet de résolution initial ?",
   qEn:"Does a non-substantive amendment require a vote to become part of the original Draft Resolution?",
   oFr:["Non, il est intégré sans vote","Oui, à la majorité simple","Oui, à la majorité des deux tiers","Oui, sur appel nominal"],
   oEn:["No, it is incorporated without a vote","Yes, by simple majority","Yes, by two-thirds majority","Yes, by roll call"],
   ans:0,
   expFr:"La règle VIII.e indique qu'un amendement non substantiel est intégré au projet de résolution initial sans vote.",
   expEn:"Rule VIII.e states non-substantive amendments are incorporated as part of the original Draft Resolution without a vote."},

  // --- Catégorie 5 : IX Procédure de vote & Appel nominal (15 questions) ---
  {id:86,cat:"vot",ref:"IX.a",
   qFr:"Une délégation peut-elle voter au nom d'un autre pays, et les observateurs ont-ils le droit de vote ?",
   qEn:"May a delegation cast a vote on behalf of another country, and do observers have voting rights?",
   oFr:["Non aux deux : pas de vote au nom d'un autre pays et pas de droit de vote pour les observateurs","Oui pour les alliés ; oui pour les observateurs","Non pour les observateurs ; oui si le Bureau l'autorise","Oui pour un autre pays avec une note signée"],
   oEn:["No to both: no voting for another country and observers have no voting rights","Yes for allies; yes for observers","No for observers; yes if chairs allow","Yes for another country with a signed note"],
   ans:0,
   expFr:"La règle IX.a dispose qu'aucune délégation ne peut voter au nom d'un autre pays et que les observateurs n'ont pas le droit de vote.",
   expEn:"Rule IX.a states no delegation may cast a vote on behalf of another country and observers shall not have voting rights."},
  {id:87,cat:"vot",ref:"IX.b",
   qFr:"Quelle majorité est requise pour qu'une résolution soit approuvée selon la règle IX.b ?",
   qEn:"What majority is required for a resolution to be approved under Rule IX.b?",
   oFr:["Une majorité simple","Une majorité des trois quarts","Une majorité des deux tiers","Trois cinquièmes"],
   oEn:["A simple majority","A three-quarters majority","A two-thirds majority","Three-fifths"],
   ans:0,
   expFr:"La règle IX.b prévoit qu'une résolution requiert une majorité simple pour être approuvée.",
   expEn:"Rule IX.b states a resolution requires a simple majority to be approved."},
  {id:88,cat:"vot",ref:"IX.c",
   qFr:"Entre quels moments s'étend la procédure de vote (« voting procedure ») ?",
   qEn:"Between which moments does voting procedure run?",
   oFr:["De la déclaration « we are in voting procedure » par le Bureau jusqu'à l'annonce des résultats","De l'ouverture de l'appel jusqu'à la pause","De l'introduction de la résolution jusqu'au caucus","Du début de la séance jusqu'à l'ajournement"],
   oEn:["From chairs declaring 'we are in voting procedure' until results are announced","From roll call to break","From introduction to caucus","From session opening to adjournment"],
   ans:0,
   expFr:"Selon la règle IX.c, le vote commence lorsque le Bureau déclare « we are in voting procedure » et se termine à l'annonce des résultats.",
   expEn:"Under Rule IX.c, voting begins upon chairs declaring 'we are in voting procedure' and ends when results are announced."},
  {id:89,cat:"vot",ref:"IX.c",
   qFr:"Pendant la procédure de vote (chambres closes), quels points et motions sont recevables ?",
   qEn:"During voting procedure (chambers sealed), which points and motions are in order?",
   oFr:["Point of Personal Privilege, Point of Order, Point of Parliamentary Inquiry et Motion to vote clause by clause","Toutes les motions de caucus et le Right of Reply","Uniquement le Right of Reply et la suspension de séance","Aucune motion ni aucun point n'est recevable"],
   oEn:["Point of Personal Privilege, Point of Order, Point of Parliamentary Inquiry, and Motion to vote clause by clause","All caucus motions and Right of Reply","Only Right of Reply and suspension","No motions or points are in order"],
   ans:0,
   expFr:"La règle IX.c énumère précisément ces quatre points/motions recevables pendant la procédure de vote.",
   expEn:"Rule IX.c lists these exact four points/motions in order during voting procedure."},
  {id:90,cat:"vot",ref:"IX.c",
   qFr:"Avant la procédure de vote, comment se déroule un vote clause par clause (clause-by-clause) ?",
   qEn:"Before voting procedure, how does a clause-by-clause vote proceed?",
   oFr:["Chaque clause opératoire est votée séparément à la majorité simple, puis un vote porte sur l'ensemble de la résolution","Seules les clauses préambulaires sont votées séparément","Chaque clause exige une majorité des trois quarts","Les amendements sont annulés automatiquement"],

/* ===== ÉTAT DU JEU ROP ===== */
let gameState=ls.get("somun_rop_game",{
  cat:"all",
  idx:0,
  score:0,
  streak:0,
  best:0,
  answers:{} // qId -> chosenOptionIndex
});
function saveGame(){
  try{localStorage.setItem("somun_rop_game",JSON.stringify(gameState))}catch(e){}
}
function filteredQuestions(){
  if(!gameState.cat||gameState.cat==="all")return ROP_QUIZ;
  return ROP_QUIZ.filter(q=>q.cat===gameState.cat);
}
function setGameCat(cat){
  gameState.cat=cat;
  gameState.idx=0;
  saveGame();
  render(false,true);
}
function pickGameAnswer(qId,optIdx){
  const qItem=ROP_QUIZ.find(x=>x.id===qId);
  if(!qItem)return;
  if(Object.prototype.hasOwnProperty.call(gameState.answers,qId))return;
  gameState.answers[qId]=optIdx;
  if(optIdx===qItem.ans){
    gameState.score+=1;
    gameState.streak+=1;
    if(gameState.streak>gameState.best)gameState.best=gameState.streak;
    toast(t("q_correct"));
  }else{
    gameState.streak=0;
    toast(t("q_wrong"));
  }
  saveGame();
  render(true);
}
function stepGame(delta){
  const pool=filteredQuestions();
  if(!pool.length)return;
  gameState.idx=Math.max(0,Math.min(pool.length-1,gameState.idx+delta));
  saveGame();
  render(false,true);
}
function shuffleGameQuestions(){
  const pool=filteredQuestions();
  if(!pool.length)return;
  gameState.idx=Math.floor(Math.random()*pool.length);
  saveGame();
  render(false,true);
  toast(lang==="fr"?"Question aléatoire chargée":"Random question loaded");
}
function resetGameProgress(){
  gameState={cat:gameState.cat||"all",idx:0,score:0,streak:0,best:gameState.best||0,answers:{}};
  saveGame();
  render(false,true);
  toast(t("t_ok"));
}

function vGame(){
  const cats=[
    ["all",t("q_cat_all")],
    ["gen",t("q_cat_gen")],
    ["par",t("q_cat_par")],
    ["deb",t("q_cat_deb")],
    ["res",t("q_cat_res")],
    ["vot",t("q_cat_vot")]
  ];
  const pool=filteredQuestions();
  if(!pool.length)return `<h1>${t("game_t")}</h1><div class="card empty">${t("no_res")}</div>`;
  const idx=Math.max(0,Math.min(pool.length-1,gameState.idx||0));
  const item=pool[idx];
  const chosen=Object.prototype.hasOwnProperty.call(gameState.answers,item.id)?gameState.answers[item.id]:null;
  const answeredCount=Object.keys(gameState.answers).length;
  const pct=Math.round((answeredCount/ROP_QUIZ.length)*100);
  const qText=lang==="fr"?item.qFr:item.qEn;
  const opts=lang==="fr"?item.oFr:item.oEn;
  const expText=lang==="fr"?item.expFr:item.expEn;
  const letters=["A","B","C","D"];

  return `<h1>${t("game_t")}</h1>
  <p class="mute">${t("game_s")}</p>
  <div class="chips" style="margin-top:8px">
    ${cats.map(([k,l])=>`<button class="chip ${gameState.cat===k?"on":""}" onclick="setGameCat('${k}')">${esc(l)}</button>`).join("")}
  </div>
  <div class="quiz-hud">
    <div class="quiz-stat"><span>${t("q_score")}</span><b>${gameState.score}</b></div>
    <div class="quiz-stat"><span>${t("q_streak")}</span><b>${gameState.streak}</b></div>
    <div class="quiz-stat"><span>${t("q_best")}</span><b>${gameState.best}</b></div>
    <div class="quiz-stat"><span>${t("q_answered")}</span><b>${answeredCount} / ${ROP_QUIZ.length}</b></div>
  </div>
  <div class="quiz-progress" aria-hidden="true"><span style="width:${pct}%"></span></div>
  <div class="quiz-card">
    <div class="quiz-meta">
      <div><span class="tag">ROP ${esc(item.ref)}</span><span class="tag free">#${item.id} / 100</span></div>
      <span class="mute" style="font-size:12.5px;font-weight:600">${idx+1} / ${pool.length}</span>
    </div>
    <div class="quiz-q">${esc(qText)}</div>
    <div class="quiz-opts">
      ${opts.map((txt,i)=>{
        let cls="quiz-opt";
        if(chosen!==null){
          if(i===item.ans)cls+=" ok";
          else if(i===chosen)cls+=" ko";
          else cls+=" dim";
        }
        return `<button class="${cls}" ${chosen!==null?"disabled":""} onclick="pickGameAnswer(${item.id},${i})">
          <span class="let">${letters[i]}</span>
          <span>${esc(txt)}</span>
        </button>`;
      }).join("")}
    </div>
    ${chosen!==null?`<div class="quiz-fb ${chosen===item.ans?"ok":"ko"}">
      <b>${chosen===item.ans?t("q_correct"):t("q_wrong")}</b> ${esc(expText)}
    </div>`:""}
    <div class="quiz-nav">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" ${idx<=0?"disabled":""} onclick="stepGame(-1)">${t("q_prev")}</button>
        <button class="btn sm" ${idx>=pool.length-1?"disabled":""} onclick="stepGame(1)">${t("q_next")}</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="shuffleGameQuestions()">🎲 ${t("q_shuffle")}</button>
        <button class="btn danger sm" onclick="resetGameProgress()">↺ ${t("q_reset")}</button>
      </div>
    </div>
  </div>`;
}

/* ===== NAVIGATION & ANIMATION COULISSANTE BIDIRECTIONNELLE ===== */
const ROUTES=["accueil","activites","ressources","adherer","pole","bureau","jeu","partenaires","admin","account","login","actus","reset"];
const ROUTE_RANK={
  accueil:0,
  actus:0.5,
  activites:1,
  event:1.5,
  ressources:2,
  adherer:3,
  pole:4,
  bureau:5,
  jeu:5.5,
  partenaires:6,
  admin:7,
  account:8,
  login:8,
  reset:8
};
function rankOf(r){return ROUTE_RANK[r]??8}
function hashFor(){
  if(route==="event"&&evSel!=null)return "#event-"+sid(evSel);
  if(route==="pole"&&poleSel!=null)return "#pole-"+sid(poleSel);
  return route==="accueil"?"":"#"+route;
}
function syncHash(replace){
  const h=hashFor();
  if((location.hash||"")===h)return;
  const url=location.pathname+location.search+h;
  try{replace?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}
}
function readHash(){
  const oldRank=rankOf(route);
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.includes("="))return false;
  let m;
  if((m=h.match(/^event-([\w-]+)$/))){route="event";evSel=m[1];poleSel=null}
  else if((m=h.match(/^pole-([\w-]+)$/))){route="pole";poleSel=m[1]}
  else{route=ROUTES.includes(h)?h:"accueil";poleSel=null;evSel=null}
  const newRank=rankOf(route);
  navDir=newRank<oldRank?"left":"right";
  return true;
}
function go(r,replace){
  const oldRank=rankOf(route);
  const newRank=rankOf(r);
  navDir=newRank<oldRank?"left":"right";
  closeSheet();route=r;if(r!=="pole")poleSel=null;if(r!=="event")evSel=null;
  syncHash(replace);render();
  if(r==="pole"&&poleSel)loadTasks().then(()=>render(true));
  if(r==="event")loadRegistrants();
}
function openEvent(id){evSel=String(id);go("event")}
window.addEventListener("popstate",()=>{
  if(!readHash())return;
  closeSheet();render();
  if(route==="pole"&&poleSel){D.tasks=[];loadTasks().then(()=>render(true))}
  if(route==="event")loadRegistrants();
});
window.addEventListener("scroll",()=>{
  const h=$("#hdr");
  if(h)h.classList.toggle("scrolled",window.scrollY>12);
},{passive:true});
function moveNavThumb(instant){
  const nav=$("#dnav"),thumb=$("#nav-thumb"),active=nav&&nav.querySelector("button.on");
  if(!nav||!thumb)return;
  if(!active||nav.offsetParent===null){thumb.style.opacity="0";return}
  const x=active.offsetLeft,w=active.offsetWidth;
  if(instant){
    thumb.style.transition="none";
    thumb.style.transform=`translate3d(${x}px,0,0)`;
    thumb.style.width=`${w}px`;
    thumb.style.opacity="1";
    thumb.getBoundingClientRect();
    thumb.style.transition="";
  }else{
    thumb.style.opacity="1";
    thumb.style.transform=`translate3d(${x}px,0,0)`;
    thumb.style.width=`${w}px`;
  }
}
window.addEventListener("resize",()=>moveNavThumb(true),{passive:true});

  if(!keep)window.scrollTo(0,0);
  observe(keep);

function observe(keep){
  if(keep||!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("show"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}

function firstKey(name){
  return String(name||"").trim().split(/\s+/)[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function sortedBoard(){
  return [...D.board].sort((a,b)=>{
    const ia=BOARD_ORDER.indexOf(firstKey(a.name));
    const ib=BOARD_ORDER.indexOf(firstKey(b.name));
    const ra=ia===-1?999:ia;
    const rb=ib===-1?999:ib;
    if(ra!==rb)return ra-rb;
    return (a.sort||0)-(b.sort||0);
  });
}
function boardMemberPhoto(m){
  const key=firstKey(m.name);
  const custom=safeAsset(m.photo_url||m.avatar_url||m.image_url);
  if(custom){
    const preset=BOARD_PHOTOS[key];
    if(key==="come"&&(!preset||custom!==preset))return preset||"photo_come_bureau.jpeg";
    return custom;
  }
  return BOARD_PHOTOS[key]||null;
}
function boardBioPhoto(m){
  const key=firstKey(m.name);
  const dedicated=safeAsset(m.bio_photo_url||m.detail_photo_url||m.portrait_url);
  if(dedicated)return dedicated;
  const presetBio=safeAsset(BOARD_BIO_PHOTOS[key]);
  if(presetBio)return presetBio;
  if(key==="come")return "photo_bio_come.jpeg";
  return boardMemberPhoto(m);
}
function photoFallbackAttr(src,init,cls,extraCls=""){
  const safe=safeAsset(src)||"";
  if(safe.toLowerCase().endsWith(".jpeg")){
    const jpg=safe.slice(0,-5)+".jpg";
    return `onerror="if(!this.dataset.fb1){this.dataset.fb1=1;this.src='${esc(jpg)}'}else if(!this.dataset.fb2){this.dataset.fb2=1;this.src='IMG_2778.jpeg'}else{this.outerHTML='<div class=\\'${cls} ${extraCls}\\'>${esc(init)}</div>'"`;
  }
  return `onerror="this.outerHTML='<div class=\\'${cls} ${extraCls}\\'>${esc(init)}</div>'"`;
}
function avatarMarkup(src,init,cls,extraCls=""){
  const safe=safeAsset(src);
  return safe
    ?`<img class="${cls} ${extraCls}" src="${esc(safe)}" alt="${esc(init)}" loading="lazy" ${photoFallbackAttr(safe,init,cls,extraCls)}>`
    :`<div class="${cls} ${extraCls}">${esc(init)}</div>`;

function previewBioPhoto(val,init){
  const box=$("#sheet .bio-preview");
  if(!box)return;
  const safe=safeAsset(val);
  if(safe){
    box.outerHTML=`<img class="bio-preview" src="${esc(safe)}" alt="${esc(init)}" ${photoFallbackAttr(safe,init,"bio-preview")}>`;
  }else{
    box.outerHTML=`<div class="bio-preview">${esc(init)}</div>`;
  }
}
function handleBioPhotoFile(input,init){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=720,ratio=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*ratio));
      c.height=Math.max(1,Math.round(img.height*ratio));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL("image/jpeg",0.85);
      const inp=$("#bioPhotoInput");
      if(inp)inp.value=dataUrl;
      previewBioPhoto(dataUrl,init);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
async function saveBoardBio(ev,id){
  ev.preventDefault();
  if(!isStaff())return toast(t("admin_only"));
  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const rawPhoto=String(f.get("bio_photo_url")||"").trim();
    const bioPhoto=rawPhoto?safeAsset(rawPhoto):null;
    if(rawPhoto&&!bioPhoto)return toast(t("e_url"));
    const rawIg=String(f.get("instagram_url")||"").trim();
    const rawLi=String(f.get("linkedin_url")||"").trim();
    const ig=rawIg?normalizeUrl(rawIg,"instagram"):null;
    const li=rawLi?normalizeUrl(rawLi,"linkedin"):null;
    if((rawIg&&!ig)||(rawLi&&!li))return toast(t("e_url"));
    const bio=String(f.get("bio")||"").trim()||null;
    const payload={bio,bio_photo_url:bioPhoto,instagram_url:ig,linkedin_url:li};
    let res=await sb.from("board_members").update(payload).eq("id",id);
    if(res.error&&/column/i.test(res.error.message||"")){
      const fallback={bio};
      if("bio_photo_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.bio_photo_url=bioPhoto;
      if("instagram_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.instagram_url=ig;
      if("linkedin_url" in (D.board.find(x=>String(x.id)===String(id))||{}))fallback.linkedin_url=li;
      res=await sb.from("board_members").update(fallback).eq("id",id);
    }
    if(res.error)return toast(errMsg(res.error));
    await loadPublic();render(true);openBoardBio(id);toast(t("t_ok"));
  });
}

function exportCSV(id){
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  const cell=v=>{let x=String(v??"");if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const lines=[[t("col_ln"),t("col_fn"),t("col_mail"),t("col_member"),t("col_status")].map(cell).join(";")]
    .concat(registrantRows().map(r=>[r.nom,r.prenom,r.email,r.paid?t("yes"):t("no"),stLabel(r.status)].map(cell).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const slug=String(e.title||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`inscrits-${isoDay(e.date)}-${slug}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function dropTask(ev,st){
  ev.preventDefault();ev.currentTarget.classList.remove("over");
  const x=D.tasks.find(t=>String(t.id)===String(dragId));dragId=null;
  if(!x||x.status===st)return;
  const old=x.status;x.status=st;render(true);
  const {error}=await sb.from("tasks").update({status:st}).eq("id",x.id);
  if(error){x.status=old;render(true);toast(errMsg(error))}
}
async function moveTask(id,d,btn){
  const o=["todo","doing","done"],x=D.tasks.find(t=>String(t.id)===String(id));if(!x)return;
  const ns=o[o.indexOf(x.status)+d];if(!ns)return;
  await withBusy(btn,async()=>{
    const old=x.status;x.status=ns;
    const {error}=await sb.from("tasks").update({status:ns}).eq("id",x.id);
    if(error){x.status=old;render(true);return toast(errMsg(error))}
    render(true);
  });
}

function parseCsvLine(line,delim){
  const out=[];let cur="",inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++}else inQ=!inQ}
    else if(ch===delim&&!inQ){out.push(cur);cur=""}
    else cur+=ch;
  }
  out.push(cur);return out;
}
async function importHelloAssoCSV(input){
  const file=input.files&&input.files[0];input.value="";
  if(!file)return;
  const text=await file.text();
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return toast(t("e_generic"));
  const delim=lines[0].includes(";")&&!lines[0].includes(",")?";":",";
  const headers=parseCsvLine(lines[0],delim).map(h=>h.toLowerCase().trim());
  const mailIdx=headers.findIndex(h=>/mail|email|courriel/.test(h));
  const statusIdx=headers.findIndex(h=>/statut|status|etat|état/.test(h));
  const col=mailIdx>=0?mailIdx:0;
  const emails=new Set();
  for(let i=1;i<lines.length;i++){
    const cells=parseCsvLine(lines[i],delim);
    if(statusIdx>=0&&/annul|rembours|refund|cancel|échec|echec|refus/i.test(cells[statusIdx]||""))continue;
    const em=String(cells[col]||"").trim().toLowerCase();
    if(em.includes("@"))emails.add(em);
  }
  if(!emails.size)return toast(t("no_res"));
  const until=academicYearEnd(),season=currentSeason();
  let matched=0,prequeued=0;
  for(const em of emails){
    const m=D.members.find(x=>(x.email&&x.email.toLowerCase()===em)||(x.helloasso_email&&x.helloasso_email.toLowerCase()===em));
    if(m){
      const {error}=await sb.from("profiles").update({paid:true,paid_until:until}).eq("id",m.id);
      if(!error){
        matched++;
        await sb.from("membership_history").insert({user_id:m.id,season,source:"HelloAsso CSV"});
      }
    }else{
      const {error}=await sb.from("preapproved_members").upsert({email:em,season,paid_until:until},{onConflict:"email"});
      if(!error)prequeued++;
    }
  }
  await Promise.all([loadAdmin(),loadPrivate()]);render(true);
  toast(t("csv_done",{m:matched,q:prequeued}));
}

/* ===== DÉMARRAGE ===== */
function cleanAuthUrl(){
  const u=new URL(location.href);let changed=false;
  ["code","token_hash","type","error","error_code","error_description"].forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true}});
  if(changed)history.replaceState(null,"",u.pathname+u.search+u.hash);
  if(/access_token=|refresh_token=|type=recovery/.test(location.hash))history.replaceState(null,"",u.pathname+u.search);
}
async function start(){
  readHash();syncHash(true);
  if(!configured){D.loading=false;render();return}
  render();
  const u=new URL(location.href),code=u.searchParams.get("code"),th=u.searchParams.get("token_hash"),tp=u.searchParams.get("type");
  let pendingToast="";
  if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)toast(authErr(error));else if(tp==="recovery")route="reset";else pendingToast=t("t_mail_confirmed")}
  else if(th&&tp){const {error}=await sb.auth.verifyOtp({token_hash:th,type:tp});if(error)toast(authErr(error));else if(tp==="recovery")route="reset";else pendingToast=t("t_mail_confirmed")}
  cleanAuthUrl();
  const {data:{session}}=await sb.auth.getSession();
  S.user=session&&session.user||null;
  await Promise.all([loadPublic(),loadPrivate()]);
  D.loading=false;
  if(route==="pole"&&poleSel)await loadTasks();
  if(route==="event")await loadRegistrants();
  render();
  if(pendingToast)toast(pendingToast);
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==="PASSWORD_RECOVERY"){route="reset";syncHash();render();return}
    const nextUser=sess&&sess.user||null,prevId=S.user&&S.user.id,nextId=nextUser&&nextUser.id;
    S.user=nextUser;
    if(nextId!==prevId){
      loadPrivate().then(()=>{if(route==="event")loadRegistrants();render(true)});
    }else if(ev==="TOKEN_REFRESHED"&&!S.profile&&nextUser){
      loadPrivate().then(()=>render(true));
    }
  });
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&S.user&&Date.now()-lastSync>30000)refreshAll();
  });
}
start();
