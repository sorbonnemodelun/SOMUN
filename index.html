<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020259">
<meta name="color-scheme" content="light">
<title>SOMUN — Sorbonne Model UN</title>
<meta name="description" content="Sorbonne Model UN (SOMUN) : trainings, conférences, voyages et visites. Toute la vie de l'association au même endroit.">
<meta property="og:type" content="website">
<meta property="og:title" content="SOMUN — Sorbonne Model UN">
<meta property="og:description" content="Débattre, négocier, changer le monde. Trainings, conférences, voyages et visites.">
<meta property="og:image" content="logo-somun.png">
<link rel="icon" href="logo-somun.png">
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=league-spartan:600,700,800|poppins:400,500,600,700|simonetta:900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.bunny.net/css?family=league-spartan:600,700,800|poppins:400,500,600,700|simonetta:900&display=swap"></noscript>
<style>
:root{
  --bleu:#00008E;--or:#EBC000;--marine:#020259;--rouge:#C12A3A;
  --bleu-soft:#ececf9;--or-soft:#fdf5d3;--rouge-soft:#fbe8ea;
  --bg:#ffffff;--soft:#f5f5fb;--ink:#14143c;--mute:#5c5e80;--line:#e3e4f0;
  --r:14px;
  --f-titre:"League Spartan",system-ui,sans-serif;
  --f-texte:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-marque:"Simonetta",Georgia,serif;
  --navy:var(--bleu);--gold:var(--or);--navy-soft:var(--bleu-soft);--gold-soft:var(--or-soft);--ok:var(--bleu)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:light}
body{margin:0;font-family:var(--f-texte);background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:84px;font-size:15px;display:flex;flex-direction:column;min-height:100vh}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
::selection{background:var(--or);color:var(--marine)}

/* ---------- En-tête ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;color:var(--bleu)}
.brand img,.mark{width:auto;height:48px;object-fit:contain;display:block;border-radius:8px}
.mark{display:grid;place-items:center;width:48px;background:var(--bleu-soft);color:var(--bleu);font-size:13px;font-weight:800}
.wordmark{font-family:var(--f-marque);font-weight:900;font-size:23px;letter-spacing:2.5px;line-height:1;padding-top:3px}
.right{display:flex;gap:8px;align-items:center}
.lang{border:1.5px solid var(--line);background:#fff;color:var(--bleu);border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.5px}
.lang:hover{border-color:var(--bleu)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--bleu);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--or);cursor:pointer;font-family:var(--f-titre);font-size:16px;padding-top:2px}
.dnav{display:none;gap:2px}
.dnav button{border:0;background:none;padding:10px 10px;font-size:13.5px;color:var(--mute);font-weight:500;cursor:pointer;position:relative;white-space:nowrap}
.dnav button:hover{color:var(--bleu)}
.dnav button.on{color:var(--bleu);font-weight:600}
.dnav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:3px;background:var(--or)}

/* ---------- Barre d'onglets (mobile) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--marine);display:flex;padding:6px 6px max(8px,env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(2,2,89,.18)}
.tabbar button{flex:1;border:0;background:none;color:rgba(255,255,255,.62);font-size:11px;font-weight:500;padding:6px 0;cursor:pointer;position:relative}
.tabbar button .ico{display:block;font-size:20px;line-height:1.3;filter:grayscale(.3)}
.tabbar button.on{color:var(--or);font-weight:600}
.tabbar button.on .ico{filter:none}
.tabbar button.on::after{content:"";position:absolute;top:-6px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--or)}
@media(min-width:860px){.dnav{display:flex}.tabbar{display:none}body{padding-bottom:0}}

/* ---------- Mise en page ---------- */
main{max-width:1080px;width:100%;margin:0 auto;padding:20px 16px 36px;flex:1}
.view{animation:in .35s ease both}.view.noanim{animation:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--f-titre);font-weight:800;font-size:32px;line-height:1.1;margin:6px 0 6px;color:var(--bleu);letter-spacing:-.3px}
h2{font-family:var(--f-titre);font-weight:700;font-size:22px;color:var(--marine);margin:36px 0 14px;display:flex;justify-content:flex-start;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:22px;background:var(--or);border-radius:3px;margin-right:2px;flex:none;margin-top:-3px}
h2 button{margin-left:auto;border:0;background:none;font-family:var(--f-texte);font-size:14px;color:var(--bleu);font-weight:600;cursor:pointer}
h2 button:hover{text-decoration:underline;text-decoration-color:var(--or);text-decoration-thickness:2px;text-underline-offset:4px}
h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--marine)}
.mute{color:var(--mute);font-size:14px}
a{color:var(--bleu)}

/* ---------- Bandeau d'accueil & Logo mis en évidence ---------- */
.hero{position:relative;display:grid;background:var(--marine);color:#fff;border-radius:22px;overflow:hidden;isolation:isolate}
.hero-visual{position:relative;min-height:240px;display:grid;place-items:center;padding:28px 20px;background:radial-gradient(circle at 60% 40%,#07079c 0%,var(--marine) 75%);background-size:cover;background-position:center 30%;clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
.hero-visual.has-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(2,2,89,.72),rgba(0,0,142,.45));z-index:0}
.hero-crest{position:relative;z-index:1;background:#ffffff;border:3px solid var(--or);border-radius:22px;padding:16px 24px;box-shadow:0 14px 36px rgba(0,0,0,.32);display:grid;place-items:center;max-width:230px}
.hero-crest img{width:165px;max-width:100%;height:auto;display:block}
.hero-txt{padding:12px 22px 28px;position:relative}
.hero .kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--or);font-weight:600;margin:0 0 8px}
.hero h1{font-size:38px;line-height:1.02;margin:0;color:#fff;text-transform:uppercase;letter-spacing:.2px}
.hero h1::after{content:"";display:block;width:56px;height:4px;background:var(--or);border-radius:3px;margin-top:14px}
.hero p{color:rgba(255,255,255,.84);max-width:460px;margin:14px 0 0}
.hero .btn{background:var(--or);border-color:var(--or);color:var(--marine)}
.hero .btn:hover{background:#ffd31a}
.hero .btn.ghost{background:transparent;border-color:rgba(255,255,255,.7);color:#fff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.stats{display:flex;gap:26px;margin-top:24px;border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.stat b{display:block;font-family:var(--f-titre);font-size:28px;line-height:1;color:var(--or);padding-top:4px}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
@media(min-width:760px){
  .hero{grid-template-columns:1.1fr .95fr;min-height:400px}
  .hero-visual{grid-column:2;grid-row:1;margin-left:-60px;padding-left:70px;clip-path:polygon(20% 0,100% 0,100% 100%,0 100%)}
  .hero-crest img{width:195px}
  .hero-txt{grid-column:1;grid-row:1;padding:44px 10px 38px 44px;align-self:center}
  .hero h1{font-size:52px}
}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--bleu);background:var(--bleu);color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s;text-decoration:none;line-height:1.3}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--marine);border-color:var(--marine);box-shadow:0 4px 14px rgba(0,0,142,.2)}
.btn.ghost{background:#fff;color:var(--bleu)}
.btn.ghost:hover{background:var(--bleu-soft);border-color:var(--bleu);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.gold{background:var(--or);border-color:var(--or);color:var(--marine)}
.btn.gold:hover{background:#ffd31a;border-color:#ffd31a}
.btn.danger{background:#fff;color:var(--rouge);border-color:#efc3c8}
.btn.danger:hover{background:var(--rouge-soft);border-color:var(--rouge);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- Étiquettes ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bleu-soft);color:var(--bleu);margin-right:4px;text-transform:uppercase;letter-spacing:.6px}
.tag.paid{background:var(--or-soft);color:#6b5600}
.tag.free{background:var(--bleu);color:#fff}
.tag.red{background:var(--rouge-soft);color:var(--rouge)}
.tag.gray{background:var(--soft);color:var(--mute)}

/* ---------- Cartes ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .2s,border-color .2s}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.reveal{opacity:0;transform:translateY(12px);transition:.45s}.reveal.show{opacity:1;transform:none}
.ev{display:flex;gap:14px}
.ev:hover{border-color:#c9cbe6;box-shadow:0 6px 20px rgba(2,2,89,.07)}
.ev.past{opacity:.7}
.date{min-width:58px;border-radius:12px;background:var(--bleu);color:#fff;text-align:center;padding:10px 4px 8px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.date::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--or)}
.ev.past .date{background:var(--mute)}
.date b{font-family:var(--f-titre);font-size:26px;line-height:1;font-weight:800}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
.ev .body{flex:1;min-width:0}
.ev h3{font-size:16.5px;line-height:1.3}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.left{font-size:12px;color:var(--mute)}
.bar-p{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}.bar-p span{display:block;height:100%;background:var(--or);border-radius:99px}
.news{border-left:4px solid var(--or)}
.news h3{font-family:var(--f-titre);font-weight:700;font-size:19px;padding-top:2px}

/* ---------- Formulaires ---------- */
.search,input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink)}
input[type=checkbox]{width:auto;accent-color:var(--bleu)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--bleu-soft);border-color:var(--bleu)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--marine)}
label.inline{display:flex;gap:8px;align-items:center;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:7px 15px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:14px}
.chip:hover{border-color:var(--bleu)}
.chip.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.chip.sm{padding:4px 11px;font-size:12px}

/* ---------- Adhésion ---------- */
.plan{text-align:center;border:1px solid var(--line);border-top:6px solid var(--or);border-radius:22px;padding:30px 22px;background:#fff;max-width:520px;margin:18px auto 0;box-shadow:0 10px 30px rgba(2,2,89,.07)}
.plan .price{font-family:var(--f-titre);font-size:60px;font-weight:800;color:var(--bleu);line-height:1.1;padding-top:6px}
.plan ul{list-style:none;padding:0;margin:14px auto;display:inline-block;text-align:left}
.plan li{padding:3px 0}
.plan li:before{content:"✓ ";color:var(--or);font-weight:800}

/* ---------- Pôles et tâches ---------- */
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:140px;border:1px solid var(--line)}
.col.over{background:var(--or-soft);border-color:var(--or)}
.col h4{margin:2px 6px 10px;font-family:var(--f-titre);font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--bleu);display:flex;justify-content:space-between}
.task{background:#fff;border:1px solid var(--line);border-left:3px solid var(--bleu);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px;cursor:grab;word-break:break-word}
.task.drag{opacity:.4}
.task .tb{display:flex;gap:2px;margin-top:6px;justify-content:flex-end}
.task .tb button{border:0;background:var(--soft);color:var(--mute);cursor:pointer;font-size:14px;border-radius:8px;padding:2px 9px}
.task .tb button:hover{background:var(--bleu-soft);color:var(--bleu)}
.pole-pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.pole-pick button{text-align:left;border:1px solid var(--line);border-top:4px solid var(--bleu);background:#fff;color:var(--marine);padding:16px;border-radius:14px;cursor:pointer;font-size:16px;font-weight:600}
.pole-pick button:hover{border-top-color:var(--or);box-shadow:0 6px 20px rgba(2,2,89,.08)}
.pole-pick small{display:block;color:var(--mute);font-weight:400;margin-top:2px;font-size:13px}

/* ---------- Partenaires, menu Plus, membres ---------- */
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.partners .card{min-height:90px;display:grid;place-items:center;font-weight:600;color:var(--bleu);background:var(--soft);text-align:center;text-decoration:none}
.partners a.card:hover{border-color:var(--or)}
.more-list{display:grid;gap:8px;margin-top:12px}
.more-list button{text-align:left;border:1px solid var(--line);background:#fff;padding:14px;border-radius:14px;font-size:15px;font-weight:500;color:var(--marine);cursor:pointer}
.more-list button:hover{border-color:var(--bleu)}
.member{margin-bottom:10px}
.member .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.member select{width:auto;padding:6px 10px;font-size:13px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.info{background:var(--bleu-soft);color:var(--bleu);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;border-left:4px solid var(--bleu)}
.sg-box{background:var(--or-soft);border:1px solid var(--or);border-radius:12px;padding:14px;margin-top:14px}

/* ---------- Fenêtres, notifications ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(2,2,89,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:24px 20px 30px;animation:up .25s ease;max-height:88vh;overflow-y:auto;border-top:6px solid var(--or)}
.sheet h3{font-family:var(--f-titre);font-weight:700;font-size:22px;color:var(--bleu);padding-top:2px}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--marine);color:#fff;padding:12px 18px;border-radius:12px;border-left:4px solid var(--or);opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90%;text-align:center;font-size:14px;box-shadow:0 10px 30px rgba(2,2,89,.3)}
@media(min-width:860px){.toast{bottom:28px}}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:30px;color:var(--mute)}

/* ---------- Pied de page ---------- */
footer{background:var(--marine);color:rgba(255,255,255,.75);text-align:center;font-size:12px;padding:30px 16px 26px;border-top:5px solid var(--or)}
footer .f-brand{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px;background:#ffffff;padding:12px 22px;border-radius:18px;border:2px solid var(--or);box-shadow:0 8px 24px rgba(0,0,0,.22)}
footer .f-brand img{height:76px;width:auto;display:block}
footer a{color:var(--or);text-decoration:none;font-weight:600;margin:0 8px;font-size:13px}
footer a:hover{text-decoration:underline}

/* ---------- Fiche événement, présentation, tableaux ---------- */
.linkish{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.linkish:hover{color:var(--bleu);text-decoration:underline;text-decoration-color:var(--or);text-decoration-thickness:2px;text-underline-offset:3px}
.ev-img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r);margin:14px 0 4px;border:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:14px;margin-top:10px}
.desc{white-space:pre-line;margin:14px 0 0}
.about{margin-top:6px}
.about>p{max-width:720px}
.about .grid{margin-top:16px}
.about .card{border-top:4px solid var(--or)}
.about .card b{display:block;font-family:var(--f-titre);font-size:18px;color:var(--bleu);margin-bottom:4px;padding-top:2px}
.social{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--bleu);font-weight:700}
.tbl tbody tr:hover{background:var(--soft)}
.tbl-wrap{overflow-x:auto}
.danger-zone{border-color:#efc3c8;background:#fffafa}
.danger-zone h3{color:var(--rouge)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
</style>
</head>
<body>
<header><div class="bar">
  <button class="brand" onclick="go('accueil')" aria-label="Accueil"><span id="logo"></span><span class="wordmark">SOMUN</span></button>
  <nav class="dnav" id="dnav"></nav>
  <div class="right"><button class="lang" id="langbtn" onclick="toggleLang()"></button><span id="auth"></span></div>
</div></header>
<main id="app"></main>
<footer id="foot"></footer>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet-bg" id="sheetbg" role="dialog" aria-modal="true" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const SUPABASE_URL="https://pztwaqlprzzoomnnziaq.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HbWvEKW4oc8J27C8aI9Izw_15T2fFoy";
const HELLOASSO_ORG="VOTRE-ASSO";                    // à remplacer par le slug HelloAsso de l'association
const HELLOASSO_MEMBERSHIP_SLUG="adhesion";          // identifiant du formulaire d'adhésion
const DEFAULT_COTISATION=15;
const LOGO_SRC="logo-somun.png";
const DEFAULT_HERO="";
const DEFAULT_CONTACT="";
const DEFAULT_INSTAGRAM="";
const DEFAULT_LINKEDIN="";
const MIN_PWD=12;

const keysConfigured=!SUPABASE_URL.includes("VOTRE-")&&!SUPABASE_ANON_KEY.includes("VOTRE-");
const sdkLoaded=typeof supabase!=="undefined";
const configured=keysConfigured&&sdkLoaded;
const helloassoReady=Boolean(HELLOASSO_ORG)&&!HELLOASSO_ORG.includes("VOTRE-");
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

/* ===== TEXTES FR / EN ===== */
const I18N={

/* ===== TRADUCTION AUTOMATIQUE ===== */
let trCache=ls.get("somun_tr",{});
const pending=new Set();let flushing=false,nativeT=null,trFailures=0;
function isBadTranslation(res,orig){
  if(!res||typeof res!=="string")return true;
  const u=res.toUpperCase();
  if(u.includes("MYMEMORY WARNING")||u.includes("PLEASE SELECT TWO DISTINCT")||u.includes("QUERY LENGTH LIMIT"))return true;
  return res.trim()===orig.trim();
}
function chunkText(txt,max=450){
  if(txt.length<=max)return [txt];
  const parts=[];
  for(const para of txt.split(/(\n+)/)){
    if(!para)continue;
    if(para.length<=max){parts.push(para);continue}
    let cur="";
    for(const word of para.split(/(\s+)/)){
      if((cur+word).length>max&&cur){parts.push(cur);cur=word}
      else cur+=word;
    }
    if(cur)parts.push(cur);
  }
  return parts;
}
function T(txt){
  if(lang==="fr"||!txt)return txt;
  const cached=trCache[txt];
  if(cached&&!isBadTranslation(cached,txt))return cached;
  if(cached)delete trCache[txt];
  if(trFailures<2&&!pending.has(txt)){pending.add(txt);if(!flushing)flush()}
  return txt;
}
async function translateChunk(txt){
  try{
    if("Translator" in self){
      if(!nativeT)nativeT=Translator.create({sourceLanguage:"fr",targetLanguage:"en"});
      return await (await nativeT).translate(txt);
    }
  }catch(e){nativeT=null}
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair=fr|en",{signal:ctrl.signal});
    const j=await r.json();
    return j&&j.responseData&&j.responseData.translatedText;
  }finally{clearTimeout(timer)}
}
async function translateOne(txt){
  const parts=chunkText(txt,450);
  if(parts.length===1)return translateChunk(txt);
  const out=[];
  for(const p of parts){
    if(!p.trim()){out.push(p);continue}
    const r=await translateChunk(p);
    if(isBadTranslation(r,p))return r;
    out.push(r);
  }
  return out.join("");
}
async function flush(){
  flushing=true;let changed=false;
  while(pending.size&&trFailures<2){
    const batch=[...pending].slice(0,3);
    batch.forEach(x=>pending.delete(x));
    await Promise.all(batch.map(async txt=>{
      try{
        const r=await translateOne(txt);
        if(!isBadTranslation(r,txt)){trCache[txt]=r;changed=true;trFailures=0}
        else if(r&&r.toUpperCase().includes("MYMEMORY WARNING")){trFailures=2}
      }catch(e){trFailures++}
    }));
  }
  if(trFailures>=2)pending.clear();
  flushing=false;
  if(changed){ls.set("somun_tr",trCache);softRender()}
}
function softRender(){
  const a=document.activeElement;
  if((a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"))||$("#sheetbg").classList.contains("open")){
    setTimeout(softRender,1200);return;
  }
  render(true);
}

const academicYearEnd=()=>{const d=new Date();const y=d.getMonth()>=7?d.getFullYear()+1:d.getFullYear();return `${y}-08-31`};
const hhmm=h=>h?String(h).slice(0,5):"";
const isoDay=d=>String(d??"").slice(0,10);
const dd=d=>new Date(isoDay(d)+"T12:00:00");
const loc=()=>lang==="fr"?"fr-FR":"en-GB";
const mon=d=>isNaN(dd(d))?"":dd(d).toLocaleDateString(loc(),{month:"short"});

function errMsg(e){
  const m=(e&&e.message)||"";
  if(m.includes("members_only"))return t("t_err_members");
  if(m.includes("paid_contact_bureau"))return t("paid_cancel");
  if(m.includes("event_past"))return t("e_cancel_past");
  if(m.includes("full"))return t("t_err_full");
  return authErr(e);
}
function authErr(e){
  const m=((e&&e.message)||"").toLowerCase(),c=String((e&&e.code)||"");
  if(c==="invalid_credentials"||m.includes("invalid login credentials"))return t("e_creds");
  if(c==="email_not_confirmed"||m.includes("email not confirmed"))return t("e_unconfirmed");
  if(c==="user_already_exists"||c==="email_exists"||m.includes("already registered"))return t("e_exists");
  if(c==="same_password"||m.includes("should be different"))return t("e_same");
  if(c==="weak_password"||m.includes("password should")||m.includes("weak"))return t("e_weak");
  if(c==="email_address_invalid"||m.includes("invalid format")||m.includes("email address"))return t("e_email");
  if(c.startsWith("over_")||m.includes("rate limit")||m.includes("security purposes"))return t("e_rate");
  if(c==="session_expired"||c==="session_not_found"||m.includes("jwt expired")||m.includes("session missing"))return t("e_session");
  if(m.includes("failed to fetch")||m.includes("networkerror")||m.includes("load failed"))return t("e_net");
  console.error(e);
  return isStaff()&&e&&e.message?e.message:t("e_generic");
}

async function loadTaken(){
  const r=await sb.from("event_stats").select("*");
  if(!r.error)D.taken=Object.fromEntries((r.data||[]).map(x=>[x.event_id,Number(x.taken)||0]));
}
async function loadPublic(){
  const [ev,ne,po,bo,pa,st,re,se]=await Promise.all([
    sb.from("events").select("*").order("date"),
    sb.from("news").select("*").order("created_at",{ascending:false}),
    sb.from("poles").select("*").order("sort"),
    sb.from("board_members").select("*").order("sort"),
    sb.from("partners").select("*").order("sort"),
    sb.from("event_stats").select("*"),
    sb.from("resources").select("*").order("sort"),
    sb.from("site_settings").select("*")
  ]);
  const bad=[ev,ne,po,bo,pa].find(r=>r.error);
  D.err=bad?bad.error.message+(bad.error.hint?" — "+bad.error.hint:""):"";
  if(bad)console.error(bad.error);
  D.events=ev.data||[];D.news=ne.data||[];D.poles=po.data||[];D.board=bo.data||[];D.partners=pa.data||[];
  if(!st.error)D.taken=Object.fromEntries((st.data||[]).map(x=>[x.event_id,Number(x.taken)||0]));
  if(!re.error)D.resources=re.data||[];else if(!isMissingTableErr(re.error))console.error(re.error);
  if(!se.error&&se.data)D.settings=Object.fromEntries(se.data.map(x=>[x.key,x.value]));
  else if(se.error&&!isMissingTableErr(se.error))console.error(se.error);
  lastSync=Date.now();
}
async function loadPrivate(){
  if(!S.user){S.profile=null;D.myPoles=[];D.myPoleRoles={};D.myRegs={};D.myHistory=[];D.members=[];D.memberPoles=[];return}
  const [pr,mp,rg,hi]=await Promise.all([
    sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle(),
    sb.from("pole_members").select("*").eq("user_id",S.user.id),
    sb.from("registrations").select("event_id,status").eq("user_id",S.user.id),
    sb.from("membership_history").select("*").eq("user_id",S.user.id).order("created_at",{ascending:false})
  ]);
  S.profile=pr.data||null;
  D.myPoles=(mp.data||[]).map(x=>x.pole_id);
  D.myPoleRoles=Object.fromEntries((mp.data||[]).map(x=>[x.pole_id,x.role||"member"]));
  D.myRegs=Object.fromEntries((rg.data||[]).map(x=>[x.event_id,x.status]));
  D.myHistory=!hi.error?(hi.data||[]):[];

/* ===== NAVIGATION ===== */
const ROUTES=["accueil","activites","ressources","adherer","pole","bureau","partenaires","admin","account","login","actus","reset"];
function hashFor(){
  if(route==="event"&&evSel!=null)return "#event-"+sid(evSel);
  if(route==="pole"&&poleSel!=null)return "#pole-"+sid(poleSel);
  return route==="accueil"?"":"#"+route;
}
function syncHash(replace){
  const h=hashFor();
  if((location.hash||"")===h)return;
  const url=location.pathname+location.search+h;
  try{replace?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}
}
function readHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.includes("="))return false;
  let m;
  if((m=h.match(/^event-([\w-]+)$/))){route="event";evSel=m[1];poleSel=null;return true}
  if((m=h.match(/^pole-([\w-]+)$/))){route="pole";poleSel=m[1];return true}
  route=ROUTES.includes(h)?h:"accueil";poleSel=null;evSel=null;return true;
}
function go(r,replace){
  closeSheet();route=r;if(r!=="pole")poleSel=null;if(r!=="event")evSel=null;
  syncHash(replace);render();
  if(r==="pole"&&poleSel)loadTasks().then(()=>render(true));
  if(r==="event")loadRegistrants();
}
function openEvent(id){evSel=String(id);go("event")}
window.addEventListener("popstate",()=>{
  if(!readHash())return;
  closeSheet();render();
  if(route==="pole"&&poleSel){D.tasks=[];loadTasks().then(()=>render(true))}
  if(route==="event")loadRegistrants();
});

  $("#auth").innerHTML=S.user?`<button class="avatar" onclick="go('account')" aria-label="${esc(t("account"))}">${esc(initial).toUpperCase()}</button>`:`<button class="btn sm" onclick="go('login')">${t("login")}</button>`;

  $("#app").innerHTML=`<div class="view ${keep?"noanim":""}">${configured?errBox()+(V[route]||vAccueil)():vSetup()}</div>`;
  if(!keep)window.scrollTo(0,0);
  observe(keep);
}
function observe(keep){
  if(keep||!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("show"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.1});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}

function evCard(e){
  const cap=Math.max(0,Number(e.places)||0),taken=D.taken[e.id]||0,left=Math.max(0,cap-taken);
  const pct=cap>0?Math.min(100,Math.round(taken/cap*100)):100;
  const st=D.myRegs[e.id],j=daysTo(e.date),past=j<0,id=idArg(e.id),formHref=safeUrl(e.form_url);
  const when=past?t("past"):j===0?t("today"):t("in_days",{n:j});
  let action;
  if(st==="confirmed")action=`<span class="tag free">${t("done_reg")}</span>`;
  else if(st==="pending"&&!past)action=`<span><span class="tag paid">${t("pending")}</span><button class="btn sm" onclick="payEvent(${id})">${t("pay_now")}</button></span>`;
  else if(past)action=`<span class="tag gray">${t("ended")}</span>`;
  else if(formHref)action=`<button class="btn sm" onclick="openFormEvent(${id})">${t("open_form")}</button>`;
  else if(left<=0)action="";
  else action=`<button class="btn sm" onclick="openReg(${id})">${t("reg")}${e.prix?" · "+e.prix+" €":""}</button>`;
  return `<div class="card ev ${past?"past":""} reveal">
   <div class="date"><b>${dd(e.date).getDate()||"—"}</b><span>${mon(e.date)}</span></div>
   <div class="body">
    <div><span class="tag">${esc(I18N[lang][e.type]||e.type)}</span><span class="tag ${e.prix?"paid":"free"}">${e.prix?e.prix+" €":t("free")}</span>${e.members_only?`<span class="tag red">${t("members_only")}</span>`:""}${formHref?`<span class="tag">${t("form_badge")}</span>`:""}</div>
    <h3 style="margin-top:6px"><button class="linkish" onclick="openEvent(${id})">${esc(T(e.title))}</button></h3>
    <div class="mute">📍 ${esc(T(e.lieu))} · ${when}${hhmm(e.heure)?" · "+hhmm(e.heure):""}</div>
    <div class="bar-p"><span style="width:${pct}%"></span></div>
    <div class="foot"><span class="left">${past?`${taken}/${cap}`:left>0?left+" "+t("places"):t("full")}</span>${action}</div>
   </div></div>`;
}

function listHTML(){
  const needle=q.trim().toLowerCase(),today=todayStr();
  const sorted=[...D.events].sort((a,b)=>{
    const pa=isoDay(a.date)<today,pb=isoDay(b.date)<today;
    if(pa!==pb)return pa?1:-1;
    return pa?isoDay(b.date).localeCompare(isoDay(a.date)):isoDay(a.date).localeCompare(isoDay(b.date));
  });
  const l=sorted.filter(e=>{
    const okType=filt==="all"||(filt==="mine"?Boolean(D.myRegs[e.id]):e.type===filt);
    if(!okType)return false;
    if(!needle)return true;
    return `${T(e.title)} ${e.title} ${T(e.lieu)} ${e.lieu}`.toLowerCase().includes(needle);
  });
  return l.length?l.map(e=>evCard(e).replace("reveal","reveal show")).join(""):`<div class="empty">${t("no_res")}</div>`;
}

function editResource(id){

async function loadRegistrants(){
  if(!configured||(!isStaff()&&!isTrainingLead())||route!=="event"||evSel==null)return;
  const e=D.events.find(x=>String(x.id)===String(evSel));
  const targetId=e?e.id:evSel;
  const [r]=await Promise.all([
    sb.from("registrations").select("user_id,status").eq("event_id",targetId),
    D.members.length?Promise.resolve():loadAdmin()
  ]);
  if(r.error){console.error(r.error);return}
  regList={event:String(targetId),rows:r.data||[]};
  if(route==="event"&&String(evSel)===String(targetId))softRender();
}
function registrantRows(){
  const byId=Object.fromEntries(D.members.map(m=>[m.id,m]));
  return (regList.rows||[]).map(r=>{const m=byId[r.user_id]||{};return {prenom:m.prenom||"",nom:m.nom||"",email:m.email||"",paid:Boolean(m.paid),status:r.status}})
    .sort((a,b)=>(a.nom+" "+a.prenom).localeCompare(b.nom+" "+b.prenom,"fr"));
}
const stLabel=s=>s==="confirmed"?t("st_confirmed"):t("st_pending");
function registrantsBlock(e){
  if(regList.event!==String(e.id))return `<h2>${t("registrants")}</h2>${loadingBox()}`;
  const rows=registrantRows();
  return `<h2>${t("registrants")} (${rows.length}) ${rows.length?`<button onclick="exportCSV(${idArg(e.id)})">⬇ ${t("export_csv")}</button>`:""}</h2>
  ${rows.length?`<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>${t("col_ln")}</th><th>${t("col_fn")}</th><th>${t("col_mail")}</th><th>${t("col_member")}</th><th>${t("col_status")}</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.nom)}</td><td>${esc(r.prenom)}</td><td>${esc(r.email)}</td><td>${r.paid?t("yes"):t("no")}</td><td><span class="tag ${r.status==="confirmed"?"free":"paid"}">${stLabel(r.status)}</span></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="card empty">${t("no_registrants")}</div>`}`;
}
function exportCSV(id){
  const e=D.events.find(x=>String(x.id)===String(id));if(!e)return;
  const cell=v=>{let x=String(v??"");if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const lines=[[t("col_ln"),t("col_fn"),t("col_mail"),t("col_member"),t("col_status")].map(cell).join(";")]
    .concat(registrantRows().map(r=>[r.nom,r.prenom,r.email,r.paid?t("yes"):t("no"),stLabel(r.status)].map(cell).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const slug=String(e.title||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`inscrits-${isoDay(e.date)}-${slug}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    const f=Object.fromEntries(new FormData(ev.target));f.email=f.email.trim().toLowerCase();
    const back=location.origin+location.pathname;

      const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{prenom:f.prenom.trim(),nom:f.nom.trim()},emailRedirectTo:back}});
      if(error)return toast(errMsg(error));

    }else{

      authInfo="";toast(t("t_welcome"));go("accueil");

  });

/* --- Import CSV & Sync API HelloAsso (Option A) --- */
async function importHelloAssoCSV(input){
  const file=input.files&&input.files[0];input.value="";if(!file)return;
  const text=await file.text();
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return toast(t("no_res"));
  const sep=lines[0].split(";").length>lines[0].split(",").length?";":",";
  const parseLine=line=>line.split(sep).map(c=>c.replace(/^"|"$/g,"").trim());
  const headers=parseLine(lines[0]).map(h=>h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""));
  const emailIdx=headers.findIndex(h=>h.includes("email")||h.includes("e-mail")||h.includes("courriel"));
  if(emailIdx<0)return toast(t("e_email"));
  const emails=[...new Set(lines.slice(1).map(l=>parseLine(l)[emailIdx]?.toLowerCase()).filter(e=>e&&e.includes("@")))];
  const until=academicYearEnd(),season=currentSeason();
  let matched=0,queued=0;
  for(const em of emails){
    const m=D.members.find(x=>String(x.email||"").toLowerCase()===em||String(x.helloasso_email||"").toLowerCase()===em);
    if(m){
      if(!m.paid){
        const {error}=await sb.from("profiles").update({paid:true,paid_until:until}).eq("id",m.id);
        if(!error){
          matched++;
          await sb.from("membership_history").insert({user_id:m.id,season,source:"HelloAsso CSV"}).catch(()=>{});
        }
      }
    }else{
      const {error}=await sb.from("helloasso_paid_emails").upsert({email:em,paid_until:until,source:"HelloAsso CSV"});
      if(!error)queued++;
    }
  }
  await loadAdmin();render(true);
  toast(t("csv_done",{m:matched,q:queued}));
}
async function syncHelloAssoAPI(btn){
  await withBusy(btn,async()=>{
    const {data,error}=await sb.functions.invoke("helloasso-sync");
    if(error)return toast(t("ha_sync_info"));
    await Promise.all([loadPrivate(),loadAdmin()]);render(true);
    toast(t("csv_done",{m:(data&&data.matched)||0,q:(data&&data.queued)||0}));
  });
}

async function saveEvent(ev,id){

  const btn=ev.target.querySelector("button[type=submit]");
  await withBusy(btn,async()=>{
    const f=new FormData(ev.target);
    const prix=Math.max(0,Number(f.get("prix"))||0);

    if(formUrl&&!safeUrl(formUrl))return toast(t("e_url"));
    const row={type:f.get("type"),title:f.get("title").trim(),date:f.get("date"),heure:f.get("heure")||null,lieu:f.get("lieu").trim(),
      prix,places,description:(f.get("description")||"").trim()||null,image_url:img||null,form_url:formUrl||null,
      helloasso_slug:slug,members_only:f.get("members_only")==="on"};
    const {error}=id==null?await sb.from("events").insert(row):await sb.from("events").update(row).eq("id",id);

/* ===== DÉMARRAGE ===== */
const withTimeout=(p,ms,label)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+" : pas de réponse après "+ms/1000+" s")),ms))]);
function checkRedirectNotice(){
  const raw=[location.hash.slice(1),location.search.slice(1)].filter(Boolean).join("&");
  if(!raw)return;
  const params=new URLSearchParams(raw);
  const errDesc=params.get("error_description");
  const rType=params.get("type");
  if(errDesc){
    authInfo=errDesc.replace(/\+/g," ");
    route="login";
    history.replaceState(null,"",location.pathname);
  }else if(rType==="signup"||rType==="email"){
    setTimeout(()=>toast(t("t_mail_confirmed")),400);
  }
}
if(configured){
  sb.auth.onAuthStateChange((evt,session)=>{
    if(evt==="INITIAL_SESSION")return;
    S.user=session?session.user:null;
    if(evt==="PASSWORD_RECOVERY"){route="reset";syncHash(true)}
    setTimeout(async()=>{try{await loadPrivate()}catch(e){console.error(e)}softRender()},0);
  });
}
async function init(){
  readHash();
  checkRedirectNotice();
  render();
  if(!configured)return;
  const pubTask=withTimeout(loadPublic(),10000,"Base de données")
    .catch(e=>{console.error(e);D.err=(e&&e.message)||String(e)})
    .finally(()=>{D.loading=false;softRender()});
  const authTask=(async()=>{
    try{
      const {data}=await withTimeout(sb.auth.getSession(),5000,"Session");
      S.user=data&&data.session?data.session.user:null;
      if(S.user){
        await withTimeout(loadPrivate(),8000,"Profil");
        softRender();
        if(route==="event")loadRegistrants();
        if(route==="pole"&&poleSel)loadTasks().then(()=>softRender());
      }
    }catch(e){console.error(e)}
  })();
  await Promise.all([pubTask,authTask]);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&S.user&&Date.now()-lastSync>60000)refreshAll().catch(console.error);
  });
}
init();
</script>
