<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020259">
<meta name="color-scheme" content="light">
<title>SOMUN — Sorbonne Model UN</title>
<meta name="description" content="Sorbonne Model UN (SOMUN) : trainings, conférences, voyages et visites. Toute la vie de l'association au même endroit.">
<meta property="og:type" content="website">
<meta property="og:title" content="SOMUN — Sorbonne Model UN">
<meta property="og:description" content="Débattre, négocier, changer le monde. Trainings, conférences, voyages et visites.">
<meta property="og:image" content="logo-somun.png">
<link rel="icon" href="logo-somun.png">
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=league-spartan:600,700,800|poppins:400,500,600,700|simonetta:900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.bunny.net/css?family=league-spartan:600,700,800|poppins:400,500,600,700|simonetta:900&display=swap"></noscript>
<style>
:root{
  --bleu:#00008E;--or:#EBC000;--marine:#020259;--rouge:#C12A3A;
  --bleu-soft:#ececf9;--or-soft:#fdf5d3;--rouge-soft:#fbe8ea;
  --vert-soft:#e7f7ed;--vert:#147a3e;
  --bg:#fafafe;--soft:#f2f3fa;--ink:#121238;--mute:#585b7d;--line:#e2e4f2;
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ios-ease:cubic-bezier(.32,.72,0,1);
  --shadow-sm:0 2px 10px rgba(2,2,89,.04);
  --shadow-md:0 10px 28px rgba(2,2,89,.08);
  --shadow-lg:0 20px 44px rgba(2,2,89,.14);
  --f-titre:"League Spartan",system-ui,sans-serif;
  --f-texte:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-marque:"Simonetta",Georgia,serif;
  --navy:var(--bleu);--gold:var(--or);--navy-soft:var(--bleu-soft);--gold-soft:var(--or-soft);--ok:var(--bleu)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:light}
body{margin:0;font-family:var(--f-texte);background:var(--bg);color:var(--ink);line-height:1.62;padding-bottom:92px;font-size:15px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--or);outline-offset:2px}
::selection{background:var(--or);color:var(--marine)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- En-tête ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.68);backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);border-bottom:1px solid rgba(226,228,242,.65);transition:background .25s var(--ease),box-shadow .25s var(--ease)}
header.scrolled{background:rgba(255,255,255,.78);box-shadow:0 4px 20px rgba(2,2,89,.06)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:12px;transition:padding .25s var(--ease)}
header.scrolled .bar{padding:6px 18px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:10px;color:var(--bleu);transition:transform .2s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand:active{transform:scale(.97)}
.brand img,.mark{width:auto;height:46px;object-fit:contain;display:block;border-radius:8px;transition:height .25s var(--ease)}
header.scrolled .brand img,header.scrolled .mark{height:40px}
.mark{display:grid;place-items:center;width:46px;background:var(--bleu-soft);color:var(--bleu);font-size:13px;font-weight:800}
.right{display:flex;gap:8px;align-items:center}
.lang{border:1.5px solid rgba(226,228,242,.95);background:rgba(255,255,255,.82);color:var(--bleu);border-radius:99px;padding:6px 13px;min-height:36px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.6px;transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.lang:hover{border-color:var(--bleu);background:rgba(236,236,249,.92)}
.lang:active{transform:scale(.96)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--bleu),var(--marine));color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--or);cursor:pointer;font-family:var(--f-titre);font-size:16px;padding-top:2px;box-shadow:0 3px 10px rgba(0,0,142,.18);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.avatar:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 6px 16px rgba(0,0,142,.26)}

/* Navigation bureau avec pilule coulissante */
.dnav{position:relative;display:none;gap:3px;background:rgba(242,243,250,.76);padding:4px;border-radius:99px;border:1px solid rgba(226,228,242,.85);isolation:isolate}
.nav-thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:var(--bleu);box-shadow:0 3px 12px rgba(0,0,142,.24);transform:translateX(4px);transition:transform .36s var(--ios-ease),width .36s var(--ios-ease),opacity .22s var(--ease);z-index:0;pointer-events:none;opacity:0;will-change:transform,width}
.dnav button{position:relative;z-index:1;border:0;background:none;padding:7px 12px;font-size:12.5px;color:var(--marine);font-weight:500;cursor:pointer;white-space:nowrap;border-radius:99px;transition:color .24s var(--ease),transform .15s var(--ease)}
.dnav button:hover{color:var(--bleu)}
.dnav button:active{transform:scale(.96)}
.dnav button.on{color:#fff;background:transparent;font-weight:600;box-shadow:none}

/* Barre d'onglets mobile */
.tabbar{position:fixed;left:12px;right:12px;bottom:10px;z-index:100;background:rgba(2,2,89,.92);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.12);border-radius:22px;display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom)*.35);box-shadow:0 12px 32px rgba(2,2,89,.28)}
.tabbar button{flex:1;border:0;background:none;color:rgba(255,255,255,.68);font-size:10.5px;font-weight:500;padding:6px 2px;min-height:46px;border-radius:16px;cursor:pointer;position:relative;transition:color .22s var(--ease),background .24s var(--ios-ease),transform .15s var(--ease)}
.tabbar button:active{transform:scale(.94)}
.tabbar button .ico{display:block;font-size:19px;line-height:1.25;filter:grayscale(.25);transition:transform .28s var(--ios-ease),filter .2s var(--ease)}
.tabbar button.on{color:var(--or);font-weight:600;background:rgba(235,192,0,.14)}
.tabbar button.on .ico{filter:none;transform:translateY(-2px) scale(1.08)}
@media(min-width:860px){.dnav{display:flex}.tabbar{display:none}body{padding-bottom:0}}

main{max-width:1120px;width:100%;margin:0 auto;padding:24px 18px 48px;flex:1;position:relative}
.view{will-change:transform,opacity}
.view.anim-right{animation:goRight .34s var(--ios-ease) forwards}
.view.anim-left{animation:goLeft .34s var(--ios-ease) forwards}
@keyframes goRight{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:translateX(0)}}
@keyframes goLeft{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:translateX(0)}}
h1{font-family:var(--f-titre);font-weight:800;font-size:clamp(30px,4.5vw,42px);line-height:1.06;margin:6px 0 8px;color:var(--bleu);letter-spacing:-.4px}
h2{font-family:var(--f-titre);font-weight:700;font-size:clamp(20px,2.6vw,24px);color:var(--marine);margin:40px 0 16px;display:flex;justify-content:flex-start;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:22px;background:linear-gradient(180deg,var(--or),#d4ab00);border-radius:4px;margin-right:2px;flex:none;margin-top:-2px}
h2 button{margin-left:auto;border:0;background:var(--soft);font-family:var(--f-texte);font-size:13px;color:var(--bleu);font-weight:600;cursor:pointer;padding:6px 13px;border-radius:99px;transition:background .2s var(--ease),transform .15s var(--ease)}
h2 button:hover{background:var(--or-soft);color:var(--marine);transform:translateX(2px)}
h3{margin:0 0 4px;font-size:16.5px;font-weight:600;color:var(--marine)}
.mute{color:var(--mute);font-size:14px}
a{color:var(--bleu);transition:color .2s var(--ease)}

/* ---------- Bandeau d'accueil ---------- */
.hero{position:relative;display:grid;background:linear-gradient(125deg,var(--marine) 0%,var(--bleu) 62%,#1212b5 100%);color:#fff;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 85%,rgba(235,192,0,.14),transparent 45%);pointer-events:none;z-index:0}
.hero-visual{position:relative;min-height:230px;display:grid;place-items:center;padding:30px 22px;background:radial-gradient(circle at 60% 35%,rgba(235,192,0,.22) 0%,rgba(2,2,89,.45) 75%);background-size:cover;background-position:center 30%;clip-path:polygon(0 0,100% 0,100% 85%,0 100%);z-index:1}
.hero-visual.has-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(2,2,89,.72),rgba(0,0,142,.45));z-index:0}
.hero-crest{position:relative;z-index:1;background:#ffffff;border:3px solid var(--or);border-radius:24px;padding:18px 26px;box-shadow:0 18px 40px rgba(0,0,0,.28);display:grid;place-items:center;max-width:236px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.hero:hover .hero-crest{transform:translateY(-4px) scale(1.02);box-shadow:0 24px 48px rgba(0,0,0,.35)}
.hero-crest img{width:168px;max-width:100%;height:auto;display:block}
.hero-txt{padding:16px 24px 30px;position:relative;z-index:1}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--or);font-weight:700;margin:0 0 10px;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:99px;border:1px solid rgba(235,192,0,.28)}
.hero h1{font-size:clamp(34px,5.5vw,54px);line-height:1.03;margin:0;color:#fff;text-transform:uppercase;letter-spacing:-.2px}
.hero h1::after{content:"";display:block;width:64px;height:4px;background:linear-gradient(90deg,var(--or),#ffe055);border-radius:4px;margin-top:16px}
.hero p{color:rgba(255,255,255,.86);max-width:470px;margin:14px 0 0;font-size:15px}
.hero .btn{background:var(--or);border-color:var(--or);color:var(--marine);box-shadow:0 6px 20px rgba(235,192,0,.28)}
.hero .btn:hover{background:#ffd51e;border-color:#ffd51e;transform:translateY(-2px);box-shadow:0 10px 26px rgba(235,192,0,.38)}
.hero .btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.55);color:#fff;box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.15);border-color:#fff}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;max-width:440px}
.stat b{display:block;font-family:var(--f-titre);font-size:30px;line-height:1;color:var(--or);padding-top:4px;letter-spacing:-.5px}
.stat span{font-size:12px;color:rgba(255,255,255,.74)}
@media(min-width:760px){
  .hero{grid-template-columns:1.12fr .95fr;min-height:410px}
  .hero-visual{grid-column:2;grid-row:1;margin-left:-56px;padding-left:68px;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
  .hero-crest img{width:198px}
  .hero-txt{grid-column:1;grid-row:1;padding:44px 16px 40px 46px;align-self:center}
}

/* ---------- Boutons & Étiquettes & Cartes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--bleu);background:var(--bleu);color:#fff;padding:10px 22px;min-height:42px;border-radius:99px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .18s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);text-decoration:none;line-height:1.25}
.btn:active{transform:scale(.96)}
.btn:hover{background:var(--marine);border-color:var(--marine);transform:translateY(-1.5px);box-shadow:0 6px 18px rgba(0,0,142,.22)}
.btn.ghost{background:#fff;color:var(--bleu);border-color:var(--line)}
.btn.ghost:hover{background:var(--bleu-soft);border-color:var(--bleu);box-shadow:none}
.btn.sm{padding:6px 15px;min-height:36px;font-size:13px}
.btn.gold{background:var(--or);border-color:var(--or);color:var(--marine)}
.btn.gold:hover{background:#ffd51e;border-color:#ffd51e;box-shadow:0 6px 18px rgba(235,192,0,.32)}
.btn.danger{background:#fff;color:var(--rouge);border-color:#efc3c8}
.btn.danger:hover{background:var(--rouge-soft);border-color:var(--rouge);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bleu-soft);color:var(--bleu);margin-right:5px;text-transform:uppercase;letter-spacing:.7px}
.tag.paid{background:var(--or-soft);color:#6b5600}
.tag.free{background:var(--bleu);color:#fff}
.tag.red{background:var(--rouge-soft);color:var(--rouge)}
.tag.gray{background:var(--soft);color:var(--mute)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .48s var(--ease),transform .48s var(--ease)}.reveal.show{opacity:1;transform:none}
.ev{display:flex;gap:15px}
.ev:hover{border-color:#c6c9e8;box-shadow:var(--shadow-md);transform:translateY(-3px)}
.ev.past{opacity:.72}
.ev.past:hover{transform:none;box-shadow:var(--shadow-sm)}
.date{min-width:60px;border-radius:14px;background:linear-gradient(160deg,var(--bleu),var(--marine));color:#fff;text-align:center;padding:10px 6px 9px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,142,.16)}
.date::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--or)}
.ev.past .date{background:var(--mute);box-shadow:none}
.date b{font-family:var(--f-titre);font-size:27px;line-height:1;font-weight:800}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;opacity:.88;margin-top:2px}
.ev .body{flex:1;min-width:0}
.ev h3{font-size:17px;line-height:1.3}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.left{font-size:12px;color:var(--mute);font-weight:500}
.bar-p{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:11px;border:1px solid rgba(226,228,242,.6)}
.bar-p span{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--or));border-radius:99px;transition:width .6s var(--ease)}
.news{border-left:4px solid var(--or)}
.news:hover{border-color:#c6c9e8;border-left-color:var(--or);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.news h3{font-family:var(--f-titre);font-weight:700;font-size:19.5px;padding-top:2px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}

/* ---------- Bureau ---------- */
body:has(.bureau-wrap){position:relative}
body:has(.bureau-wrap)::before{content:"";position:fixed;inset:0;background:url('photo_bureau.jpeg') center 18%/cover no-repeat;opacity:.26;z-index:-1;pointer-events:none}
body:has(.bureau-wrap) header{background:rgba(255,255,255,.56);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom-color:rgba(226,228,242,.7)}
.bureau-wrap{padding:6px 0}
.board-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.board-card{flex:1 1 280px;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:4px solid var(--or);border-radius:20px;cursor:pointer}
.board-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);background:rgba(255,255,255,.98);border-color:#c6c9e8;border-top-color:var(--or)}
.board-photo{width:106px;height:106px;border-radius:50%;object-fit:cover;object-position:center 18%;border:3px solid var(--or);background:var(--bleu-soft);color:var(--bleu);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:34px;margin-bottom:12px;box-shadow:0 8px 20px rgba(2,2,89,.15);transition:transform .3s var(--ease)}
.board-card:hover .board-photo{transform:scale(1.05)}
.board-hint{margin-top:10px;font-size:12px;font-weight:600;color:var(--bleu)}

.bio-sheet{max-width:580px;padding:0;overflow:hidden}
.bio-modal{position:relative;text-align:center}
.bio-hero-wrap{position:relative;width:100%;height:540px;overflow:hidden;background:linear-gradient(160deg,var(--marine),var(--bleu))}
.bio-hero-photo{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;color:#fff;font-family:var(--f-titre);font-weight:800;font-size:64px;line-height:540px;text-align:center}
.bio-hero-photo.focus-come{object-position:28% 22%;transform:scale(1.06);transform-origin:28% 22%}
.bio-hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,2,89,0) 58%,rgba(2,2,89,.25) 82%,rgba(255,255,255,.92) 96%,#ffffff 100%);pointer-events:none}
.bio-body{position:relative;padding:0 22px 24px;margin-top:-18px}
.bio-text{position:relative;text-align:left;background:rgba(242,243,250,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-left:4px solid var(--bleu);border-radius:16px;padding:15px 16px;margin:14px 0;white-space:pre-line;font-size:14.5px;line-height:1.65;color:var(--ink)}
.bio-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bio-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bio-socials{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto;text-align:right}
.bio-socials-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mute)}
.bio-socials-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bio-socials-links a{font-size:13px;font-weight:600;text-decoration:none}
.bio-socials-links a:hover{text-decoration:underline}
.bio-preview{width:156px;height:156px;border-radius:24px;object-fit:cover;object-position:28% 22%;border:3px solid var(--or);background:var(--bleu-soft);color:var(--bleu);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:40px;margin:10px auto 4px;box-shadow:0 10px 24px rgba(2,2,89,.14)}

/* ---------- Jeu ROP Quiz ---------- */
.quiz-hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 12px}
.quiz-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.quiz-stat b{display:block;font-family:var(--f-titre);font-size:24px;line-height:1.05;color:var(--bleu);padding-top:2px}
.quiz-stat span{font-size:11.5px;color:var(--mute);font-weight:500}
.quiz-progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
.quiz-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--or));border-radius:99px;transition:width .35s var(--ease)}
.quiz-card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--bleu);border-radius:22px;padding:22px;box-shadow:var(--shadow-md)}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.quiz-q{font-family:var(--f-titre);font-size:clamp(20px,2.8vw,25px);font-weight:700;color:var(--marine);line-height:1.25;margin:6px 0 18px;padding-top:2px}
.quiz-opts{display:grid;gap:10px}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:13px 15px;cursor:pointer;font-size:14.5px;line-height:1.45;color:var(--ink);transition:transform .16s var(--ease),border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}

})();

let trCache=ls.get("somun_tr",{});
const pending=new Set();let flushing=false,nativeT=null,trFailures=0;
function protectProperNames(str){
  return String(str).replace(/\bC[ôo]me\b/gi,"Côme");
}
function isBadTranslation(res,orig){
  if(!res||typeof res!=="string")return true;
  const u=res.toUpperCase();
  if(u.includes("MYMEMORY WARNING")||u.includes("PLEASE SELECT TWO DISTINCT")||u.includes("QUERY LENGTH LIMIT"))return true;
  return protectProperNames(res).trim()===protectProperNames(orig).trim();
}
function chunkText(txt,max=450){
  if(txt.length<=max)return [txt];
  const parts=[];
  for(const para of txt.split(/(\n+)/)){
    if(!para)continue;
    if(para.length<=max){parts.push(para);continue}
    let cur="";
    for(const word of para.split(/(\s+)/)){
      if((cur+word).length>max&&cur){parts.push(cur);cur=word}
      else cur+=word;
    }
    if(cur)parts.push(cur);
  }
  return parts;
}
function T(txt){
  if(!txt)return txt;
  const raw=String(txt);
  if(lang==="fr")return protectProperNames(raw);
  const cached=trCache[raw];
  if(cached&&!isBadTranslation(cached,raw)){
    return protectProperNames(cached.replace(/\bComo\b/g,"Côme"));
  }
  if(cached)delete trCache[raw];
  if(trFailures<2&&!pending.has(raw)){pending.add(raw);if(!flushing)flush()}
  return protectProperNames(raw);
}
async function translateChunk(txt){
  try{
    if("Translator" in self){
      if(!nativeT)nativeT=Translator.create({sourceLanguage:"fr",targetLanguage:"en"});
      return await (await nativeT).translate(txt);
    }
  }catch(e){nativeT=null}
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair=fr|en",{signal:ctrl.signal});
    const j=await r.json();
    return j&&j.responseData&&j.responseData.translatedText;
  }finally{clearTimeout(timer)}
}
async function translateOne(txt){
  const parts=chunkText(txt,450);
  if(parts.length===1)return translateChunk(txt);
  const out=[];
  for(const p of parts){
    if(!p.trim()){out.push(p);continue}
    const r=await translateChunk(p);
    if(isBadTranslation(r,p))return r;
    out.push(r);
  }
  return out.join("");
}
async function flush(){
  flushing=true;let changed=false;
  while(pending.size&&trFailures<2){
    const batch=[...pending].slice(0,3);
    batch.forEach(x=>pending.delete(x));
    await Promise.all(batch.map(async txt=>{
      try{
        const r=await translateOne(txt);
        if(!isBadTranslation(r,txt)){
          trCache[txt]=protectProperNames(r.replace(/\bComo\b/g,"Côme"));
          changed=true;trFailures=0;
        }else if(r&&r.toUpperCase().includes("MYMEMORY WARNING")){trFailures=2}
      }catch(e){trFailures++}
    }));
  }
  if(trFailures>=2)pending.clear();

  if(changed){ls.set("somun_tr",trCache);softRender()}
}
